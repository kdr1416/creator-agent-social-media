<script>
const tl = gsap.timeline({paused:true});
const s1_near = {x: 290, y: 720}, s1_far = {x: 240, y: 760};
const s2_near = {x: 430, y: 720}, s2_far = {x: 480, y: 760};

function setArm(prefix, sx, sy, ex, ey, l1, l2, bend) {
  const dx = ex - sx, dy = ey - sy;
  const d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01);
  const a = Math.atan2(dy, dx);
  const b = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const x = sx + l1 * Math.cos(a + b * bend);
  const y = sy + l1 * Math.sin(a + b * bend);
  document.getElementById(prefix + '-upper').setAttribute('d', `M${sx},${sy}L${x},${y}`);
  document.getElementById(prefix + '-lower').setAttribute('d', `M${x},${y}L${ex},${ey}`);
  document.getElementById(prefix + '-hand').setAttribute('cx', ex);
  document.getElementById(prefix + '-hand').setAttribute('cy', ey);
}

function updateArms() {
  setArm('s1-near', 228, 647, s1_near.x, s1_near.y, 115, 115, 1);
  setArm('s1-far', 135, 650, s1_far.x, s1_far.y, 145, 145, 1);
  setArm('s2-near', 492, 647, s2_near.x, s2_near.y, 115, 115, -1);
  setArm('s2-far', 585, 650, s2_far.x, s2_far.y, 145, 145, -1);
}
updateArms();

// Initial states
gsap.set(['#titles', '#satellites'], {opacity: 0});
gsap.set('#satellites', {scale: 0.7, transformOrigin: '50% 50%'});
gsap.set('#titles', {y: -15});

// Choreography (6.469s)
// 0.0s - 1.2s: Students and titles reveal
tl.to('#titles', {opacity: 1, y: 0, duration: 0.6, ease: 'power2.out'}, 0.2)
  .to(s1_near, {x: 325, y: 685, duration: 0.8, ease: 'power2.inOut', onUpdate: updateArms}, 0.3)
  .to('#shared-device', {x: 10, duration: 0.8, ease: 'power2.inOut'}, 0.3)

// 1.2s - 3.5s: Handoff interaction - Student 1 slides device, Student 2 receives with hands
  .to(s1_near, {x: 335, y: 690, duration: 0.9, ease: 'power1.inOut', onUpdate: updateArms}, 1.2)
  .to('#shared-device', {x: 30, duration: 0.9, ease: 'power1.inOut'}, 1.2)
  .to(s2_near, {x: 385, y: 690, duration: 0.9, ease: 'power2.out', onUpdate: updateArms}, 1.4)
  .to('#s2-head', {rotation: -4, svgOrigin: '530 600', duration: 0.5}, 1.8)
  .to('#s1-head', {rotation: 3, svgOrigin: '190 600', duration: 0.5}, 2.0)

// 2.5s - 5.0s: Satellite icons expand outwards into active orbit
  .to('#satellites', {opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.2)'}, 2.5)
  .to('#satellites', {y: -8, duration: 1.4, yoyo: true, repeat: 1, ease: 'sine.inOut'}, 3.2)

// 5.0s - 6.469s: Shared appreciative hold
  .to(['#s1-head', '#s2-head'], {rotation: 0, duration: 0.6, ease: 'power2.out'}, 5.0);

window.__timelines = window.__timelines || {};
window.__timelines['scene09'] = tl;
</script>
