<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>S11 - Chuẩn bị thay vì chỉ sở hữu</title>
  <style>
    @font-face {
      font-family: 'SegoeUIBlack';
      src: url('assets/segoe-ui-black.ttf') format('truetype');
      font-weight: 900;
    }
    @font-face {
      font-family: 'ArialCustom';
      src: url('assets/arial.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 720px;
      height: 1280px;
      overflow: hidden;
      background: #FFF0E5;
      font-family: 'ArialCustom', sans-serif;
    }
    #canvas {
      position: relative;
      width: 720px;
      height: 1280px;
      background: #FFF0E5;
    }
    .title {
      position: absolute;
      top: 150px;
      left: 40px;
      width: 640px;
      text-align: center;
      font-family: 'SegoeUIBlack', sans-serif;
      font-size: 46px;
      color: #0870AC;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }
    .svg-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 1280px;
    }
  </style>
</head>
<body>
  <div id="canvas" class="clip" data-composition-id="root" data-start="0" data-duration="6.8118" data-fps="30" data-width="720" data-height="1280">
    <audio id="p11-audio" src="assets/voice.wav" class="clip" data-start="0" data-duration="6.8118"></audio>
    <div class="title" id="p11-title">CHUẨN BỊ CHO TƯƠNG LAI</div>

    <svg class="svg-scene" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
      <!-- Desk Structure at bottom -->
      <g id="p11-desk" transform="translate(60, 855) scale(2.8)">
        <rect x="0" y="0" width="215" height="24" rx="2" fill="#E2DEEB" stroke="#30313B" stroke-width="2.6"/>
        <line x1="20" y1="24" x2="15" y2="140" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
        <line x1="190" y1="24" x2="195" y2="140" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- House Key (Golden key on left desk surface) -->
      <g id="p11-key" transform="translate(100, 770)">
        <!-- Key head ring -->
        <circle cx="25" cy="25" r="22" fill="#FFCF77" stroke="#30313B" stroke-width="3"/>
        <circle cx="25" cy="25" r="9" fill="#FFF0E5" stroke="#30313B" stroke-width="2.5"/>
        <!-- Key shaft -->
        <path d="M47 25L105 25" stroke="#30313B" stroke-width="7" stroke-linecap="round"/>
        <!-- Key teeth -->
        <path d="M85 25V42M98 25V37" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- Open Backpack on the right desk surface -->
      <g id="p11-backpack" transform="translate(420, 540)">
        <!-- Backpack main body -->
        <path d="M20 90Q140 40 190 120L205 315H-10L-2 150Q2 110 20 90Z" fill="#8FC7D5" stroke="#30313B" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Front pouch -->
        <path d="M8 170Q95 210 185 170L180 295H12Z" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <!-- Open flap interior lining -->
        <path id="p11-backpack-flap" d="M12 165L25 105L165 100L185 165Z" fill="#FFF1D1" stroke="#30313B" stroke-width="3" stroke-linejoin="round"/>
        <!-- Zipper details -->
        <line x1="10" y1="168" x2="185" y2="168" stroke="#30313B" stroke-width="2.5" stroke-dasharray="4,3"/>
      </g>

      <!-- Study Notebook gliding into backpack -->
      <g id="p11-notebook" transform="translate(345, 470) scale(0.85)">
        <path d="M0 0L80 -25L170 0V130L80 110L0 130Z" fill="#FFFDF2" stroke="#30313B" stroke-width="3" stroke-linejoin="round"/>
        <path d="M80 -25L80 110" fill="none" stroke="#30313B" stroke-width="3"/>
        <path d="M14 24L59 11" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
        <path d="M14 48L59 35" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
        <path d="M100 16L155 29" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
        <path d="M100 40L155 53" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Student Mascot Rig -->
      <g id="p11-mascot" transform="translate(235, 780) scale(1.04)">
        <ellipse cx="63" cy="203" rx="65" ry="10" fill="#D7BDA8" opacity=".5"/>
        <path d="M48 143L41 190L18 194M90 143L98 190L120 194" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
        <!-- Backpack worn -->
        <rect x="103" y="50" width="39" height="91" rx="16" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <path d="M113 69L134 78" fill="none" stroke="#A2D8ED" stroke-width="3"/>
        <!-- Far arm (reaching to place key / pack) -->
        <g id="p11-mascot-arm-left" transform="translate(25, 72)">
          <path id="p11-far-arm-path" d="M0 0Q-35 25 -65 35" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="-65" cy="35" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
        <!-- Torso -->
        <path d="M21 31Q24 9 50 12L95 14Q123 16 122 46L115 121Q114 148 86 152L49 149Q20 148 17 123L13 58Q12 42 21 31Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
        <path d="M25 41Q30 25 49 26" fill="none" stroke="#FFD77B" stroke-width="5" stroke-linecap="round"/>
        <!-- Cap -->
        <path d="M28 28Q17-8 61-9Q108-13 116 27Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
        <path d="M17 29Q54 14 111 29L131 34Q138 40 127 42L35 39" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>
        <!-- Eyes -->
        <ellipse cx="52" cy="68" rx="4.6" ry="7" fill="#30313B"/>
        <ellipse cx="86" cy="67" rx="4.6" ry="7" fill="#30313B"/>
        <!-- Cheeks and Smile -->
        <ellipse cx="39" cy="87" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <ellipse cx="99" cy="86" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <path id="p11-mouth" d="M57 91Q70 105 82 88" fill="none" stroke="#30313B" stroke-width="3.3" stroke-linecap="round"/>
        <!-- Near arm (pointing to backpack) -->
        <g id="p11-mascot-arm-right" transform="translate(109, 83)">
          <path d="M0 0Q25 15 45 30" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="45" cy="30" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
      </g>
    </svg>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({paused: true});
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;

    // 0.0s: Initial setup
    gsap.set('#p11-key', {scale: 1.15, transformOrigin: 'center'});
    gsap.set('#p11-notebook', {x: 345, y: 470, opacity: 0.9});

    // 1.5s -> 2.0s: Mascot reaches hand down, settles key on table
    tl.to('#p11-mascot-arm-left', {y: 10, duration: 0.5, ease: 'power1.inOut'}, 1.2)
      .to('#p11-key', {scale: 1.0, duration: 0.4, ease: 'power2.out'}, 1.6);

    // 3.2s -> 4.5s: Notebook glides into open backpack pocket
    tl.to('#p11-notebook', {x: 430, y: 550, scale: 0.7, opacity: 0.8, duration: 1.2, ease: 'power2.inOut'}, 3.2)
      .to('#p11-mascot-arm-right', {rotation: -10, transformOrigin: '0 0', duration: 0.6, yoyo: true, repeat: 1}, 3.5);

    // 4.8s: Backpack flap settles slightly, indicating packed readiness
    tl.to('#p11-backpack-flap', {scaleY: 0.85, transformOrigin: 'bottom center', duration: 0.4, ease: 'power1.inOut'}, 4.8);

    // 5.2s -> 6.5s: Mascot nods with satisfaction and confidence
    tl.to('#p11-mouth', {scaleX: 1.15, transformOrigin: 'center', duration: 0.4}, 5.2)
      .to('#p11-mascot', {y: -4, duration: 0.35, yoyo: true, repeat: 3, ease: 'sine.inOut'}, 5.3);
  </script>
</body>
</html>
