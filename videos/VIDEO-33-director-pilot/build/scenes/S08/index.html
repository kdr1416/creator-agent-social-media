<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>S08 - Đến gần những kế hoạch</title>
  <style>
    @font-face {
      font-family: 'SegoeUIBlack';
      src: url('assets/segoe-ui-black.ttf') format('truetype');
      font-weight: 900;
    }
    @font-face {
      font-family: 'ArialCustom';
      src: url('assets/arial.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 720px;
      height: 1280px;
      overflow: hidden;
      background: #FFF0E5;
      font-family: 'ArialCustom', sans-serif;
    }
    #canvas {
      position: relative;
      width: 720px;
      height: 1280px;
      background: #FFF0E5;
    }
    .title {
      position: absolute;
      top: 150px;
      left: 40px;
      width: 640px;
      text-align: center;
      font-family: 'SegoeUIBlack', sans-serif;
      font-size: 50px;
      color: #0870AC;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }
    .svg-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 1280px;
    }
  </style>
</head>
<body>
  <div id="canvas" class="clip" data-composition-id="root" data-start="0" data-duration="5.4771" data-fps="30" data-width="720" data-height="1280">
    <audio id="p08-audio" src="assets/voice.wav" class="clip" data-start="0" data-duration="5.4771"></audio>
    <div class="title" id="p08-title">KẾ HOẠCH TƯƠNG LAI</div>

    <svg class="svg-scene" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
      <!-- Ground line at arrival hall -->
      <path d="M50 1008L670 1008" fill="none" stroke="#C4AD9B" stroke-width="3" stroke-linecap="round"/>

      <!-- Three future layered props (Học tập, Sinh sống, Làm việc) in mid-ground -->
      <!-- 1. Study Prop: Open notebook / book -->
      <g id="p08-prop-study" transform="translate(102, 440) scale(0.85)">
        <path d="M0 0L80 -25L170 0V130L80 110L0 130Z" fill="#FFFDF2" stroke="#30313B" stroke-width="3" stroke-linejoin="round"/>
        <path d="M80 -25L80 110" fill="none" stroke="#30313B" stroke-width="3"/>
        <path d="M14 24L59 11" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
        <path d="M14 48L59 35" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
        <path d="M100 16L155 29" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
        <path d="M100 40L155 53" fill="none" stroke="#CFC3B1" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 2. Living Prop: Townhouse outline -->
      <g id="p08-prop-living" transform="translate(295, 395) scale(0.72)">
        <path d="M6 105L86 57L176 105V212H6Z" fill="#FFD59B" stroke="#30313B" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M-13 107L85 30L195 107L176 122L86 61L5 122Z" fill="#D48DA2" stroke="#30313B" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M122 60V25H147V79" fill="#E2B6B1" stroke="#30313B" stroke-width="3"/>
        <path d="M73 212V149Q93 132 111 149V212" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <path d="M25 132H54V169H25ZM133 132H162V169H133Z" fill="#FFFBEA" stroke="#30313B" stroke-width="2.6"/>
        <circle cx="101" cy="174" r="3.2" fill="#FFCD71"/>
      </g>

      <!-- 3. Work Prop: Briefcase / satchel -->
      <g id="p08-prop-work" transform="translate(516, 455) scale(0.95)">
        <rect x="0" y="20" width="102" height="78" rx="9" fill="#A8CDB9" stroke="#30313B" stroke-width="3"/>
        <path d="M30 20V4H72V20" fill="none" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="48" x2="102" y2="48" stroke="#30313B" stroke-width="2.5"/>
        <rect x="44" y="42" width="14" height="12" rx="2" fill="#FFD77B" stroke="#30313B" stroke-width="2"/>
      </g>

      <!-- Luggage suitcase (rolling in from left) -->
      <g id="p08-luggage" transform="translate(107, 800)">
        <!-- Handle -->
        <path d="M28 0V-42H74V0" fill="none" stroke="#30313B" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Case body -->
        <rect x="0" y="0" width="102" height="174" rx="16" fill="#9ED3DC" stroke="#30313B" stroke-width="3.5"/>
        <!-- Straps / grooves -->
        <line x1="26" y1="20" x2="26" y2="154" stroke="#7AB6C2" stroke-width="3" stroke-linecap="round"/>
        <line x1="76" y1="20" x2="76" y2="154" stroke="#7AB6C2" stroke-width="3" stroke-linecap="round"/>
        <!-- Wheels -->
        <ellipse cx="22" cy="186" rx="9" ry="9" fill="#30313B"/>
        <ellipse cx="80" cy="186" rx="9" ry="9" fill="#30313B"/>
      </g>

      <!-- Parent Arriving Puppet (Lilac/violet outfit) -->
      <g id="p08-parent" transform="translate(254, 872) scale(1.75)">
        <!-- Head -->
        <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.3"/>
        <!-- Torso -->
        <path d="M-23 9V-10Q-22-27 0-27Q22-27 23-10V9Z" fill="#B4A0D2" stroke="#30313B" stroke-width="2.3"/>
        <!-- Legs -->
        <path d="M-7 9V27M8 9V27" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
        <!-- Face -->
        <circle cx="-5" cy="-45" r="1.5" fill="#30313B"/>
        <circle cx="5" cy="-45" r="1.5" fill="#30313B"/>
        <path d="M-5 -36Q0 -32 5 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
        <!-- Greeting arm extending towards mascot -->
        <g id="p08-parent-arm">
          <path d="M18 -5Q35 0 44 -12" fill="none" stroke="#30313B" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="44" cy="-12" r="4" fill="#FFD5AA" stroke="#30313B" stroke-width="1.5"/>
        </g>
      </g>

      <!-- Student Mascot Rig (Hoodie, cap, standing welcoming) -->
      <g id="p08-mascot" transform="translate(415, 798) scale(1.05)">
        <!-- Shadow -->
        <ellipse cx="63" cy="203" rx="65" ry="10" fill="#D7BDA8" opacity=".5"/>
        <!-- Legs -->
        <path d="M48 143L41 190L18 194M90 143L98 190L120 194" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
        <!-- Backpack -->
        <rect x="103" y="50" width="39" height="91" rx="16" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <path d="M113 69L134 78" fill="none" stroke="#A2D8ED" stroke-width="3"/>
        <!-- Far arm reaching out to touch greeting hand -->
        <g id="p08-mascot-reach-arm" transform="translate(25, 72)">
          <path d="M0 0Q-30 -5 -50 -18" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="-50" cy="-18" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
        <!-- Torso -->
        <path d="M21 31Q24 9 50 12L95 14Q123 16 122 46L115 121Q114 148 86 152L49 149Q20 148 17 123L13 58Q12 42 21 31Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
        <path d="M25 41Q30 25 49 26" fill="none" stroke="#FFD77B" stroke-width="5" stroke-linecap="round"/>
        <!-- Cap -->
        <path d="M28 28Q17-8 61-9Q108-13 116 27Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
        <path d="M17 29Q54 14 111 29L131 34Q138 40 127 42L35 39" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>
        <!-- Eyes -->
        <ellipse cx="50" cy="68" rx="4.6" ry="7" fill="#30313B"/>
        <ellipse cx="84" cy="67" rx="4.6" ry="7" fill="#30313B"/>
        <!-- Cheeks and Smile -->
        <ellipse cx="37" cy="87" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <ellipse cx="97" cy="86" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <path d="M55 91Q68 105 80 88" fill="none" stroke="#30313B" stroke-width="3.3" stroke-linecap="round"/>
        <!-- Near arm -->
        <g transform="translate(109, 83)">
          <path d="M0 0Q18 22 35 6" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="35" cy="6" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
      </g>
    </svg>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({paused: true});
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;

    // 0.0s - Initial setup: luggage rolls in from left
    gsap.set('#p08-luggage', {x: -60});
    gsap.set('#p08-parent', {x: 200});
    gsap.set('#p08-prop-study', {scale: 0.85, transformOrigin: 'center bottom'});
    gsap.set('#p08-prop-living', {scale: 0.72, transformOrigin: 'center bottom'});
    gsap.set('#p08-prop-work', {scale: 0.95, transformOrigin: 'center bottom'});

    // 0.0s -> 1.37s: Luggage and parent arrive into position
    tl.to('#p08-luggage', {x: 107, duration: 1.35, ease: 'power2.out'}, 0)
      .to('#p08-parent', {x: 254, duration: 1.35, ease: 'power2.out'}, 0);

    // 1.37s: Parent and mascot meet hands in greeting gesture
    tl.to('#p08-parent-arm', {rotation: 8, transformOrigin: '18px -5px', duration: 0.4, ease: 'power1.out'}, 1.35)
      .to('#p08-mascot-reach-arm', {y: -8, duration: 0.4, ease: 'power1.out'}, 1.35)
      .to('#p08-mascot', {y: -6, yoyo: true, repeat: 1, duration: 0.3}, 1.4);

    // 3.1s: Sequential prop highlights (Study -> Living -> Work)
    // 1. Study
    tl.to('#p08-prop-study', {scale: 0.98, duration: 0.35, yoyo: true, repeat: 1, ease: 'power1.out'}, 3.1);

    // 2. Living
    tl.to('#p08-prop-living', {scale: 0.82, duration: 0.35, yoyo: true, repeat: 1, ease: 'power1.out'}, 3.8);

    // 3. Work
    tl.to('#p08-prop-work', {scale: 1.08, duration: 0.35, yoyo: true, repeat: 1, ease: 'power1.out'}, 4.5);
  </script>
</body>
</html>
