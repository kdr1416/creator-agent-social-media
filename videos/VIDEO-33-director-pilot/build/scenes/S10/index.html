<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>S10 - Gia đình nhiều thế hệ</title>
  <style>
    @font-face {
      font-family: 'SegoeUIBlack';
      src: url('assets/segoe-ui-black.ttf') format('truetype');
      font-weight: 900;
    }
    @font-face {
      font-family: 'ArialCustom';
      src: url('assets/arial.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 720px;
      height: 1280px;
      overflow: hidden;
      background: #FFF8E9;
      font-family: 'ArialCustom', sans-serif;
    }
    #canvas {
      position: relative;
      width: 720px;
      height: 1280px;
      background: #FFF8E9;
    }
    .header-box {
      position: absolute;
      top: 130px;
      left: 40px;
      width: 640px;
      text-align: center;
    }
    .title {
      font-family: 'SegoeUIBlack', sans-serif;
      font-size: 50px;
      color: #0870AC;
      letter-spacing: 1.5px;
      line-height: 1.15;
    }
    .subtitle {
      font-family: 'ArialCustom', sans-serif;
      font-weight: bold;
      font-size: 30px;
      color: #0870AC;
      margin-top: 10px;
      opacity: 0.9;
    }
    .svg-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 1280px;
    }
  </style>
</head>
<body>
  <div id="canvas" class="clip" data-composition-id="root" data-start="0" data-duration="6.1568" data-fps="30" data-width="720" data-height="1280">
    <audio id="p10-audio" src="assets/voice.wav" class="clip" data-start="0" data-duration="6.1568"></audio>
    <div class="header-box">
      <div class="title" id="p10-title">TỚI 4 THẾ HỆ</div>
      <div class="subtitle" id="p10-cond">Theo điều kiện MPRP</div>
    </div>

    <svg class="svg-scene" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
      <!-- Family Album open spread -->
      <g id="p10-album">
        <!-- Album cover shadow -->
        <polygon points="70,395 354,355 650,412 650,974 354,1025 70,976" fill="#D3C3AF" opacity="0.6"/>
        <!-- Left & Right pages -->
        <polygon points="77,390 354,350 644,407 644,968 354,1019 77,970" fill="#FFFDF2" stroke="#30313B" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Spine binding crease -->
        <line x1="354" y1="350" x2="354" y2="1019" stroke="#D1BA9D" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Genealogical Tree Connectors -->
      <g id="p10-connectors" stroke="#BAA58C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Connector between Grandparents -->
        <line id="p10-conn-gp" x1="160" y1="520" x2="269" y2="520"/>
        <!-- Line down to Parent generation -->
        <line id="p10-conn-p" x1="214" y1="520" x2="214" y2="600"/>
        <!-- Cross-page branch to Applicant couple -->
        <path id="p10-conn-app" d="M214 687 V715 H481 V730"/>
        <!-- Branch to Child generation -->
        <line id="p10-conn-child" x1="481" y1="815" x2="481" y2="876"/>
      </g>

      <!-- Gen 1: Grandparents (Top Left page) -->
      <g id="p10-gen-gp" opacity="0">
        <!-- Grandfather -->
        <g transform="translate(160, 487) scale(0.9)">
          <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-23 9V-10Q-22-27 0-27Q22-27 23-10V9Z" fill="#9BC9D4" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-7 9V27M8 9V27" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-5" cy="-45" r="1.5" fill="#30313B"/>
          <circle cx="5" cy="-45" r="1.5" fill="#30313B"/>
          <path d="M-5 -36Q0 -32 5 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <!-- Grandmother -->
        <g transform="translate(269, 487) scale(0.9)">
          <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-23 9V-10Q-22-27 0-27Q22-27 23-10V9Z" fill="#C5ACD7" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-7 9V27M8 9V27" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-5" cy="-45" r="1.5" fill="#30313B"/>
          <circle cx="5" cy="-45" r="1.5" fill="#30313B"/>
          <path d="M-5 -36Q0 -32 5 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Gen 2: Parents (Mid Left page) -->
      <g id="p10-gen-parents" opacity="0">
        <g transform="translate(214, 654) scale(1.0)">
          <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-23 9V-10Q-22-27 0-27Q22-27 23-10V9Z" fill="#E9B4B0" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-7 9V27M8 9V27" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-5" cy="-45" r="1.5" fill="#30313B"/>
          <circle cx="5" cy="-45" r="1.5" fill="#30313B"/>
          <path d="M-5 -36Q0 -32 5 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Gen 3: Main Applicant Couple (Right page) -->
      <g id="p10-gen-applicant" opacity="1">
        <!-- Applicant Husband -->
        <g transform="translate(421, 772) scale(1.0)">
          <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-23 9V-10Q-22-27 0-27Q22-27 23-10V9Z" fill="#9BC9D4" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-7 9V27M8 9V27" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-5" cy="-45" r="1.5" fill="#30313B"/>
          <circle cx="5" cy="-45" r="1.5" fill="#30313B"/>
          <path d="M-5 -36Q0 -32 5 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <!-- Applicant Wife -->
        <g transform="translate(539, 772) scale(1.0)">
          <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-23 9V-10Q-22-27 0-27Q22-27 23-10V9Z" fill="#C5ACD7" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-7 9V27M8 9V27" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-5" cy="-45" r="1.5" fill="#30313B"/>
          <circle cx="5" cy="-45" r="1.5" fill="#30313B"/>
          <path d="M-5 -36Q0 -32 5 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Gen 4: Child (Bottom Right page) -->
      <g id="p10-gen-child" opacity="0">
        <g transform="translate(481, 928) scale(0.75)">
          <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-23 9V-10Q-22-27 0-27Q22-27 23-10V9Z" fill="#FFBC63" stroke="#30313B" stroke-width="2.3"/>
          <path d="M-7 9V27M8 9V27" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-5" cy="-45" r="1.5" fill="#30313B"/>
          <circle cx="5" cy="-45" r="1.5" fill="#30313B"/>
          <path d="M-5 -36Q0 -32 5 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Mascot Rig holding edge of album at right -->
      <g id="p10-mascot" transform="translate(540, 850) scale(0.72)">
        <ellipse cx="63" cy="203" rx="65" ry="10" fill="#D7BDA8" opacity=".5"/>
        <path d="M48 143L41 190L18 194M90 143L98 190L120 194" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
        <rect x="103" y="50" width="39" height="91" rx="16" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <path d="M113 69L134 78" fill="none" stroke="#A2D8ED" stroke-width="3"/>
        <!-- Arm supporting the album page -->
        <g transform="translate(25, 72)">
          <path d="M0 0Q-35 -12 -55 -28" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="-55" cy="-28" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
        <path d="M21 31Q24 9 50 12L95 14Q123 16 122 46L115 121Q114 148 86 152L49 149Q20 148 17 123L13 58Q12 42 21 31Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
        <path d="M25 41Q30 25 49 26" fill="none" stroke="#FFD77B" stroke-width="5" stroke-linecap="round"/>
        <path d="M28 28Q17-8 61-9Q108-13 116 27Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
        <path d="M17 29Q54 14 111 29L131 34Q138 40 127 42L35 39" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>
        <ellipse cx="50" cy="68" rx="4.6" ry="7" fill="#30313B"/>
        <ellipse cx="84" cy="67" rx="4.6" ry="7" fill="#30313B"/>
        <ellipse cx="37" cy="87" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <ellipse cx="97" cy="86" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <path d="M55 91Q68 105 80 88" fill="none" stroke="#30313B" stroke-width="3.3" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({paused: true});
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;

    // Initial state
    gsap.set(['#p10-gen-child', '#p10-gen-parents', '#p10-gen-gp'], {opacity: 0});
    gsap.set(['#p10-conn-child', '#p10-conn-p', '#p10-conn-gp'], {opacity: 0});
    gsap.set('#p10-cond', {opacity: 0, y: 10});

    // 0.0s -> 1.5s: Main applicant couple is visible, album slightly adjusts
    tl.to('#p10-album', {scale: 1.02, transformOrigin: 'center', duration: 1.2, ease: 'power1.out'}, 0);

    // 1.5s: Connectors extend down to Child generation
    tl.to('#p10-conn-child', {opacity: 1, duration: 0.3}, 1.5)
      .to('#p10-gen-child', {opacity: 1, duration: 0.4, ease: 'power2.out'}, 1.6);

    // 2.6s: Connector branches across to Parents generation
    tl.to('#p10-conn-p', {opacity: 1, duration: 0.3}, 2.6)
      .to('#p10-gen-parents', {opacity: 1, duration: 0.4, ease: 'power2.out'}, 2.7);

    // 3.7s: Connector branches up to Grandparents generation -> completes 4 generations!
    tl.to('#p10-conn-gp', {opacity: 1, duration: 0.3}, 3.7)
      .to('#p10-gen-gp', {opacity: 1, duration: 0.4, ease: 'power2.out'}, 3.8);

    // 4.2s: Condition subtitle "Theo điều kiện MPRP" smoothly appears
    tl.to('#p10-cond', {opacity: 0.95, y: 0, duration: 0.6, ease: 'power2.out'}, 4.2);

    // 4.5s -> 6.0s: Mascot gently nods in affirmation
    tl.to('#p10-mascot', {y: -4, duration: 0.3, yoyo: true, repeat: 3, ease: 'sine.inOut'}, 4.5);
  </script>
</body>
</html>
