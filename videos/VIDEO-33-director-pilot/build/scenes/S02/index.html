<script>
(()=>{
  const tl = gsap.timeline({paused:true});

  // 1. Initial title entry
  tl.fromTo('#p02-title', {rotation:-2, y:12, opacity:0}, {rotation:-1, y:0, opacity:1, duration:0.32, ease:'back.out(1.2)'}, 0.12);

  // 2. Base coin stack appears (coins 1, 2, 3)
  tl.fromTo('#p02-c1', {scaleY:0.2, opacity:0, svgOrigin:'485 810'}, {scaleY:1, opacity:1, duration:0.35, ease:'power2.out'}, 0.2);
  tl.fromTo('#p02-c2', {y:-30, opacity:0}, {y:0, opacity:1, duration:0.3, ease:'bounce.out'}, 0.45);
  tl.fromTo('#p02-c3', {y:-35, opacity:0}, {y:0, opacity:1, duration:0.3, ease:'bounce.out'}, 0.75);

  // 3. Rolling coins roll across ledger from left to right (0.96s -> 1.8s)
  tl.fromTo('#p02-coin-r1', {x:-80, y:20, rotation:-120, opacity:0}, {x:120, y:0, rotation:0, opacity:1, duration:0.75, ease:'power1.inOut'}, 0.95);
  tl.fromTo('#p02-coin-r2', {x:-90, y:10, rotation:-150, opacity:0}, {x:90, y:0, rotation:0, opacity:1, duration:0.72, ease:'power1.inOut'}, 1.15);
  tl.fromTo('#p02-coin-r3', {x:-100, y:0, rotation:-180, opacity:0}, {x:60, y:0, rotation:0, opacity:1, duration:0.7, ease:'power1.inOut'}, 1.35);

  // 4. Stacking up higher (coins 4, 5, 6) under "hàng tỷ đồng" (1.8s -> 2.5s)
  tl.to('#p02-rolling-coins', {opacity:0, scale:0.8, duration:0.25}, 1.95);
  tl.fromTo('#p02-c4', {y:-40, opacity:0}, {y:0, opacity:1, duration:0.3, ease:'bounce.out'}, 1.9);
  tl.fromTo('#p02-c5', {y:-45, opacity:0}, {y:0, opacity:1, duration:0.3, ease:'bounce.out'}, 2.15);
  tl.fromTo('#p02-c6', {y:-50, opacity:0}, {y:0, opacity:1, duration:0.35, ease:'bounce.out'}, 2.4);

  // Page flex / sag under coin stack weight
  tl.to('#p02-page-surface', {scaleY:1.02, y:4, duration:0.4, ease:'power2.out'}, 2.2);
  tl.to('#p02-sag-lines', {opacity:0.8, duration:0.35}, 2.3);

  // 5. Wooden measuring ruler slides down to measure stack height (2.3s -> 3.1s)
  tl.fromTo('#p02-ruler', {y:-90, opacity:0, rotation:6}, {y:0, opacity:1, rotation:0, duration:0.65, ease:'back.out(1.1)'}, 2.35);

  // Hold cleanly till end
  tl.to({hold:0}, {hold:1, duration:3.8555, ease:'none'}, 0);

  window.__timelines['v33-s02'] = tl;
})();
</script>
