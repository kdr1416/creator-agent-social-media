<script>
(()=>{
  const tl = gsap.timeline({paused:true});

  // 1. Title entry
  tl.fromTo('#p03-title', {rotation:-2, y:12, opacity:0}, {rotation:-1, y:0, opacity:1, duration:0.32, ease:'back.out(1.2)'}, 0.12);

  // 2. Initial state: S-road fold unrolls from bottom left upwards (0.2s -> 1.5s)
  tl.fromTo('#p03-road-base', {scaleX:0.2, scaleY:0.3, opacity:0, svgOrigin:'150 940'}, {scaleX:1, scaleY:1, opacity:1, duration:1.1, ease:'power2.out'}, 0.25);
  tl.fromTo('#p03-road-dash', {opacity:0}, {opacity:1, duration:0.6}, 0.8);

  // 3. Study desk pops up first (1.06s)
  tl.fromTo('#p03-study-desk', {scale:0.1, opacity:0, svgOrigin:'250 780'}, {scale:1, opacity:1, duration:0.75, ease:'back.out(1.15)'}, 1.05);

  // 4. Mascot gestures forward, eyes look along S-road
  tl.to('#p03-far-path', {attr:{d:'M0 0Q40-35 85-50'}, duration:0.65, ease:'power2.inOut'}, 1.2);
  tl.to('#p03-far-hand', {attr:{cx:85, cy:-50}, duration:0.65, ease:'power2.inOut'}, 1.2);
  tl.to('#p03-eyes', {x:5, y:-4, duration:0.5}, 1.3);

  // 5. Practice desk appears on upper road (2.5s)
  tl.fromTo('#p03-practice-desk', {scale:0.1, opacity:0, svgOrigin:'530 500'}, {scale:1, opacity:1, duration:0.75, ease:'back.out(1.15)'}, 2.45);

  // 6. Open-ended future path dashed ahead extends into distance (2.7s -> 3.5s)
  tl.fromTo('#p03-future-path', {opacity:0, scaleY:0.2, svgOrigin:'555 415'}, {opacity:1, scaleY:1, duration:0.8, ease:'power2.out'}, 2.65);

  // Hold cleanly till end of voice
  tl.to({hold:0}, {hold:1, duration:4.2458, ease:'none'}, 0);

  window.__timelines['v33-s03'] = tl;
})();
</script>
