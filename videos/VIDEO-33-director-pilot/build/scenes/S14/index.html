<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>S14 - Có thêm một lựa chọn</title>
  <style>
    @font-face {
      font-family: 'SegoeUIBlack';
      src: url('assets/segoe-ui-black.ttf') format('truetype');
      font-weight: 900;
    }
    @font-face {
      font-family: 'ArialCustom';
      src: url('assets/arial.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 720px;
      height: 1280px;
      overflow: hidden;
      background: #FFF0E5;
      font-family: 'ArialCustom', sans-serif;
    }
    #canvas {
      position: relative;
      width: 720px;
      height: 1280px;
      background: #FFF0E5;
    }
    .title {
      position: absolute;
      top: 150px;
      left: 40px;
      width: 640px;
      text-align: center;
      font-family: 'SegoeUIBlack', sans-serif;
      font-size: 50px;
      color: #0870AC;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }
    .svg-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 1280px;
    }
  </style>
</head>
<body>
  <div id="canvas" class="clip" data-composition-id="root" data-start="0" data-duration="6.8556" data-fps="30" data-width="720" data-height="1280">
    <audio id="p14-audio" src="assets/voice.wav" class="clip" data-start="0" data-duration="6.8556"></audio>
    <div class="title" id="p14-title">THÊM MỘT LỰA CHỌN</div>

    <svg class="svg-scene" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
      <!-- Ground line -->
      <line x1="40" y1="1025" x2="680" y2="1025" stroke="#C4AD9B" stroke-width="3" stroke-linecap="round"/>

      <!-- Townhouse illustration on left (Căn nhà giấy) -->
      <g id="p14-house" transform="translate(68, 560)">
        <!-- Chimney -->
        <path d="M122 60V25H147V79" fill="#E2B6B1" stroke="#30313B" stroke-width="3"/>
        <!-- Main wall -->
        <path d="M6 105L86 57L176 105V212H6Z" fill="#FFD59B" stroke="#30313B" stroke-width="3.4" stroke-linejoin="round"/>
        <!-- Roof -->
        <path d="M-13 107L85 30L195 107L176 122L86 61L5 122Z" fill="#D48DA2" stroke="#30313B" stroke-width="3.4" stroke-linejoin="round"/>
        <!-- Door -->
        <path d="M73 212V149Q93 132 111 149V212" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <circle cx="101" cy="174" r="3.2" fill="#FFCD71"/>
        <!-- Windows -->
        <path d="M25 132H54V169H25ZM133 132H162V169H133Z" fill="#FFFBEA" stroke="#30313B" stroke-width="2.6"/>
        <path d="M39 133V168M26 150H53M147 133V168M134 150H161" stroke="#C69F8B" stroke-width="2"/>
      </g>

      <!-- Folded Choice Plan Document on right (Bản kế hoạch mở hai hướng) -->
      <g id="p14-choice-plan" transform="translate(0, 0)">
        <!-- Paper plan surface -->
        <polygon points="336,538 463,487 642,567 642,967 465,1012 336,928" fill="#FFF9DD" stroke="#30313B" stroke-width="3.2" stroke-linejoin="round"/>
        <!-- Fold line -->
        <line x1="464" y1="488" x2="465" y2="1012" stroke="#E2D4B5" stroke-width="3"/>
        
        <!-- Trunk base -->
        <path d="M465 1004V757" stroke="#A7C4BC" stroke-width="16" stroke-linecap="round"/>
        
        <!-- Branch A (Left direction) -->
        <path d="M465 757C465 651 372 704 373 607" fill="none" stroke="#A7C4BC" stroke-width="16" stroke-linecap="round"/>
        
        <!-- Branch B (Right direction - Fresh Choice open horizon) -->
        <path id="p14-branch-b" d="M465 757C468 675 574 710 574 611" fill="none" stroke="#48BB78" stroke-width="16" stroke-linecap="round"/>
        
        <!-- Glowing marker at top of Branch B -->
        <circle id="p14-choice-star" cx="574" cy="611" r="9" fill="#087BC1" opacity="0"/>
      </g>

      <!-- House Key on surface -->
      <g id="p14-key" transform="translate(305, 835)">
        <circle cx="12" cy="12" r="11" fill="#FFCE75" stroke="#30313B" stroke-width="2.6"/>
        <path d="M23 12L48 12" stroke="#30313B" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M40 12V20M46 12V17" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Mascot Rig in Center -->
      <g id="p14-mascot" transform="translate(245, 810) scale(1.05)">
        <ellipse cx="63" cy="203" rx="65" ry="10" fill="#D7BDA8" opacity=".5"/>
        <path d="M48 143L41 190L18 194M90 143L98 190L120 194" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
        <rect x="103" y="50" width="39" height="91" rx="16" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <path d="M113 69L134 78" fill="none" stroke="#A2D8ED" stroke-width="3"/>
        <!-- Far arm (placing key) -->
        <g id="p14-mascot-left-arm" transform="translate(25, 72)">
          <path d="M0 0Q15 25 35 30" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="35" cy="30" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
        <path d="M21 31Q24 9 50 12L95 14Q123 16 122 46L115 121Q114 148 86 152L49 149Q20 148 17 123L13 58Q12 42 21 31Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
        <path d="M25 41Q30 25 49 26" fill="none" stroke="#FFD77B" stroke-width="5" stroke-linecap="round"/>
        <path d="M28 28Q17-8 61-9Q108-13 116 27Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
        <path d="M17 29Q54 14 111 29L131 34Q138 40 127 42L35 39" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>
        <!-- Eyes looking rightward towards choice plan -->
        <g id="p14-eyes">
          <ellipse cx="56" cy="68" rx="4.6" ry="7" fill="#30313B"/>
          <ellipse cx="90" cy="67" rx="4.6" ry="7" fill="#30313B"/>
        </g>
        <ellipse cx="40" cy="87" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <ellipse cx="100" cy="86" rx="10" ry="5" fill="#EE7C47" opacity=".65"/>
        <path id="p14-mouth" d="M57 91Q70 105 82 88" fill="none" stroke="#30313B" stroke-width="3.3" stroke-linecap="round"/>
        <!-- Near arm (opening fold towards choice plan) -->
        <g id="p14-mascot-right-arm" transform="translate(109, 83)">
          <path d="M0 0Q25 10 50 -10" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="50" cy="-10" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
      </g>
    </svg>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({paused: true});
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;

    // 0.0s: Initial setup
    gsap.set('#p14-choice-star', {opacity: 0, scale: 0.5});
    gsap.set('#p14-branch-b', {stroke: '#A7C4BC'});

    // 1.5s -> 2.2s: Mascot sets key down calmly
    tl.to('#p14-key', {y: 845, duration: 0.5, ease: 'power2.out'}, 1.5)
      .to('#p14-mascot-left-arm', {y: 10, duration: 0.5, ease: 'power1.out'}, 1.5);

    // 3.8s -> 4.8s: Mascot's right arm gestures towards Branch B, and Branch B lights up green!
    tl.to('#p14-mascot-right-arm', {rotation: -10, transformOrigin: '0 0', duration: 0.6, ease: 'power2.out'}, 3.8)
      .to('#p14-branch-b', {stroke: '#087BC1', strokeWidth: 18, duration: 0.7, ease: 'power1.out'}, 4.0)
      .to('#p14-choice-star', {opacity: 1, scale: 1.2, transformOrigin: 'center', duration: 0.5}, 4.4);

    // 5.2s -> 6.8s: Mascot smiles calmly, looking at the open horizon
    tl.to('#p14-eyes', {y: -2, duration: 0.4, yoyo: true, repeat: 2, ease: 'sine.inOut'}, 5.2)
      .to('#p14-mouth', {scaleX: 1.15, transformOrigin: 'center', duration: 0.4}, 5.4);
  </script>
</body>
</html>
