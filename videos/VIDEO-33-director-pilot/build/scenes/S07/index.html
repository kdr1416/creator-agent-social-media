<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>S07 - Giữ một điểm kết nối</title>
  <style>
    @font-face {
      font-family: 'SegoeUIBlack';
      src: url('assets/segoe-ui-black.ttf') format('truetype');
      font-weight: 900;
    }
    @font-face {
      font-family: 'ArialCustom';
      src: url('assets/arial.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 720px;
      height: 1280px;
      overflow: hidden;
      background: #FFF8E9;
      font-family: 'ArialCustom', sans-serif;
    }
    #canvas {
      position: relative;
      width: 720px;
      height: 1280px;
      background: #FFF8E9;
    }
    .title {
      position: absolute;
      top: 150px;
      left: 60px;
      width: 600px;
      text-align: center;
      font-family: 'SegoeUIBlack', sans-serif;
      font-size: 52px;
      color: #0870AC;
      letter-spacing: 2px;
      line-height: 1.2;
    }
    .svg-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 1280px;
    }
  </style>
</head>
<body>
  <div id="canvas" class="clip" data-composition-id="root" data-start="0" data-duration="4.6688" data-fps="30" data-width="720" data-height="1280">
    <audio id="p07-audio" src="assets/voice.wav" class="clip" data-start="0" data-duration="4.6688"></audio>
    <div class="title" id="p07-title">KẾT NỐI</div>

    <svg class="svg-scene" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
      <!-- Desk structure at bottom (Bàn làm việc lilac / pastel) -->
      <g id="p07-desk" transform="translate(90, 890) scale(2.6)">
        <rect x="0" y="0" width="208" height="24" rx="2" fill="#E4DCEB" stroke="#30313B" stroke-width="2.6"/>
        <line x1="20" y1="24" x2="16" y2="140" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
        <line x1="185" y1="24" x2="189" y2="140" stroke="#30313B" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Laptop assembly -->
      <g id="p07-laptop">
        <!-- Keyboard base deck -->
        <path d="M145 795L90 865H630L575 795Z" fill="#E8DEC8" stroke="#30313B" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="310" y="820" width="100" height="32" rx="4" fill="#D3C7AE" stroke="#30313B" stroke-width="2"/>
        
        <!-- Screen bezel back / lid -->
        <rect x="140" y="450" width="440" height="345" rx="14" fill="#ABCFDC" stroke="#30313B" stroke-width="3.5"/>
        
        <!-- Inner screen glass -->
        <rect id="p07-screen-glass" x="162" y="474" width="396" height="297" rx="8" fill="#EFE8D8" stroke="#30313B" stroke-width="2.5"/>

        <!-- Screen offline state (Faint placeholder before connection) -->
        <g id="p07-screen-offline" opacity="1">
          <circle cx="360" cy="580" r="38" fill="#D9D2C2"/>
          <path d="M305 670C305 625, 415 625, 415 670Z" fill="#D9D2C2"/>
          <line x1="260" y1="710" x2="460" y2="710" stroke="#C4BCAB" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Screen online video call (Active Family Call with warm illumination) -->
        <g id="p07-screen-online" opacity="0">
          <!-- Warm luminous call background -->
          <rect x="164" y="476" width="392" height="293" rx="6" fill="#FFFBEA"/>
          <!-- Subtle call header UI -->
          <circle cx="185" cy="495" r="5" fill="#48BB78"/>
          <line x1="200" y1="495" x2="260" y2="495" stroke="#B0A692" stroke-width="2" stroke-linecap="round"/>
          
          <!-- Parent 1 (Lilac sweater) -->
          <g id="p07-call-p1" transform="translate(290, 665) scale(1.65)">
            <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.2"/>
            <path d="M-22 9V-10Q-22-26 0-26Q22-26 22-10V9Z" fill="#B7A1D7" stroke="#30313B" stroke-width="2.2"/>
            <!-- Face -->
            <circle cx="-5" cy="-45" r="1.6" fill="#30313B"/>
            <circle cx="5" cy="-45" r="1.6" fill="#30313B"/>
            <path d="M-4 -36Q0 -32 4 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
            <!-- Waving arm -->
            <g id="p07-arm-wave1">
              <path d="M-18 -8Q-32 -25 -26 -40" fill="none" stroke="#30313B" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="-26" cy="-40" r="4.5" fill="#FFD5AA" stroke="#30313B" stroke-width="1.8"/>
            </g>
          </g>

          <!-- Parent 2 (Mint sweater) -->
          <g id="p07-call-p2" transform="translate(425, 672) scale(1.4)">
            <circle cx="0" cy="-44" r="16" fill="#FFD5AA" stroke="#30313B" stroke-width="2.2"/>
            <path d="M-22 9V-10Q-22-26 0-26Q22-26 22-10V9Z" fill="#ABD4C0" stroke="#30313B" stroke-width="2.2"/>
            <circle cx="-5" cy="-45" r="1.6" fill="#30313B"/>
            <circle cx="5" cy="-45" r="1.6" fill="#30313B"/>
            <path d="M-4 -36Q0 -32 4 -36" fill="none" stroke="#30313B" stroke-width="1.6" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- Cable connection path (from laptop USB port at 145, 780 to mascot hand at 335, 935) -->
      <path id="p07-cable" d="M145 780C75 790, 85 950, 330 940" fill="none" stroke="#087BC1" stroke-width="6.5" stroke-linecap="round"/>
      
      <!-- Blue pulse ripple along cable -->
      <circle id="p07-cable-pulse" cx="145" cy="780" r="9" fill="#087BC1" opacity="0"/>

      <!-- Mascot Rig (Sitting/standing near desk looking at laptop screen) -->
      <g id="p07-mascot" transform="translate(415, 810) scale(1.02)">
        <!-- Shadow -->
        <ellipse cx="63" cy="200" rx="65" ry="10" fill="#D7BDA8" opacity=".5"/>
        <!-- Legs -->
        <path d="M48 143L41 190L18 194M90 143L98 190L120 194" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
        <!-- Backpack -->
        <rect x="103" y="50" width="39" height="91" rx="16" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
        <path d="M113 69L134 78" fill="none" stroke="#A2D8ED" stroke-width="3"/>
        <!-- Far arm (holding the cable end) -->
        <g id="p07-mascot-far-arm" transform="translate(25, 72)">
          <path id="p07-far-path" d="M0 0Q-35 25 -75 55" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle id="p07-plug" cx="-75" cy="55" r="8" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
        <!-- Mascot Torso (Yellow hoodie) -->
        <path d="M21 31Q24 9 50 12L95 14Q123 16 122 46L115 121Q114 148 86 152L49 149Q20 148 17 123L13 58Q12 42 21 31Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
        <path d="M25 41Q30 25 49 26" fill="none" stroke="#FFD77B" stroke-width="5" stroke-linecap="round"/>
        <!-- Head / Cap (Purple cap) -->
        <path d="M28 28Q17-8 61-9Q108-13 116 27Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
        <path d="M17 29Q54 14 111 29L131 34Q138 40 127 42L35 39" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>
        <!-- Eyes looking towards screen (leftwards) -->
        <g id="p07-eyes">
          <ellipse cx="48" cy="68" rx="4.6" ry="7" fill="#30313B"/>
          <ellipse cx="82" cy="67" rx="4.6" ry="7" fill="#30313B"/>
        </g>
        <!-- Cheeks and Smile -->
        <ellipse cx="36" cy="87" rx="9" ry="5" fill="#EE7C47" opacity=".65"/>
        <ellipse cx="94" cy="86" rx="9" ry="5" fill="#EE7C47" opacity=".65"/>
        <path id="p07-mouth" d="M52 91Q65 103 77 88" fill="none" stroke="#30313B" stroke-width="3.2" stroke-linecap="round"/>
        <!-- Near arm -->
        <g transform="translate(109, 83)">
          <path d="M0 0Q18 20 32 8" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="32" cy="8" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
        </g>
      </g>

      <!-- Connection glow sparkle near screen -->
      <g id="p07-sparkles" opacity="0">
        <polygon points="175,460 180,448 185,460 197,465 185,470 180,482 175,470 163,465" fill="#087BC1"/>
        <polygon points="560,450 564,440 568,450 578,454 568,458 564,468 560,458 550,454" fill="#087BC1"/>
      </g>
    </svg>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({paused: true});
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;

    // 0.0s - Initial state
    gsap.set('#p07-screen-offline', {opacity: 1});
    gsap.set('#p07-screen-online', {opacity: 0});
    gsap.set('#p07-cable-pulse', {opacity: 0, scale: 0.5});
    gsap.set('#p07-sparkles', {opacity: 0, scale: 0.8, transformOrigin: 'center'});

    // 0.8s -> 1.3s: Mascot moves hand and plugs the cable in
    tl.to('#p07-mascot-far-arm', {x: -20, y: -25, duration: 0.7, ease: 'power2.out'}, 0.7)
      .to('#p07-cable', {strokeWidth: 8, duration: 0.2, yoyo: true, repeat: 1}, 1.25);

    // 1.3s: Cable pulse shoots along the line to laptop
    tl.to('#p07-cable-pulse', {opacity: 1, duration: 0.1}, 1.25)
      .to('#p07-cable-pulse', {cx: 145, cy: 780, duration: 0.35, ease: 'power1.in'}, 1.25)
      .to('#p07-cable-pulse', {opacity: 0, scale: 2, duration: 0.15}, 1.6);

    // 1.5s: Screen illuminates and switches to online family call!
    tl.to('#p07-screen-offline', {opacity: 0, duration: 0.25}, 1.45)
      .to('#p07-screen-online', {opacity: 1, duration: 0.35, ease: 'power2.out'}, 1.5)
      .to('#p07-sparkles', {opacity: 0.9, scale: 1.2, duration: 0.3}, 1.55)
      .to('#p07-sparkles', {opacity: 0, duration: 0.5}, 2.0);

    // 1.6s -> 4.5s: Gentle waving motion of parent on screen
    tl.to('#p07-arm-wave1', {rotation: 14, transformOrigin: '-18px -8px', yoyo: true, repeat: 5, duration: 0.45, ease: 'sine.inOut'}, 1.6);

    // 2.2s -> 3.2s: Mascot smiles and subtly bobs head in recognition
    tl.to('#p07-eyes', {y: -2, duration: 0.4, yoyo: true, repeat: 3, ease: 'sine.inOut'}, 2.0)
      .to('#p07-mouth', {scaleX: 1.15, transformOrigin: 'center', duration: 0.5}, 2.2);
  </script>
</body>
</html>
