<script>
(()=>{
  const tl = gsap.timeline({paused:true});

  // 1. Header Entry (0.0s - 0.35s)
  tl.fromTo('#p04-header', {y: -15, opacity: 0}, {y: 0, opacity: 1, duration: 0.35, ease: 'power2.out'}, 0.08);

  // 2. Pivot Stand & Balance Scale Appear Level (0.15s - 0.7s)
  tl.fromTo('#p04-pivot-stand', {scale: 0.85, opacity: 0, svgOrigin: '360 740'}, {scale: 1, opacity: 1, duration: 0.5, ease: 'power2.out'}, 0.15);
  tl.fromTo('#p04-tray', {scale: 0.9, opacity: 0, svgOrigin: '360 660'}, {scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(1.1)'}, 0.2);

  // 3. Mascot Enters Thoughtfully on Left (0.25s - 0.75s)
  tl.fromTo('#p04-mascot-rig', {x: 20, opacity: 0}, {x: 60, opacity: 1, duration: 0.5, ease: 'power2.out'}, 0.25);

  // 4. Right-side Assets (House, Deed, Coins) Pop In (0.5s - 1.2s)
  tl.fromTo('#p04-house', {y: -25, opacity: 0}, {y: -95, opacity: 1, duration: 0.45, ease: 'back.out(1.2)'}, 0.55);
  tl.fromTo('#p04-deed', {y: -20, opacity: 0}, {y: -55, opacity: 1, duration: 0.4, ease: 'power2.out'}, 0.75);
  tl.fromTo('#p04-coins', {y: -15, opacity: 0}, {y: 10, opacity: 1, duration: 0.35, ease: 'bounce.out'}, 0.95);
  tl.fromTo('#p04-vn-badge', {scale: 0.8, opacity: 0, svgOrigin: '0 52'}, {scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.2)'}, 1.15);

  // 5. Tray Tilts Clockwise under the Unequal Weight (1.3s - 2.6s)
  // at cue "Liệu toàn bộ tài sản của gia đình..."
  tl.to('#p04-tray', {rotation: 5.2, svgOrigin: '360 660', duration: 1.3, ease: 'power2.inOut'}, 1.35);

  // 6. Large Question Mark Pops Up on the Elevated Left Side (2.2s - 3.1s)
  // at cue "...có nên chỉ tập trung ở Việt Nam?"
  tl.fromTo('#p04-question', {scale: 0.2, opacity: 0, y: 10, svgOrigin: '0 0'}, {scale: 1, opacity: 1, y: -60, duration: 0.75, ease: 'back.out(1.3)'}, 2.2);

  // 7. Mascot Reacts to Question: Eyes look up towards question mark & tilted scale (2.0s - 2.8s)
  tl.to('#p04-mascot-eyes', {x: 4, y: -6, duration: 0.6, ease: 'power1.inOut'}, 2.1);
  tl.to('#p04-far-path', {attr: {d: 'M0 0Q35-25 70-35'}, duration: 0.65, ease: 'power2.inOut'}, 2.3);
  tl.to('#p04-far-hand', {attr: {cx: 70, cy: -35}, duration: 0.65, ease: 'power2.inOut'}, 2.3);

  // Subtle natural dampening sway of the tray at the end (2.7s - 3.8s)
  tl.to('#p04-tray', {rotation: 4.8, svgOrigin: '360 660', duration: 0.5, ease: 'sine.inOut'}, 2.7);
  tl.to('#p04-tray', {rotation: 5.0, svgOrigin: '360 660', duration: 0.5, ease: 'sine.inOut'}, 3.2);

  // Hold cleanly till end of scene (4.0305s)
  tl.to({hold: 0}, {hold: 1, duration: 4.0305, ease: 'none'}, 0);

  window.__timelines['v33-s04'] = tl;
})();
</script>
