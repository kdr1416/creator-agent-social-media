<script>
(()=>{
  const tl = gsap.timeline({paused:true});

  // 1. Header Entry (0.0s - 0.35s)
  tl.fromTo('#p03-header', {y: -15, opacity: 0}, {y: 0, opacity: 1, duration: 0.35, ease: 'power2.out'}, 0.08);

  // 2. Road Unrolls from Bottom to Top (0.15s - 1.1s)
  tl.fromTo('#p03-road-body', {scaleY: 0.2, opacity: 0, svgOrigin: '160 950'}, {scaleY: 1, opacity: 1, duration: 0.85, ease: 'power2.out'}, 0.15);
  tl.fromTo('#p03-road-dash', {opacity: 0}, {opacity: 1, duration: 0.5}, 0.5);

  // 3. Station 1 (Học Tập) Pops Up (0.45s - 1.0s) at cue "kế hoạch học tập..."
  tl.fromTo('#p03-station-edu', {scale: 0.7, opacity: 0, svgOrigin: '230 780'}, {scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(1.15)'}, 0.45);
  tl.fromTo('#p03-milestone-1', {scale: 0, opacity: 0, svgOrigin: '240 815'}, {scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.4)'}, 0.8);

  // 4. Mascot Initial Entry & Focus on Station 1 (0.25s - 0.8s)
  tl.fromTo('#p03-mascot-rig', {x: 20, opacity: 0}, {x: 60, opacity: 1, duration: 0.55, ease: 'power2.out'}, 0.25);

  // 5. Station 2 (Sự Nghiệp Châu Âu) Opens Up (1.6s - 2.5s) at cue "...và phát triển sự nghiệp tại Châu Âu"
  tl.fromTo('#p03-station-career', {scale: 0.7, opacity: 0, svgOrigin: '480 500'}, {scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(1.15)'}, 1.65);
  tl.fromTo('#p03-milestone-2', {scale: 0, opacity: 0, svgOrigin: '370 700'}, {scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.4)'}, 1.95);
  tl.fromTo('#p03-milestone-3', {scale: 0, opacity: 0, svgOrigin: '500 530'}, {scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.4)'}, 2.35);

  // 6. Mascot Steps Forward & Points Along the Pathway towards Career (1.8s - 2.8s)
  tl.to('#p03-mascot-rig', {x: 85, duration: 0.85, ease: 'power1.inOut'}, 1.85);
  tl.to('#p03-far-path', {attr: {d: 'M0 0Q40-35 85-55'}, duration: 0.75, ease: 'power2.inOut'}, 1.9);
  tl.to('#p03-far-hand', {attr: {cx: 85, cy: -55}, duration: 0.75, ease: 'power2.inOut'}, 1.9);
  tl.to('#p03-mascot-eyes', {x: 5, y: -5, duration: 0.6, ease: 'power1.inOut'}, 2.0);

  // 7. Future Horizon Expands Out (2.6s - 3.4s) at cue "...trong nhiều năm"
  tl.fromTo('#p03-future-path', {scaleY: 0.2, opacity: 0, svgOrigin: '555 402'}, {scaleY: 1, opacity: 1, duration: 0.85, ease: 'power2.out'}, 2.65);

  // Hold cleanly till end of voice (4.2458s)
  tl.to({hold: 0}, {hold: 1, duration: 4.2458, ease: 'none'}, 0);

  window.__timelines['v33-s03'] = tl;
})();
</script>
