<script>
const tl=gsap.timeline({paused:true});
const front={x:420,y:576},back={x:397,y:740},motion={u:0};
function arm(prefix,sx,sy,ex,ey,l1,l2,bend){
 const dx=ex-sx,dy=ey-sy,d=Math.min(Math.hypot(dx,dy),l1+l2-.01),a=Math.atan2(dy,dx),b=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
 const elbowX=sx+l1*Math.cos(a+b*bend),elbowY=sy+l1*Math.sin(a+b*bend);
 document.getElementById(prefix+'-sleeve').setAttribute('d',`M${sx},${sy}L${elbowX},${elbowY}`);
 document.getElementById(prefix+'-skin').setAttribute('d',`M${elbowX},${elbowY}L${ex},${ey}`);
 const hand=document.getElementById(prefix+'-hand');hand.setAttribute('cx',ex);hand.setAttribute('cy',ey);
}
function pose(){arm('front',271,663,front.x,front.y,105,116,1);arm('back',180,674,back.x,back.y,115,120,1);gsap.set('#plug',{x:front.x+7,y:front.y-4});}
pose();
const wire=document.getElementById('wire'), wireCore=document.getElementById('wire-core'), len=wire.getTotalLength();
gsap.set(['#wire','#wire-core','#wire-shadow'],{strokeDasharray:len,strokeDashoffset:len});
gsap.set('#signal',{opacity:0});gsap.set('#response',{opacity:0});gsap.set(['#label-ai','#label-drone'],{opacity:0,y:10});
gsap.set('#chip',{y:-32});gsap.set('#drone',{y:-2});
tl.to('#drone',{y:28,duration:.85,ease:'power2.inOut'},0)
 .to(back,{y:798,x:397,duration:.85,ease:'power2.inOut',onUpdate:pose},0)
 .to('#chip',{y:0,duration:1.05,ease:'power2.out'},.35)
 .to(front,{x:413,y:538,duration:1.05,ease:'power2.inOut',onUpdate:pose},.35)
 .to(back,{x:308,y:784,duration:.6,ease:'power2.inOut',onUpdate:pose},.95)
 .to(front,{x:420,y:538,duration:.3,ease:'power1.inOut',onUpdate:pose},1.45)
 .to(['#wire','#wire-core','#wire-shadow'],{strokeDashoffset:0,duration:.8,ease:'power2.out'},1.75)
 .to('#plug',{opacity:0,duration:.12},2.4)
 .to(front,{x:303,y:712,duration:.65,ease:'power2.inOut',onUpdate:pose},2.45)
 .to('#signal',{opacity:1,duration:.08},2.55)
 .to(motion,{u:1,duration:1,ease:'power1.inOut',onUpdate:()=>{const pt=wire.getPointAtLength(motion.u*len);gsap.set('#signal',{x:pt.x,y:pt.y});}},2.55)
 .to('#signal',{opacity:0,duration:.15},3.55)
 .to('#chip-led',{fill:'#FF6B2B',duration:.25},2.55)
 .to('#drone-led',{fill:'#FF6B2B',duration:.2},3.45)
 .to('#response',{opacity:1,duration:.2},3.6)
 .to('#response',{opacity:0,duration:.45},4.35)
 .to('#label-drone',{opacity:1,y:0,duration:.3},2.58)
 .to('#label-ai',{opacity:1,y:0,duration:.3},3.44)
 .to('#head',{rotation:4,svgOrigin:'220 610',duration:.45,ease:'power2.inOut'},3.6)
 .to('#head',{rotation:0,svgOrigin:'220 610',duration:.4,ease:'power2.inOut'},4.25);
[['#rotor-a','360 734'],['#rotor-b','548 734'],['#rotor-c','366 802'],['#rotor-d','543 802']].forEach(([id,origin],i)=>{
 tl.to(id,{rotation:i%2? -1080:1080,transformOrigin:'50% 50%',duration:1.45,ease:'power2.in'},3.55);
});
window.__timelines=window.__timelines||{};
window.__timelines['scene04']=tl;
</script>
