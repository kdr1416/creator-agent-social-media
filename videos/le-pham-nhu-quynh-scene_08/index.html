    </g>

    <!-- Tinted blue navigation windows -->

    <rect x="445" y="552" width="16" height="8" fill="#FF6B2B"/>

     <rect width="52" height="34" rx="2" fill="#0D9488" stroke="#115E59" stroke-width="1.5"/>

     <line x1="26" y1="0" x2="26" y2="34" stroke="#0F766E" stroke-width="1"/>
     <line x1="39" y1="0" x2="39" y2="34" stroke="#0F766E" stroke-width="1"/>
    </g>
    <!-- Royal Blue Container -->
    <g transform="translate(186, 616)">
     <rect width="52" height="34" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
     <line x1="13" y1="0" x2="13" y2="34" stroke="#1E40AF" stroke-width="1"/>
     <line x1="26" y1="0" x2="26" y2="34" stroke="#1E40AF" stroke-width="1"/>
     <line x1="39" y1="0" x2="39" y2="34" stroke="#1E40AF" stroke-width="1"/>
    </g>
    <!-- Amber Container -->
    <g transform="translate(242, 616)">
     <rect width="52" height="34" rx="2" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
     <line x1="13" y1="0" x2="13" y2="34" stroke="#B45309" stroke-width="1"/>
     <line x1="26" y1="0" x2="26" y2="34" stroke="#B45309" stroke-width="1"/>
     <line x1="39" y1="0" x2="39" y2="34" stroke="#B45309" stroke-width="1"/>
    </g>
    <!-- Dark Indigo Container -->

     <rect width="52" height="34" rx="2" fill="#4F46E5" stroke="#4338CA" stroke-width="1.5"/>

     <line x1="26" y1="0" x2="26" y2="34" stroke="#3730A3" stroke-width="1"/>
     <line x1="39" y1="0" x2="39" y2="34" stroke="#3730A3" stroke-width="1"/>

    <!-- Emerald Container -->

     <rect width="52" height="34" rx="2" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
     <line x1="13" y1="0" x2="13" y2="34" stroke="#047857" stroke-width="1"/>
     <line x1="26" y1="0" x2="26" y2="34" stroke="#047857" stroke-width="1"/>
     <line x1="39" y1="0" x2="39" y2="34" stroke="#047857" stroke-width="1"/>
    </g>

    <!-- Row 2 (Middle Deck) -->

    <g transform="translate(186, 578)">

     <line x1="26" y1="0" x2="26" y2="34" stroke="#C2410C" stroke-width="1"/>

     <line x1="26" y1="0" x2="26" y2="34" stroke="#075985" stroke-width="1"/>
     <line x1="39" y1="0" x2="39" y2="34" stroke="#075985" stroke-width="1"/>

 <audio data-hf-id="hf-s08-voice" id="scene08-voice" src="assets/audio.wav" data-start="0" data-duration="3.718" data-track-index="2" data-volume="1"></audio>
</div>

<script>
const tl = gsap.timeline({paused:true});

gsap.set('#header', {opacity: 0, y: -20});
gsap.set('#stat-pill', {opacity: 0, scale: 0.85});
gsap.set('#hero-ship', {x: -80});
gsap.set('#suspended-container', {y: -40});
gsap.set('#cable-l', {attr: {y2: 480}});
gsap.set('#cable-r', {attr: {y2: 480}});
gsap.set('#gull-1', {x: 0, y: 0});
gsap.set('#gull-2', {x: 0, y: 0});

// 0.0s - 0.9s: Header and Stat enter cleanly
tl.to('#header', {opacity: 1, y: 0, duration: 0.55, ease: 'power2.out'}, 0.15)
  .to('#stat-pill', {opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.5)'}, 0.35)

// 0.0s - 1.8s: Cargo Ship glides into dock from left and settles with gentle float
  .to('#hero-ship', {x: 0, duration: 1.8, ease: 'power2.out'}, 0.0)

// 0.8s - 2.6s: Crane trolley moves into position and lowers container onto the ship
  .to('#crane-trolley', {x: -40, duration: 1.0, ease: 'power1.inOut'}, 0.6)
  .to('#suspended-container', {y: 15, duration: 1.1, ease: 'power1.inOut'}, 1.2)
  .to('#cable-l', {attr: {y2: 535}, duration: 1.1, ease: 'power1.inOut'}, 1.2)
  .to('#cable-r', {attr: {y2: 535}, duration: 1.1, ease: 'power1.inOut'}, 1.2)

// Gentle ship floating bobbing motion
  .to('#hero-ship', {y: -4, duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1}, 1.2)

// Waves ripple oscillation
  .to('#wave-1', {x: 20, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 1}, 0.2)
  .to('#wave-2', {x: -15, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 1}, 0.4)

// Seagulls gliding
  .to('#gull-1', {x: 40, y: -10, duration: 3.5, ease: 'none'}, 0.0)
  .to('#gull-2', {x: 35, y: -6, duration: 3.5, ease: 'none'}, 0.2);

window.__timelines = window.__timelines || {};
window.__timelines['scene08'] = tl;
</script>
