<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720,height=1280">
<title>Công nghệ Không người lái — scene 03</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:SceneSans;src:url('assets/scene-sans-bold.ttf') format('truetype');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body{margin:0;background:#000}#root{position:relative;width:100%;height:100%;overflow:hidden;color:#0F172A;font-family:SceneSans,sans-serif}
.clip{position:absolute;inset:0}
video.clip{width:100%;height:100%;object-fit:cover;display:block}
.art{width:100%;height:100%;display:block;pointer-events:none}
.callout-text{font-family:SceneSans,sans-serif;font-weight:700;text-shadow:0 2px 12px rgba(255,255,255,0.95),0 0 24px rgba(255,255,255,0.8)}
</style>
</head>
<body>
<div data-hf-id="hf-s03-root" id="root" data-composition-id="scene03" data-width="720" data-height="1280" data-duration="6.166" data-start="0">
 <video data-hf-id="hf-s03-plate" id="scene03-plate" class="clip" src="assets/plate.mp4" playsinline muted data-start="0" data-duration="6.166" data-track-index="0"></video>
 
 <svg data-hf-id="hf-s03-art" id="scene03-art" class="art clip" data-start="0" data-duration="6.166" data-track-index="1" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
  <defs>
   <filter id="glow-drop" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.95"/>
    <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
   </filter>
  </defs>

  <!-- Target Pin Dot directly on drone frame on workbench -->
  <g id="pin-target">
   <circle id="pin-pulse" cx="250" cy="635" r="16" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0"/>
   <circle cx="250" cy="635" r="7" fill="#0284C7" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>

  <!-- Hairline Connector Line connecting pin dot to upper-left negative space -->
  <path id="connector-line" d="M250 635 L180 430 H60" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Callout Label perfectly anchored in upper-left Negative Space (x=60, y=345) -->
  <g transform="translate(60, 345)" filter="url(#glow-drop)">
   <g id="callout-label">
    <!-- Category Micro Pip -->
    <rect x="0" y="0" width="16" height="4" rx="2" fill="#0284C7"/>
    <text x="24" y="6" font-size="16" fill="#0284C7" font-weight="700" letter-spacing="1">HỆ THỐNG VẬT LÝ</text>
    <!-- Hero Label -->
    <text x="0" y="48" font-size="34" fill="#0F172A" font-weight="700" letter-spacing="-0.5" class="callout-text">Không người lái</text>
   </g>
  </g>
 </svg>

 <audio data-hf-id="hf-s03-voice" id="scene03-voice" src="assets/audio.wav" data-start="0" data-duration="6.166" data-track-index="2" data-volume="1"></audio>
</div>

<script>
const tl = gsap.timeline({paused:true});

// Initialize connector path length for drawSVG effect
const connector = document.getElementById('connector-line');
const length = connector.getTotalLength();
connector.style.strokeDasharray = length;
connector.style.strokeDashoffset = length;

gsap.set('#pin-target', {opacity: 0, scale: 0, transformOrigin: '250px 635px'});
gsap.set('#callout-label', {opacity: 0, scale: 0.9, transformOrigin: '0px 0px'});

// Animation timed to observed physical plate action:
// Student places hardware model between 0 - 1.5s
// Callout triggers at 1.8s
tl.to('#pin-target', {opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)'}, 1.8)
  .to('#pin-pulse', {opacity: 0.9, scale: 1.8, transformOrigin: '250px 635px', duration: 0.6, ease: 'power1.out'}, 1.9)
  .to('#pin-pulse', {opacity: 0, duration: 0.3}, 2.3)
  
  // Draw hairline connector line from pin to label
  .to(connector, {strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut'}, 2.0)
  
  // Reveal floating label text right at line endpoint
  .to('#callout-label', {opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out'}, 2.4)
  
  // Subtle holding pulse
  .to('#pin-pulse', {opacity: 0.6, scale: 1.5, transformOrigin: '250px 635px', repeat: 1, yoyo: true, duration: 0.8}, 3.5);

window.__timelines = window.__timelines || {};
window.__timelines['scene03'] = tl;
</script>
</body>
</html>
