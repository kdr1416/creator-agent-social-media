<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720,height=1280">
<title>01 · Góc học tập mở ra thế giới</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face {
  font-family: 'PilotDisplay';
  src: url('assets/segoe-ui-black.ttf');
  font-weight: 900;
}
@font-face {
  font-family: 'PilotSans';
  src: url('assets/arial.ttf');
}
@font-face {
  font-family: 'PilotSans';
  src: url('assets/arialbd.ttf');
  font-weight: 700;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

#scene-01 {
  position: relative;
  width: 720px;
  height: 1280px;
  overflow: hidden;
  background: #F3EEF7;
  color: #30313B;
  font-family: PilotSans, Arial, sans-serif;
}

#world {
  position: absolute;
  inset: 0;
  transform-origin: 360px 650px;
}

/* Strip Headline */
.strip {
  position: absolute;
  background: #087BC1;
  color: white;
  padding: 14px 28px;
  font-family: PilotDisplay, PilotSans, sans-serif;
  font-size: 44px;
  font-weight: 900;
  line-height: 1.1;
  white-space: nowrap;
  box-shadow: 5px 7px 0 #30313b15;
  border-radius: 4px;
}
#headline {
  left: 175px;
  top: 175px;
  transform-origin: center;
  z-index: 20;
}

/* Room Wall & Window Elements */
#room-bg {
  position: absolute;
  inset: 0;
  width: 720px;
  height: 1280px;
  z-index: 1;
}

#window-frame {
  position: absolute;
  left: 135px;
  top: 330px;
  width: 475px;
  height: 350px;
  background: #FFFBF6;
  border: 3.5px solid #30313B;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 6px 8px 0 #30313b12;
  z-index: 2;
}

#sky-outside {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #D4E9F7 0%, #EDF6FC 70%, #FDF6EE 100%);
  z-index: 1;
}

#roofs-outside {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
}

#window-blind {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: #FFFDF9;
  z-index: 5;
  transform-origin: top center;
  box-shadow: 0 4px 10px rgba(48,49,59,0.1);
}

#window-mullions {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
}

/* Desk Surface & Props */
#desk-group {
  position: absolute;
  left: 70px;
  top: 770px;
  width: 580px;
  height: 230px;
  z-index: 10;
}

/* Mascot Nhật */
#student-layer {
  position: absolute;
  left: 0;
  top: 0;
  width: 720px;
  height: 1280px;
  z-index: 15;
  pointer-events: none;
}

/* Interactive Blue Notebook */
#notebook-prop {
  position: absolute;
  left: 275px;
  top: 805px;
  width: 130px;
  height: 95px;
  z-index: 12;
  transform-origin: 30px 45px;
}
</style>
</head>
<body>
<div id="scene-01" data-composition-id="scene-01" data-width="720" data-height="1280" data-start="0" data-duration="3.2">
  <div id="world">
    <!-- Background wall architecture & subtle shelves -->
    <svg id="room-bg" viewBox="0 0 720 1280" aria-label="Study room background">
      <!-- Soft wall textures and floor line -->
      <path d="M50 280L135 330M610 330L670 280" stroke="#DFD5E6" stroke-width="3" stroke-linecap="round" fill="none"/>
      <line x1="50" y1="995" x2="670" y2="995" stroke="#DFD5E6" stroke-width="3"/>
      <!-- Soft room shadow at base -->
      <ellipse cx="360" cy="1005" rx="300" ry="24" fill="#E4DCEB" opacity="0.6"/>
    </svg>

    <!-- Window opening to the world -->
    <div id="window-frame">
      <div id="sky-outside"></div>
      
      <!-- European / Dutch style gabled rooftops in depth -->
      <svg id="roofs-outside" viewBox="0 0 475 350" preserveAspectRatio="xMidYMax meet">
        <!-- Far silhouette layer -->
        <path d="M20 350L60 210L110 230L160 180L210 240L280 195L340 235L390 170L440 220L475 200V350Z" fill="#D2C3DC" opacity="0.65"/>
        <!-- Mid gable layer with windows & chimneys -->
        <path d="M-10 350V250L45 205L90 250V350Z" fill="#8CB6CE" stroke="#30313B" stroke-width="2.5"/>
        <rect x="25" y="235" width="35" height="40" rx="3" fill="#FFFDF8" stroke="#30313B" stroke-width="2"/>
        <path d="M85 350V235L150 175L215 235V350Z" fill="#E8B298" stroke="#30313B" stroke-width="2.5"/>
        <!-- Dutch bell gable crown -->
        <path d="M125 175Q150 145 175 175" fill="#E8B298" stroke="#30313B" stroke-width="2.5"/>
        <rect x="130" y="200" width="40" height="50" rx="4" fill="#FFFDF8" stroke="#30313B" stroke-width="2"/>
        <line x1="150" y1="200" x2="150" y2="250" stroke="#30313B" stroke-width="2"/>
        <line x1="130" y1="225" x2="170" y2="225" stroke="#30313B" stroke-width="2"/>
        <!-- Right building layer -->
        <path d="M210 350V260L275 210L340 260V350Z" fill="#B7A4CF" stroke="#30313B" stroke-width="2.5"/>
        <path d="M335 350V240L395 190L455 240V350Z" fill="#9FC2B2" stroke="#30313B" stroke-width="2.5"/>
        <!-- Tree top foliage peek -->
        <circle cx="215" cy="275" r="30" fill="#6DAA84" stroke="#30313B" stroke-width="2.5"/>
        <circle cx="340" cy="265" r="24" fill="#57986F" stroke="#30313B" stroke-width="2.5"/>
      </svg>

      <!-- Roll Blind with pull cord and slats -->
      <div id="window-blind">
        <svg viewBox="0 0 475 350" width="100%" height="100%" preserveAspectRatio="none">
          <rect x="0" y="0" width="475" height="350" fill="#FFFBF5"/>
          <!-- Horizontal fold slats -->
          <line x1="0" y1="60" x2="475" y2="60" stroke="#EFE6DA" stroke-width="3"/>
          <line x1="0" y1="120" x2="475" y2="120" stroke="#EFE6DA" stroke-width="3"/>
          <line x1="0" y1="180" x2="475" y2="180" stroke="#EFE6DA" stroke-width="3"/>
          <line x1="0" y1="240" x2="475" y2="240" stroke="#EFE6DA" stroke-width="3"/>
          <line x1="0" y1="300" x2="475" y2="300" stroke="#EFE6DA" stroke-width="3"/>
          <!-- Bottom wooden bar & pull ring -->
          <rect x="0" y="338" width="475" height="12" fill="#E6C8B2" stroke="#30313B" stroke-width="2"/>
          <circle cx="237" cy="344" r="5" fill="#FFAA28" stroke="#30313B" stroke-width="2"/>
        </svg>
      </div>

      <!-- Outer Window Wood Mullions -->
      <svg id="window-mullions" viewBox="0 0 475 350" preserveAspectRatio="none">
        <line x1="237" y1="0" x2="237" y2="350" stroke="#30313B" stroke-width="4"/>
        <line x1="0" y1="175" x2="475" y2="175" stroke="#30313B" stroke-width="4"/>
      </svg>
    </div>

    <!-- Desk plane, lamp, plant & accessories -->
    <div id="desk-group">
      <svg viewBox="0 0 580 230" width="100%" height="100%">
        <!-- Desk tabletop -->
        <polygon points="20,50 560,50 535,180 45,180" fill="#EFE3D3" stroke="#30313B" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Desk front edge thickness -->
        <polygon points="45,180 535,180 530,205 50,205" fill="#D9C4AF" stroke="#30313B" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Desk legs -->
        <line x1="75" y1="205" x2="70" y2="230" stroke="#30313B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="505" y1="205" x2="510" y2="230" stroke="#30313B" stroke-width="4.5" stroke-linecap="round"/>
        
        <!-- Cozy Lamp on the left -->
        <g id="desk-lamp" transform="translate(65, 0)">
          <!-- Base -->
          <ellipse cx="40" cy="72" rx="22" ry="8" fill="#B4CDDC" stroke="#30313B" stroke-width="2.5"/>
          <!-- Arm -->
          <path d="M40 70L28 15L52 5" fill="none" stroke="#30313B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Shade -->
          <polygon points="38,-8 68,-3 82,22 42,16" fill="#087BC1" stroke="#30313B" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Soft light beam hint -->
          <polygon points="46,18 78,24 135,115 50,115" fill="#FFF2CE" opacity="0.25"/>
        </g>

        <!-- Terracotta Potted Plant on left edge -->
        <g id="desk-plant" transform="translate(130, 25)">
          <polygon points="12,45 38,45 34,70 16,70" fill="#DC7E5A" stroke="#30313B" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="25" cy="45" rx="14" ry="4" fill="#C96843" stroke="#30313B" stroke-width="2"/>
          <!-- Leaves -->
          <path d="M25 43Q10 25 14 12Q25 24 25 43" fill="#60A175" stroke="#30313B" stroke-width="2"/>
          <path d="M25 43Q38 22 46 28Q38 40 25 43" fill="#78B88D" stroke="#30313B" stroke-width="2"/>
          <path d="M25 43Q22 15 28 8Q36 20 25 43" fill="#8ECD9F" stroke="#30313B" stroke-width="2"/>
        </g>

        <!-- Pen cup on right edge -->
        <g id="desk-pencup" transform="translate(485, 30)">
          <rect x="0" y="20" width="28" height="38" rx="3" fill="#BAA3D0" stroke="#30313B" stroke-width="2.5"/>
          <!-- Pens/pencils -->
          <line x1="8" y1="20" x2="4" y2="4" stroke="#DC6E38" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="16" y1="20" x2="18" y2="2" stroke="#087BC1" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="22" y1="20" x2="26" y2="7" stroke="#30313B" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <!-- The Blue Notebook with Orange Marker Tab -->
    <div id="notebook-prop">
      <svg viewBox="0 0 130 95" width="100%" height="100%">
        <!-- Notebook shadow -->
        <ellipse cx="65" cy="85" rx="55" ry="8" fill="#30313B" opacity="0.12"/>
        <!-- Bottom cover -->
        <rect x="10" y="10" width="105" height="75" rx="5" fill="#05669D" stroke="#30313B" stroke-width="2.8"/>
        <!-- Cream page block thickness -->
        <rect x="14" y="8" width="102" height="74" rx="4" fill="#FFFDF4" stroke="#30313B" stroke-width="2.5"/>
        <line x1="116" y1="12" x2="116" y2="78" stroke="#D8CDBE" stroke-width="2"/>
        <!-- Top Cover -->
        <rect x="10" y="6" width="103" height="74" rx="5" fill="#087BC1" stroke="#30313B" stroke-width="2.8"/>
        <!-- Spine edge detail -->
        <path d="M10 6L18 6V80L10 80Z" fill="#055B8F" stroke="#30313B" stroke-width="2"/>
        <!-- Orange bookmark tab sticking out on right -->
        <g id="orange-tab">
          <polygon points="105,25 126,25 120,38 126,50 105,50" fill="#FF7A30" stroke="#30313B" stroke-width="2.2" stroke-linejoin="round"/>
        </g>
        <!-- Subtle embossed emblem on cover -->
        <circle cx="62" cy="42" r="14" fill="#0B89D4" stroke="#055B8F" stroke-width="1.8"/>
        <path d="M56 42L68 42M62 36L62 48" stroke="#FFFDF4" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Headline: DÁM KHÁC BIỆT -->
    <div id="headline" class="strip">DÁM KHÁC BIỆT</div>

    <!-- Student Mascot (Nhật) -->
    <svg id="student-layer" viewBox="0 0 720 1280" aria-label="Student mascot Minh Nhat">
      <g id="student-rig" transform="translate(375, 715)">
        <g id="student-motion">
          <!-- Mascot shadow on floor -->
          <ellipse id="student-shadow" cx="63" cy="205" rx="65" ry="10" fill="#D7BDA8" opacity="0.5"/>
          <!-- Legs -->
          <path id="legs" d="M48 143L41 190L18 194M90 143L98 190L120 194" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <!-- Blue Backpack on back -->
          <rect id="backpack" x="103" y="50" width="39" height="91" rx="16" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
          <path d="M113 69L134 78" fill="none" stroke="#A2D8ED" stroke-width="3"/>
          <!-- Far Arm (reaches toward blind pull) -->
          <g id="arm-far-group" transform="translate(25, 72)">
            <g id="arm-far">
              <path d="M0 0Q-25 -25 -42 -55" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
              <circle cx="-42" cy="-55" r="7.5" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
            </g>
          </g>
          <!-- Body: Rounded orange mascot -->
          <path id="mascot-body" d="M21 31Q24 9 50 12L95 14Q123 16 122 46L115 121Q114 148 86 152L49 149Q20 148 17 123L13 58Q12 42 21 31Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
          <!-- Warm chest highlight -->
          <path d="M25 41Q30 25 49 26" fill="none" stroke="#FFD77B" stroke-width="5" stroke-linecap="round"/>
          <!-- Purple Cap -->
          <path d="M28 28Q17 -8 61 -9Q108 -13 116 27Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
          <path d="M17 29Q54 14 111 29L131 34Q138 40 127 42L35 39" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>
          <!-- Eyes -->
          <g id="eyes">
            <ellipse cx="52" cy="68" rx="4.6" ry="7" fill="#30313B"/>
            <ellipse cx="86" cy="67" rx="4.6" ry="7" fill="#30313B"/>
            <!-- Confident catchlights -->
            <circle cx="53.5" cy="66" r="1.8" fill="#FFFDF8"/>
            <circle cx="87.5" cy="65" r="1.8" fill="#FFFDF8"/>
          </g>
          <!-- Cheeks -->
          <ellipse cx="39" cy="87" rx="10" ry="5" fill="#EE7C47" opacity="0.65"/>
          <ellipse cx="99" cy="86" rx="10" ry="5" fill="#EE7C47" opacity="0.65"/>
          <!-- Mouth -->
          <path id="mouth" d="M57 91Q70 105 82 88" fill="none" stroke="#30313B" stroke-width="3.3" stroke-linecap="round"/>
          <!-- Backpack strap -->
          <path d="M111 48L96 129" fill="none" stroke="#05669D" stroke-width="7" stroke-linecap="round"/>
          <!-- Near Arm (holds/lifts notebook) -->
          <g id="arm-near-group" transform="translate(109, 83)">
            <g id="arm-near">
              <path d="M0 0Q-15 28 -38 25" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
              <circle cx="-38" cy="25" r="7.5" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </div>
  <audio id="c1-voice" src="assets/scene_01.wav" data-start="0" data-duration="3.2" data-track-index="2"></audio>
</div>

<script>
(()=>{
  const tl = gsap.timeline({ paused: true });

  // Camera establishing move
  tl.fromTo('#world', 
    { scale: 1.04, y: 8 }, 
    { scale: 1.0, y: 0, duration: 1.8, ease: 'power2.out' }, 
    0
  );

  // Initial state of headline & orange tab
  tl.set('#headline', { opacity: 0, scale: 0.8, y: -25 }, 0);
  tl.set('#orange-tab', { scale: 0, transformOrigin: '105px 37px' }, 0);

  // 0.0s - 0.7s: Nhật leaning over desk studying, far arm moves to pull cord
  tl.fromTo('#arm-far',
    { rotation: 55, svgOrigin: '0 0' },
    { rotation: 10, svgOrigin: '0 0', duration: 0.65, ease: 'power2.inOut' },
    0.1
  );

  // 0.8s - 1.8s: "ở bất kỳ đâu" -> Pull the blind UP smoothly, revealing the gables outside!
  tl.to('#arm-far', {
    rotation: -45,
    svgOrigin: '0 0',
    duration: 0.8,
    ease: 'power2.inOut'
  }, 0.75);

  tl.to('#window-blind', {
    scaleY: 0.08,
    duration: 0.9,
    ease: 'power2.inOut'
  }, 0.8);

  // Character body straightens up with a happy posture
  tl.to('#student-motion', {
    y: -10,
    rotation: -2,
    transformOrigin: '63px 205px',
    duration: 0.6,
    ease: 'back.out(1.2)'
  }, 0.9);

  // Smile brightens
  tl.to('#mouth', {
    attr: { d: 'M54 89Q70 109 85 87' },
    duration: 0.3
  }, 1.2);

  // 1.8s - 2.5s: "vì tôi dám khác biệt"
  // Orange tab sticks onto the notebook!
  tl.to('#orange-tab', {
    scale: 1,
    duration: 0.25,
    ease: 'back.out(2.0)'
  }, 1.85);

  // Nhật lifts the notebook up with near arm!
  tl.to('#arm-near', {
    rotation: -35,
    svgOrigin: '0 0',
    duration: 0.65,
    ease: 'back.out(1.3)'
  }, 1.95);

  tl.to('#arm-far', {
    rotation: -10,
    svgOrigin: '0 0',
    duration: 0.5,
    ease: 'power2.out'
  }, 1.95);

  // Notebook lifts up into prominence
  tl.to('#notebook-prop', {
    y: -42,
    x: -15,
    rotation: -6,
    duration: 0.7,
    ease: 'back.out(1.4)'
  }, 1.95);

  // 2.1s: Headline "DÁM KHÁC BIỆT" appears snappily
  tl.to('#headline', {
    opacity: 1,
    scale: 1,
    y: 0,
    duration: 0.42,
    ease: 'back.out(1.5)'
  }, 2.05);

  // Confident eye look towards viewer
  tl.to('#eyes', {
    x: -2,
    y: -2,
    duration: 0.3
  }, 2.2);

  // 2.7s - 3.2s: Hold the confident pose, ready to match cut into Scene 02
  tl.to({ hold: 0 }, { hold: 1, duration: 3.2, ease: 'none' }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines['scene-01'] = tl;
})();
</script>
</body>
</html>
