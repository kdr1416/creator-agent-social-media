<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720,height=1280">
<title>08 · Cơ hội là các lựa chọn mở</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face {
  font-family: 'PilotDisplay';
  src: url('assets/segoe-ui-black.ttf');
  font-weight: 900;
}
@font-face {
  font-family: 'PilotSans';
  src: url('assets/arial.ttf');
}
@font-face {
  font-family: 'PilotSans';
  src: url('assets/arialbd.ttf');
  font-weight: 700;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

#scene-08 {
  position: relative;
  width: 720px;
  height: 1280px;
  overflow: hidden;
  background: #FAF4EC;
  color: #30313B;
  font-family: PilotSans, Arial, sans-serif;
}

#world {
  position: absolute;
  inset: 0;
  transform-origin: 360px 650px;
}

/* Strip Headline */
.strip {
  position: absolute;
  background: #087BC1;
  color: white;
  padding: 14px 28px;
  font-family: PilotDisplay, PilotSans, sans-serif;
  font-size: 42px;
  font-weight: 900;
  line-height: 1.1;
  white-space: nowrap;
  box-shadow: 5px 7px 0 #30313b15;
  border-radius: 4px;
}
#headline {
  left: 170px;
  top: 175px;
  transform-origin: center;
  z-index: 25;
}

/* Ground shadow and base */
#ground-art {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* Paper Globe Structure */
#globe-container {
  position: absolute;
  left: 140px;
  top: 380px;
  width: 440px;
  height: 500px;
  z-index: 10;
  transform-origin: 220px 250px;
}

/* Two Opportunity Settings (study & work) */
#setting-study {
  position: absolute;
  left: 95px;
  top: 350px;
  width: 220px;
  height: 180px;
  z-index: 18;
  transform-origin: 160px 150px;
}

#setting-work {
  position: absolute;
  left: 420px;
  top: 550px;
  width: 220px;
  height: 180px;
  z-index: 18;
  transform-origin: 50px 90px;
}

/* Student Mascot (Nhật) */
#student-layer {
  position: absolute;
  left: 0;
  top: 0;
  width: 720px;
  height: 1280px;
  z-index: 20;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="scene-08" data-composition-id="scene-08" data-width="720" data-height="1280" data-start="0" data-duration="3.1333333333333333">
  <div id="world">
    <!-- Ground stage textures -->
    <svg id="ground-art" viewBox="0 0 720 1280">
      <ellipse cx="360" cy="1005" rx="300" ry="24" fill="#E8DED1" opacity="0.6"/>
      <path d="M50 420Q220 400 360 410Q500 420 670 390" fill="none" stroke="#E6D8C8" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <!-- The Paper Desk Globe -->
    <div id="globe-container">
      <svg id="globe-svg" viewBox="0 0 440 500" width="100%" height="100%">
        <defs>
          <!-- 3D Spherical Radial Shading Gradient -->
          <radialGradient id="sphere-shading" cx="32%" cy="28%" r="68%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
            <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.0"/>
            <stop offset="80%" stop-color="#14445F" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#0B2B3F" stop-opacity="0.55"/>
          </radialGradient>
        </defs>

        <!-- Globe Stand & Base shadow -->
        <ellipse cx="220" cy="470" rx="95" ry="14" fill="#30313B" opacity="0.14"/>
        
        <!-- Brass / Wood Base -->
        <polygon points="170,465 270,465 258,445 182,445" fill="#D3A77A" stroke="#30313B" stroke-width="3" stroke-linejoin="round"/>
        <line x1="220" y1="445" x2="220" y2="405" stroke="#30313B" stroke-width="6" stroke-linecap="round"/>
        <!-- Joint bracket connecting stem to meridian arm -->
        <path d="M 220 405 Q 220 385 157 385" fill="none" stroke="#30313B" stroke-width="6" stroke-linecap="round"/>

        <!-- Tilted Brass Meridian Arc (around left side) -->
        <path d="M 283 95 A 168 168 0 0 0 157 385" fill="none" stroke="#D3A77A" stroke-width="7" stroke-linecap="round"/>
        <path d="M 283 95 A 168 168 0 0 0 157 385" fill="none" stroke="#30313B" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Spindle Rod along 23.5-degree tilted axis -->
        <line x1="290" y1="78" x2="276" y2="110" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
        <line x1="164" y1="368" x2="150" y2="400" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
        <!-- Axis finials -->
        <circle cx="283" cy="95" r="7.5" fill="#FFAA28" stroke="#30313B" stroke-width="2.2"/>
        <circle cx="157" cy="385" r="7.5" fill="#FFAA28" stroke="#30313B" stroke-width="2.2"/>

        <!-- The Paper Sphere Clip (Centered at 220, 240, tilted by 23.5 degrees) -->
        <g id="globe-sphere" transform="translate(220, 240) rotate(23.5)">
          <!-- Circular Mask Container -->
          <clipPath id="sphere-clip">
            <circle cx="0" cy="0" r="145"/>
          </clipPath>

          <!-- Globe Sphere Ocean Fill -->
          <circle cx="0" cy="0" r="145" fill="#D9EDF8" stroke="#30313B" stroke-width="3.5"/>

          <!-- Inside the Sphere: Synchronized Rotating Map Surface (Continents + Meridians) -->
          <g clip-path="url(#sphere-clip)">
            <!-- Latitude grid lines (parallel to equator, static relative to rotating axis) -->
            <g stroke="#B2D5E8" stroke-width="1.8" fill="none">
              <!-- Equator -->
              <line x1="-145" y1="0" x2="145" y2="0" stroke-width="2.2"/>
              <!-- Mid-latitudes -->
              <line x1="-137" y1="-48" x2="137" y2="-48"/>
              <line x1="-137" y1="48" x2="137" y2="48"/>
              <!-- High-latitudes -->
              <line x1="-110" y1="-92" x2="110" y2="-92" stroke-width="1.5"/>
              <line x1="-110" y1="92" x2="110" y2="92" stroke-width="1.5"/>
            </g>

            <!-- The ROTATING SURFACE: Continents AND Meridians rotate together seamlessly -->
            <g id="globe-surface" transform="translate(0, 0)">
              <!-- Longitude / Meridian Lines attached to the rotating map -->
              <g stroke="#9ECBE3" stroke-width="1.6" fill="none">
                <path d="M -360 -145 Q -360 0 -360 145"/>
                <path d="M -270 -145 Q -270 0 -270 145"/>
                <path d="M -180 -145 Q -180 0 -180 145"/>
                <path d="M -90 -145 Q -90 0 -90 145"/>
                <path d="M 0 -145 Q 0 0 0 145"/>
                <path d="M 90 -145 Q 90 0 90 145"/>
                <path d="M 180 -145 Q 180 0 180 145"/>
                <path d="M 270 -145 Q 270 0 270 145"/>
                <path d="M 360 -145 Q 360 0 360 145"/>
              </g>

              <!-- Continents: Paper collage shapes across full cylindrical wrap -->
              <!-- Block 1: Americas (-220 to -110) -->
              <path d="
                M -220 -85 Q -195 -75 -195 -35 Q -215 -10 -205 20
                Q -195 55 -215 85 Q -235 65 -230 10 Q -245 -25 -235 -70 Z"
                fill="#BFDEB4" stroke="#30313B" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M -185 -105 Q -165 -115 -155 -95 Q -170 -85 -185 -105 Z" fill="#D7E8B8" stroke="#30313B" stroke-width="2"/>

              <!-- Block 2: Europe & Africa (-70 to +40) -->
              <path d="
                M -50 -95 Q 0 -105 35 -80 Q 55 -55 35 -30 Q 45 10 20 35
                Q 30 75 5 100 Q -15 110 -30 85 Q -45 45 -30 10
                Q -65 -10 -55 -55 Z"
                fill="#BFDEB4" stroke="#30313B" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M -60 -80 Q -45 -90 -50 -70 Z M -30 -115 Q -10 -120 -15 -95 Z" fill="#D7E8B8" stroke="#30313B" stroke-width="1.8"/>

              <!-- Block 3: Asia & Australia (+60 to +200) -->
              <path d="
                M 40 -80 Q 90 -95 150 -75 Q 170 -45 140 -20 Q 150 15 125 35
                Q 90 40 70 10 Q 50 -10 40 -45 Z"
                fill="#D7E8B8" stroke="#30313B" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M 120 45 Q 150 40 155 70 Q 140 95 115 85 Z" fill="#BFDEB4" stroke="#30313B" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M 85 30 Q 105 25 100 35 Z M 105 35 Q 125 30 120 40 Z" fill="#BFDEB4" stroke="#30313B" stroke-width="1.8"/>

              <!-- Block 4 (Wrapping Block): Duplicate of Americas (+220 to +330) -->
              <path d="
                M 220 -85 Q 245 -75 245 -35 Q 225 -10 235 20
                Q 245 55 225 85 Q 205 65 210 10 Q 195 -25 205 -70 Z"
                fill="#BFDEB4" stroke="#30313B" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M 255 -105 Q 275 -115 285 -95 Q 270 -85 255 -105 Z" fill="#D7E8B8" stroke="#30313B" stroke-width="2"/>
              
              <!-- Duplicate of Europe/Africa (+370 to +480) -->
              <path d="
                M 390 -95 Q 440 -105 475 -80 Q 495 -55 475 -30 Q 485 10 460 35
                Q 470 75 445 100 Q 425 110 410 85 Q 395 45 410 10
                Q 375 -10 385 -55 Z"
                fill="#BFDEB4" stroke="#30313B" stroke-width="2.4" stroke-linejoin="round"/>
            </g>

            <!-- 3D Spherical Volume Overlay -->
            <circle cx="0" cy="0" r="145" fill="url(#sphere-shading)"/>
            <!-- Top-Left Rim Light Highlight -->
            <path d="M -95 -105 Q -20 -140 75 -120" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
          </g>

          <!-- Outer Sphere Border -->
          <circle cx="0" cy="0" r="145" fill="none" stroke="#30313B" stroke-width="3.5"/>
        </g>
      </svg>
    </div>

    <!-- Opportunity Setting 1: Academic Study (top left of globe) -->
    <div id="setting-study">
      <svg viewBox="0 0 220 180" width="100%" height="100%">
        <!-- Connecting paper hinge/tab to globe -->
        <polygon points="140,140 175,145 160,175 125,170" fill="#ECD6A6CB" stroke="#30313B" stroke-width="2"/>
        <!-- Study Setting Base Board -->
        <rect x="15" y="40" width="165" height="105" rx="4" fill="#FFFDF8" stroke="#30313B" stroke-width="2.6"/>
        <!-- Label tag: HỌC TẬP -->
        <rect x="25" y="25" width="85" height="24" rx="3" fill="#087BC1" stroke="#30313B" stroke-width="1.8"/>
        <text x="67" y="41" font-family="PilotDisplay, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">HỌC TẬP</text>
        <!-- Miniature reading desk, study lamp & open book -->
        <polygon points="30,85 160,85 150,120 40,120" fill="#EFE5D7" stroke="#30313B" stroke-width="2" stroke-linejoin="round"/>
        <!-- Lamp -->
        <path d="M45 85V60H65" fill="none" stroke="#30313B" stroke-width="2"/>
        <polygon points="60,56 75,56 70,72 55,72" fill="#FFAA28" stroke="#30313B" stroke-width="1.6"/>
        <!-- Stack of books -->
        <rect x="85" y="70" width="45" height="14" rx="2" fill="#BAA5D2" stroke="#30313B" stroke-width="1.6"/>
        <rect x="88" y="58" width="38" height="12" rx="2" fill="#8CB6CE" stroke="#30313B" stroke-width="1.6"/>
        <!-- Open book leaves -->
        <path d="M100 95Q115 88 130 95Q145 88 160 95V108Q145 101 130 108Q115 101 100 108Z" fill="#FFFDF8" stroke="#30313B" stroke-width="1.6"/>
      </svg>
    </div>

    <!-- Opportunity Setting 2: Professional Career (right of globe) -->
    <div id="setting-work">
      <svg viewBox="0 0 220 180" width="100%" height="100%">
        <!-- Connecting paper hinge/tab to globe -->
        <polygon points="45,85 75,80 80,110 50,115" fill="#ECD6A6CB" stroke="#30313B" stroke-width="2"/>
        <!-- Work Setting Base Board -->
        <rect x="40" y="30" width="165" height="110" rx="4" fill="#FFFDF8" stroke="#30313B" stroke-width="2.6"/>
        <!-- Label tag: NGHỀ NGHIỆP -->
        <rect x="50" y="15" width="110" height="24" rx="3" fill="#B34418" stroke="#30313B" stroke-width="1.8"/>
        <text x="105" y="31" font-family="PilotDisplay, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">NGHỀ NGHIỆP</text>
        <!-- Modern workstation desk & display monitor -->
        <polygon points="55,80 185,80 175,115 65,115" fill="#EAE0D4" stroke="#30313B" stroke-width="2" stroke-linejoin="round"/>
        <!-- Monitor -->
        <rect x="85" y="48" width="65" height="42" rx="2" fill="#FFFDF8" stroke="#30313B" stroke-width="2"/>
        <line x1="117" y1="90" x2="117" y2="100" stroke="#30313B" stroke-width="3"/>
        <!-- Chart on monitor -->
        <path d="M92 78L105 70L120 74L140 60" fill="none" stroke="#087BC1" stroke-width="2" stroke-linecap="round"/>
        <!-- Desk planner / notes -->
        <polygon points="68,90 100,90 95,108 63,108" fill="#FFFDF8" stroke="#30313B" stroke-width="1.5"/>
        <!-- Potted plant -->
        <circle cx="165" cy="74" r="8" fill="#6DAA84" stroke="#30313B" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- Student Mascot (Nhật) -->
    <svg id="student-layer" viewBox="0 0 720 1280" aria-label="Student mascot Minh Nhat">
      <g id="student-rig" transform="translate(415, 785)">
        <g id="student-motion">
          <!-- Shadow -->
          <ellipse cx="63" cy="205" rx="65" ry="10" fill="#D7BDA8" opacity="0.5"/>
          <!-- Legs -->
          <path d="M48 143L41 190L18 194M90 143L98 190L120 194" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          <!-- Blue Backpack -->
          <rect x="103" y="50" width="39" height="91" rx="16" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
          <path d="M113 69L134 78" fill="none" stroke="#A2D8ED" stroke-width="3"/>
          <!-- Far Arm (reaches to touch and spin the globe) -->
          <g id="arm-far-group" transform="translate(25, 72)">
            <g id="arm-far">
              <path d="M0 0Q-25 -10 -45 -25" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
              <circle cx="-45" cy="-25" r="7.5" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
            </g>
          </g>
          <!-- Mascot Body -->
          <path d="M21 31Q24 9 50 12L95 14Q123 16 122 46L115 121Q114 148 86 152L49 149Q20 148 17 123L13 58Q12 42 21 31Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
          <path d="M25 41Q30 25 49 26" fill="none" stroke="#FFD77B" stroke-width="5" stroke-linecap="round"/>
          <!-- Purple Cap -->
          <path d="M28 28Q17 -8 61 -9Q108 -13 116 27Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
          <path d="M17 29Q54 14 111 29L131 34Q138 40 127 42L35 39" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>
          <!-- Eyes -->
          <g id="eyes">
            <ellipse cx="52" cy="68" rx="4.6" ry="7" fill="#30313B"/>
            <ellipse cx="86" cy="67" rx="4.6" ry="7" fill="#30313B"/>
            <circle cx="53.5" cy="66" r="1.8" fill="#FFFDF8"/>
            <circle cx="87.5" cy="65" r="1.8" fill="#FFFDF8"/>
          </g>
          <!-- Cheeks -->
          <ellipse cx="39" cy="87" rx="10" ry="5" fill="#EE7C47" opacity="0.65"/>
          <ellipse cx="99" cy="86" rx="10" ry="5" fill="#EE7C47" opacity="0.65"/>
          <!-- Mouth -->
          <path id="mouth" d="M57 91Q70 105 82 88" fill="none" stroke="#30313B" stroke-width="3.3" stroke-linecap="round"/>
          <path d="M111 48L96 129" fill="none" stroke="#05669D" stroke-width="7" stroke-linecap="round"/>
          <!-- Near Arm (gestures / rests on hip) -->
          <g id="arm-near-group" transform="translate(109, 83)">
            <g id="arm-near">
              <path d="M0 0Q18 20 25 2" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
              <circle cx="25" cy="2" r="7.5" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <!-- Headline Strip: CƠ HỘI RỘNG MỞ -->
    <div id="headline" class="strip">CƠ HỘI RỘNG MỞ</div>
  </div>
</div>

<script>
(()=>{
  const tl = gsap.timeline({ paused: true });

  // Camera subtle push
  tl.fromTo('#world',
    { scale: 1.04, y: 10 },
    { scale: 1.0, y: 0, duration: 1.8, ease: 'power2.out' },
    0
  );

  // Initial states
  tl.set('#headline', { opacity: 0, scale: 0.85, y: -25 }, 0);
  tl.set('#setting-study', { scale: 0, opacity: 0 }, 0);
  tl.set('#setting-work', { scale: 0, opacity: 0 }, 0);

  // 0.00 - 0.80s: "mở ra nhiều cơ hội"
  // Mascot far arm touches and smoothly rotates the globe along tilted axis!
  tl.fromTo('#arm-far',
    { rotation: 22, svgOrigin: '0 0' },
    { rotation: -18, svgOrigin: '0 0', duration: 0.55, ease: 'power2.inOut' },
    0.1
  );

  // Globe synchronized map surface (continents + meridians) spins smoothly on tilted axis
  tl.fromTo('#globe-surface',
    { x: 80 },
    { x: -140, duration: 2.2, ease: 'power2.out' },
    0.15
  );

  // 0.80 - 2.00s: "học tập và nghề nghiệp"
  // Both settings pop up organically from the globe!
  tl.to('#setting-study', {
    scale: 1,
    opacity: 1,
    duration: 0.55,
    ease: 'back.out(1.5)'
  }, 0.85);

  tl.to('#setting-work', {
    scale: 1,
    opacity: 1,
    duration: 0.55,
    ease: 'back.out(1.5)'
  }, 1.15);

  // Mascot looks between the two settings with thoughtful smile
  tl.to('#eyes', {
    x: -3,
    y: -3,
    duration: 0.3
  }, 1.0);

  tl.to('#eyes', {
    x: 2,
    y: -2,
    duration: 0.35
  }, 1.4);

  // 1.8s: Headline "CƠ HỘI RỘNG MỞ" appears
  tl.to('#headline', {
    opacity: 1,
    scale: 1,
    y: 0,
    duration: 0.42,
    ease: 'back.out(1.5)'
  }, 1.8);

  // 2.00 - 3.133s: "trên toàn cầu"
  // Mascot holds proud, confident stance looking forward
  tl.to('#eyes', {
    x: 0,
    y: 0,
    duration: 0.25
  }, 2.2);

  tl.to({ hold: 0 }, { hold: 1, duration: 3.1333333333333333, ease: 'none' }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines['scene-08'] = tl;
})();
</script>
</body>
