<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720,height=1280">
<title>16 · Chương mới được chúc mở ra</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face {
  font-family: 'PilotDisplay';
  src: url('assets/segoe-ui-black.ttf');
  font-weight: 900;
}
@font-face {
  font-family: 'PilotSans';
  src: url('assets/arial.ttf');
}
@font-face {
  font-family: 'PilotSans';
  src: url('assets/arialbd.ttf');
  font-weight: 700;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

#scene-16 {
  position: relative;
  width: 720px;
  height: 1280px;
  overflow: hidden;
  background: #FDF1E6;
  color: #30313B;
  font-family: PilotSans, Arial, sans-serif;
}

#world {
  position: absolute;
  inset: 0;
  transform-origin: 360px 750px;
}

/* Strip Headline: CHƯƠNG MỚI */
.strip {
  position: absolute;
  left: 205px;
  top: 155px;
  background: #087BC1;
  color: #FFFFFF;
  padding: 14px 28px;
  font-family: PilotDisplay, PilotSans, sans-serif;
  font-size: 40px;
  font-weight: 900;
  line-height: 1.1;
  white-space: nowrap;
  box-shadow: 5px 7px 0 #30313b12;
  border-radius: 4px;
  z-index: 25;
  opacity: 0;
  transform: translateY(-16px) scale(0.95);
}

svg.art {
  position: absolute;
  inset: 0;
  width: 720px;
  height: 1280px;
  overflow: visible;
}
</style>
</head>
<body>
<div id="scene-16" data-composition-id="scene-16" data-width="720" data-height="1280" data-start="0" data-duration="3.066666666666667">
  <div id="world">
    
    <!-- Headline -->
    <div id="scene-title" class="strip">CHƯƠNG MỚI</div>

    <!-- Illustrated Dutch Canal Environment -->
    <svg class="art" viewBox="0 0 720 1280" aria-label="Illustrated Amsterdam canal and bridge scene">
      <defs>
        <!-- Soft morning sky gradient -->
        <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FCEEE2"/>
          <stop offset="60%" stop-color="#F6E2DC"/>
          <stop offset="100%" stop-color="#EADBEE"/>
        </linearGradient>
        <!-- Water reflection gradient -->
        <linearGradient id="water-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#93B8C8"/>
          <stop offset="100%" stop-color="#648A9C"/>
        </linearGradient>
      </defs>

      <!-- Sky Background -->
      <rect x="0" y="0" width="720" height="850" fill="url(#sky-grad)"/>

      <!-- Sun Glow -->
      <circle cx="360" cy="500" r="140" fill="#FFF8EE" opacity="0.6"/>

      <!-- ==============================================
           SKYLINE: AMSTERDAM GABLE HOUSES (x70–650, y360–680)
           ============================================== -->
      <g id="skyline-buildings">
        <!-- Far silhouette buildings -->
        <rect x="80" y="440" width="90" height="240" fill="#E4D0DE"/>
        <polygon points="80,440 125,385 170,440" fill="#D3BBCB"/>
        
        <rect x="180" y="410" width="105" height="270" fill="#DECAD4"/>
        <polygon points="180,410 210,410 210,360 250,360 250,410 285,410" fill="#CCA8BC"/>
        
        <rect x="295" y="430" width="95" height="250" fill="#E8D5CE"/>
        <polygon points="295,430 342,370 390,430" fill="#D9BAAE"/>

        <rect x="400" y="390" width="115" height="290" fill="#D8CBDD"/>
        <polygon points="400,390 425,390 425,340 490,340 490,390 515,390" fill="#BFADC4"/>

        <rect x="525" y="420" width="110" height="260" fill="#E2CEC2"/>
        <polygon points="525,420 580,360 635,420" fill="#CFAEA0"/>

        <!-- Warm glowing window grid rows -->
        <g fill="#FFFDF2" opacity="0.85">
          <rect x="100" y="460" width="18" height="24" rx="2"/>
          <rect x="135" y="460" width="18" height="24" rx="2"/>
          <rect x="100" y="505" width="18" height="24" rx="2"/>
          <rect x="135" y="505" width="18" height="24" rx="2"/>

          <rect x="205" y="440" width="22" height="28" rx="2"/>
          <rect x="245" y="440" width="22" height="28" rx="2"/>
          <rect x="205" y="490" width="22" height="28" rx="2"/>
          <rect x="245" y="490" width="22" height="28" rx="2"/>

          <rect x="425" y="420" width="22" height="28" rx="2"/>
          <rect x="465" y="420" width="22" height="28" rx="2"/>
          <rect x="425" y="470" width="22" height="28" rx="2"/>
          <rect x="465" y="470" width="22" height="28" rx="2"/>

          <rect x="550" y="450" width="22" height="26" rx="2"/>
          <rect x="590" y="450" width="22" height="26" rx="2"/>
        </g>
      </g>

      <!-- Canal Quay Wall & Water Surface -->
      <rect x="0" y="830" width="720" height="250" fill="url(#water-grad)"/>
      <line x1="0" y1="830" x2="720" y2="830" stroke="#30313B" stroke-width="4"/>
      
      <!-- Water ripple strokes -->
      <g stroke="#C6E3F0" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
        <path d="M60 860Q120 865 180 860"/>
        <path d="M240 880Q320 885 400 880"/>
        <path d="M460 865Q560 870 660 865"/>
        <path d="M120 915Q220 920 320 915"/>
        <path d="M380 925Q480 930 580 925"/>
        <path d="M80 970Q180 975 280 970"/>
        <path d="M420 980Q520 985 620 980"/>
      </g>

      <!-- ==============================================
           THE LOW BRICK CANAL BRIDGE (x60–660, y700–910)
           ============================================== -->
      <g id="canal-bridge">
        <!-- Bridge Under-Arch Shadow -->
        <path d="M210 830Q360 760 510 830Z" fill="#3A4D57"/>
        
        <!-- Bridge Structure (warm terracotta brick #D37D58) -->
        <path d="M60 790Q360 720 660 790L660 830Q360 760 60 830Z" fill="#C96B48" stroke="#30313B" stroke-width="3.5"/>
        <!-- Bridge Walkway Surface -->
        <path d="M60 790Q360 720 660 790" fill="none" stroke="#FAF1E6" stroke-width="7"/>
        
        <!-- Classic Bridge Cast-Iron Railing -->
        <g stroke="#30313B" stroke-width="3" stroke-linecap="round">
          <path d="M70 755Q360 685 650 755" fill="none" stroke-width="4"/>
          <!-- Vertical balusters -->
          <line x1="120" y1="780" x2="120" y2="745"/>
          <line x1="180" y1="768" x2="180" y2="733"/>
          <line x1="240" y1="758" x2="240" y2="723"/>
          <line x1="300" y1="751" x2="300" y2="716"/>
          <line x1="360" y1="748" x2="360" y2="713"/>
          <line x1="420" y1="751" x2="420" y2="716"/>
          <line x1="480" y1="758" x2="480" y2="723"/>
          <line x1="540" y1="768" x2="540" y2="733"/>
          <line x1="600" y1="780" x2="600" y2="745"/>
        </g>
      </g>

      <!-- ==============================================
           MASCOT NHẬT WALKING ACROSS BRIDGE
           Anchored at (320, 640)
           ============================================== -->
      <g id="student-walk-anchor" transform="translate(320, 640)">
        <g id="student-rig">
          <!-- Footstep shadow on bridge walkway -->
          <ellipse cx="65" cy="180" rx="42" ry="8" fill="#30313B" opacity="0.2"/>
          
          <!-- Alternating Legs in walk cycle -->
          <g id="legs-group">
            <path id="leg-left" d="M48 120L38 165L20 168" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
            <path id="leg-right" d="M82 120L95 165L115 168" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- Blue Backpack (Carrying to Netherlands) -->
          <rect x="15" y="45" width="34" height="85" rx="14" fill="#087BC1" stroke="#30313B" stroke-width="3"/>
          <path d="M22 65L38 75" fill="none" stroke="#A2D8ED" stroke-width="2.5"/>

          <!-- Torso -->
          <path d="M35 30Q38 10 65 12L98 14Q120 16 118 42L112 110Q110 132 85 135L52 132Q28 131 25 108Z" fill="#FFAA28" stroke="#30313B" stroke-width="3.3"/>
          <path d="M42 38Q48 24 65 25" fill="none" stroke="#FFD77B" stroke-width="4.5" stroke-linecap="round"/>

          <!-- Purple Cap -->
          <path d="M42 26Q32 -6 70 -8Q110 -10 116 25Z" fill="#A990D5" stroke="#30313B" stroke-width="3"/>
          <path d="M30 27Q68 12 112 27L130 32Q136 38 126 40L38 38" fill="#8B73C0" stroke="#30313B" stroke-width="3"/>

          <!-- Head / Face (Can rotate to smile at viewer) -->
          <g id="student-head-feature" transform-origin="75 45">
            <!-- Eyes -->
            <ellipse id="eye-l" cx="62" cy="52" rx="4.5" ry="6.2" fill="#30313B"/>
            <ellipse id="eye-r" cx="88" cy="52" rx="4.5" ry="6.2" fill="#30313B"/>
            <circle cx="63.5" cy="51" r="1.5" fill="#FFFDF8"/>
            <circle cx="89.5" cy="51" r="1.5" fill="#FFFDF8"/>
            <!-- Cheeks -->
            <ellipse cx="50" cy="65" rx="8" ry="4" fill="#EE7C47" opacity="0.65"/>
            <ellipse cx="100" cy="65" rx="8" ry="4" fill="#EE7C47" opacity="0.65"/>
            <!-- Happy Adventurous Smile -->
            <path id="student-mouth" d="M68 70Q78 80 88 70" stroke="#30313B" stroke-width="3" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Free Left Arm (Swings in walk) -->
          <g id="arm-left" transform-origin="38 45">
            <path d="M38 45Q18 75 10 95" fill="none" stroke="#30313B" stroke-width="5" stroke-linecap="round"/>
            <circle cx="10" cy="95" r="7" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
          </g>

          <!-- Right Arm (Carries Blue Notebook / Waves cheerily) -->
          <g id="arm-right" transform-origin="95 45">
            <!-- Arm bone -->
            <path id="right-arm-path" d="M95 45Q120 75 125 95" fill="none" stroke="#30313B" stroke-width="5.5" stroke-linecap="round"/>
            <!-- Hand -->
            <circle id="right-hand-circle" cx="125" cy="95" r="7.5" fill="#FFAC3C" stroke="#30313B" stroke-width="2.5"/>
            <!-- Small Blue Notebook under arm -->
            <g id="carried-notebook" transform="translate(108, 70) rotate(15)">
              <rect x="0" y="0" width="28" height="40" rx="2" fill="#087BC1" stroke="#30313B" stroke-width="2"/>
              <polygon points="18,0 24,0 24,-6 18,-6" fill="#FF7A30" stroke="#30313B" stroke-width="1.2"/>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </div>
</div>

<script>
(function() {
  const tl = gsap.timeline({ paused: false });

  // 0.00–0.700s: "Chúc Minh Nhật"
  // Nhật walks steadily across the bridge from left to center
  tl.fromTo('#student-walk-anchor', {
    x: 230,
    y: 655
  }, {
    x: 320,
    y: 640,
    duration: 1.2,
    ease: 'none'
  }, 0);

  // Subtle walk bounce
  tl.to('#student-rig', {
    y: -5,
    repeat: 3,
    yoyo: true,
    duration: 0.3,
    ease: 'sine.inOut'
  }, 0);

  // Legs swing
  tl.to('#leg-left', {
    attr: { d: 'M48 120L60 165L80 168' },
    repeat: 3,
    yoyo: true,
    duration: 0.3,
    ease: 'sine.inOut'
  }, 0);

  tl.to('#leg-right', {
    attr: { d: 'M82 120L70 165L50 168' },
    repeat: 3,
    yoyo: true,
    duration: 0.3,
    ease: 'sine.inOut'
  }, 0);

  // Left arm swings
  tl.to('#arm-left', {
    rotation: 20,
    repeat: 3,
    yoyo: true,
    duration: 0.3,
    ease: 'sine.inOut'
  }, 0);

  // 0.70–2.000s: "hành trình thật rực rỡ"
  // Nhật stops in the middle of the bridge, turns head to look across the view
  tl.to('#student-head-feature', {
    x: 4,
    duration: 0.35,
    ease: 'power2.out'
  }, 1.1);

  // 2.00–3.083s: "tại Hà Lan"
  // Nhật waves right hand happily
  tl.to('#right-arm-path', {
    attr: { d: 'M95 45Q135 25 130 5' },
    duration: 0.35,
    ease: 'power2.out'
  }, 1.7);

  tl.to('#right-hand-circle', {
    attr: { cx: 130, cy: 5 },
    duration: 0.35,
    ease: 'power2.out'
  }, 1.7);

  tl.to('#carried-notebook', {
    y: -30,
    rotation: -5,
    duration: 0.35,
    ease: 'power2.out'
  }, 1.7);

  // Friendly wave wiggle
  tl.to('#arm-right', {
    rotation: 12,
    repeat: 3,
    yoyo: true,
    duration: 0.2,
    ease: 'sine.inOut'
  }, 2.05);

  // Headline "CHƯƠNG MỚI" pops in gracefully in the sky
  tl.to('#scene-title', {
    opacity: 1,
    y: 0,
    scale: 1,
    duration: 0.45,
    ease: 'back.out(1.3)'
  }, 1.85);

  // Nhật turns back forward and takes next steps toward right edge
  tl.to('#student-head-feature', {
    x: 0,
    duration: 0.25
  }, 2.65);

  tl.to('#student-walk-anchor', {
    x: 365,
    y: 642,
    duration: 0.4,
    ease: 'power1.in'
  }, 2.65);

  // Hold at end ready to continue directly into Scene 17
  tl.to({ hold: 0 }, { hold: 1, duration: 3.066666666666667, ease: 'none' }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines['scene-16'] = tl;
})();
</script>
</body>
</html>
