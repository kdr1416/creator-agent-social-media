<script>
const tl = gsap.timeline({paused:true});
const near = {x: 320, y: 720}, far = {x: 350, y: 840};

function setArm(prefix, sx, sy, ex, ey, l1, l2, bend) {
  const dx = ex - sx, dy = ey - sy;
  const d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01);
  const a = Math.atan2(dy, dx);
  const b = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const x = sx + l1 * Math.cos(a + b * bend);
  const y = sy + l1 * Math.sin(a + b * bend);
  document.getElementById(prefix + '-upper').setAttribute('d', `M${sx},${sy}L${x},${y}`);
  document.getElementById(prefix + '-lower').setAttribute('d', `M${x},${y}L${ex},${ey}`);
  document.getElementById(prefix + '-hand').setAttribute('cx', ex);
  document.getElementById(prefix + '-hand').setAttribute('cy', ey);
}

function updateArms() {
  setArm('near', 262, 647, near.x, near.y, 115, 115, 1);
  setArm('far', 169, 650, far.x, far.y, 145, 145, 1);
}
updateArms();

const heroes = ['#hero-tech', '#hero-biz', '#hero-it', '#hero-media'];
const labels = ['#lbl-tech', '#lbl-biz', '#lbl-it', '#lbl-media'];

gsap.set(heroes, {opacity: 0, scale: 0.75, y: 35, transformOrigin: '50% 100%'});
gsap.set(labels, {opacity: 0, y: 10});
gsap.set('#tag-header', {opacity: 0, y: -8});

// Choreography (6.264s)
// 0.0s - 1.6s: Intro & Discipline 1 (Kỹ thuật)
tl.to('#tag-header', {opacity: 1, y: 0, duration: 0.5, ease: 'power2.out'}, 0.2)
  .to(near, {x: 420, y: 640, duration: 0.6, ease: 'power2.inOut', onUpdate: updateArms}, 0.3)
  .to('#hero-tech', {opacity: 1, scale: 1, y: 0, duration: 0.45, ease: 'back.out(1.2)'}, 0.4)
  .to('#lbl-tech', {opacity: 1, y: 0, duration: 0.3}, 0.5)
  .to('#gear-s5', {rotation: 35, svgOrigin: '490 535', duration: 1.0, ease: 'power1.out'}, 0.5)

// 1.6s - 3.1s: Morph to Discipline 2 (Kinh doanh)
  .to('#hero-tech', {opacity: 0, scale: 0.8, y: -20, duration: 0.25}, 1.6)
  .to('#lbl-tech', {opacity: 0, duration: 0.2}, 1.65)
  .to(near, {x: 405, y: 655, duration: 0.4, ease: 'power2.inOut', onUpdate: updateArms}, 1.7)
  .to('#hero-biz', {opacity: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.2)'}, 1.8)
  .to('#lbl-biz', {opacity: 1, y: 0, duration: 0.3}, 1.9)

// 3.1s - 4.6s: Morph to Discipline 3 (CNTT)
  .to('#hero-biz', {opacity: 0, scale: 0.8, y: -20, duration: 0.25}, 3.1)
  .to('#lbl-biz', {opacity: 0, duration: 0.2}, 3.15)
  .to(near, {x: 430, y: 630, duration: 0.4, ease: 'power2.inOut', onUpdate: updateArms}, 3.2)
  .to('#hero-it', {opacity: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.2)'}, 3.3)
  .to('#lbl-it', {opacity: 1, y: 0, duration: 0.3}, 3.4)

// 4.6s - 6.264s: Morph to Discipline 4 (Truyền thông)
  .to('#hero-it', {opacity: 0, scale: 0.8, y: -20, duration: 0.25}, 4.6)
  .to('#lbl-it', {opacity: 0, duration: 0.2}, 4.65)
  .to(near, {x: 420, y: 645, duration: 0.4, ease: 'power2.inOut', onUpdate: updateArms}, 4.7)
  .to('#hero-media', {opacity: 1, scale: 1, y: 0, duration: 0.45, ease: 'back.out(1.2)'}, 4.8)
  .to('#lbl-media', {opacity: 1, y: 0, duration: 0.3}, 4.9)
  .to(near, {x: 350, y: 700, duration: 0.6, ease: 'power2.inOut', onUpdate: updateArms}, 5.5);

window.__timelines = window.__timelines || {};
window.__timelines['scene05'] = tl;
</script>
