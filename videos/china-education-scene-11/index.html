<body>
<div data-hf-id="hf-s11-root" id="root" data-composition-id="scene11" data-width="720" data-height="1280" data-duration="3.582" data-start="0">
 <div data-hf-id="hf-s11-ground" id="scene11-ground" class="clip ground" data-start="0" data-duration="3.582" data-track-index="0"></div>
 <svg data-hf-id="hf-s11-art" id="scene11-art" class="art clip" data-start="0" data-duration="3.582" data-track-index="1" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">

   <radialGradient id="sensor-beam" cx="50%" cy="100%" r="100%"><stop stop-color="#0284C7" stop-opacity=".7"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- Technical ground shadows -->
  <ellipse cx="200" cy="1040" rx="110" ry="15" fill="#E2E8F0"/>
  <ellipse cx="340" cy="980" rx="120" ry="16" fill="#E2E8F0"/>
  <g id="agv-shadow" transform="translate(530, 980)">
   <ellipse cx="0" cy="0" rx="85" ry="16" fill="#CBD5E1"/>
  </g>

  <!-- Mechanical Cutaway Test Bed / Station -->

   <!-- Outer frame -->

   <!-- Cutaway interior window -->

   <!-- Circuits -->
   <path d="M25 170 H65 V120 H105 V150 H135" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
   <circle cx="65" cy="120" r="5" fill="#38BDF8"/>
   <circle cx="105" cy="150" r="5" fill="#38BDF8"/>
   <rect x="45" y="160" width="28" height="28" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
   <rect x="14" y="60" width="132" height="150" rx="8" fill="url(#cutaway-glass)"/>
   <!-- Intake tray at top -->
   <rect x="-8" y="0" width="176" height="22" rx="6" fill="#334155"/>

   <!-- Sensor detection cone -->
   <polygon id="sensor-cone" points="80,0 30,-50 130,-50" fill="url(#sensor-beam)" opacity="0"/>

  <!-- Automated Guided Vehicle (AGV Rover) -->
  <g id="agv-rover" transform="translate(530, 840)">
   <!-- Wheels -->
   <rect x="-60" y="80" width="28" height="24" rx="6" fill="#1E293B"/>
   <rect x="32" y="80" width="28" height="24" rx="6" fill="#1E293B"/>
   <!-- Chassis -->
   <rect x="-70" y="30" width="140" height="52" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
   <rect x="-55" y="44" width="110" height="10" rx="5" fill="#0284C7"/>
   <!-- Headlight -->
   <circle cx="55" cy="56" r="7" fill="#38BDF8" id="rover-light"/>
   <!-- Cargo Bed tray -->
   <rect x="-50" y="16" width="100" height="14" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Industrial Articulated Robotic Transfer Arm (Mounted at 420, 680) -->
  <g id="robot-rig">
   <!-- Base pedestal socket -->
   <circle cx="420" cy="680" r="24" fill="#1E293B" stroke="#0284C7" stroke-width="4"/>
   <!-- Robotic Arm Segments -->
   <path id="robot-upper-arm" fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
   <path id="robot-upper-accent" fill="none" stroke="#0284C7" stroke-width="6" stroke-linecap="round"/>
   <path id="robot-forearm" fill="none" stroke="#475569" stroke-width="15" stroke-linecap="round"/>
   <path id="robot-fore-accent" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
   <circle id="robot-elbow-joint" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="3"/>
   <circle id="robot-wrist-joint" r="10" fill="#1E293B"/>
   <path id="claw-l" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
   <path id="claw-r" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Transferred Cargo Package (Starts on test tray at 320, 660) -->
  <g id="cargo-cube-wrap" transform="translate(320, 660)">
   <g id="cargo-cube">
    <rect x="-22" y="-22" width="44" height="44" rx="8" fill="url(#cube-grad)" stroke="#C2410C" stroke-width="2"/>
    <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#FFFFFF" opacity=".85"/>
    <circle cx="0" cy="0" r="5" fill="#0284C7"/>
   </g>
  </g>

  <!-- Student Rig: Rear Arm (BEHIND torso) -->
  <g id="arm-back">
   <path id="back-sleeve" fill="none" stroke="#D94B20" stroke-width="37" stroke-linecap="round"/>
   <path id="back-skin" fill="none" stroke="#E9AA83" stroke-width="26" stroke-linecap="round"/>
   <ellipse id="back-hand" rx="16" ry="13" fill="#F5BF99"/>
  </g>

  <!-- Student Torso & Head -->
  <g id="student">
   <g id="legs">
    <path d="M177 816L173 1005H211L228 864 243 1006H281L271 816Z" fill="#829DAF"/>
    <path d="M174 997L166 1021Q159 1038 181 1039H219V1019L210 998Z" fill="#316A72"/>
    <path d="M244 997L243 1038H289Q307 1037 296 1023L278 999Z" fill="#316A72"/>
   </g>
   <path d="M185 636Q162 645 157 678L163 820Q212 844 276 820L288 682Q280 646 252 636Z" fill="#FF773B"/>
   <g id="head">
    <path d="M204 605V652Q220 665 239 649V602" fill="#E5A17D"/>
    <ellipse cx="218" cy="550" rx="62" ry="75" fill="#172C42"/>
    <path d="M174 529Q177 497 211 493Q248 489 263 519L266 571Q259 609 228 618Q189 615 177 576Z" fill="#F5BF99"/>
    <path d="M164 540Q145 486 185 473Q207 453 236 469Q270 476 276 509L259 536 247 510Q213 528 184 514L178 549Z" fill="#172C42"/>
    <g id="eyes" fill="#172C42"><ellipse cx="227" cy="555" rx="4.7" ry="7"/><ellipse cx="253" cy="556" rx="4" ry="6.5"/></g>
    <path d="M224 588Q236 598 248 586" fill="none" stroke="#8E4F40" stroke-width="3.5" stroke-linecap="round"/>
   </g>
  </g>

  <!-- Student Front Arm (In FRONT of torso) -->
  <g id="front-arm">
   <path id="front-sleeve" fill="none" stroke="#FF773B" stroke-width="39" stroke-linecap="round"/>
   <path id="front-skin" fill="none" stroke="#F5BF99" stroke-width="27" stroke-linecap="round"/>
   <ellipse id="front-hand" rx="16" ry="13" fill="#F5BF99"/>
  </g>
 </svg>

 <div class="label" id="label-title">TỰ ĐỘNG HÓA & TRÍ TUỆ NHÂN TẠO</div>
 <div class="label" id="label-sub">Từ Cảm biến tới Quyết định Hành động</div>
 <div class="label" id="label-tag">HỆ THỐNG PHỐI HỢP TỰ HÀNH</div>

 <audio data-hf-id="hf-s11-voice" id="scene11-voice" src="assets/audio.wav" data-start="0" data-duration="3.582" data-track-index="2" data-volume="1"></audio>
</div>

<script>
const tl = gsap.timeline({paused:true});
// Student arm resting down cleanly
const front = {x: 240, y: 760}, back = {x: 200, y: 790};

function arm(prefix, sx, sy, ex, ey, l1, l2, bend){
 const dx = ex - sx, dy = ey - sy, d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01),
       a = Math.atan2(dy, dx), b = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
 const elbowX = sx + l1 * Math.cos(a + b * bend), elbowY = sy + l1 * Math.sin(a + b * bend);
 document.getElementById(prefix + '-sleeve').setAttribute('d', `M${sx},${sy}L${elbowX},${elbowY}`);
 document.getElementById(prefix + '-skin').setAttribute('d', `M${elbowX},${elbowY}L${ex},${ey}`);
 const hand = document.getElementById(prefix + '-hand');
 hand.setAttribute('cx', ex); hand.setAttribute('cy', ey);
}

function pose(){
 arm('front', 271, 663, front.x, front.y, 105, 116, 1);
 arm('back', 180, 674, back.x, back.y, 115, 120, 1);
}
pose();

// Robot state & two-bone IK solver
const robot = {x: 400, y: 530, open: 1};
const cube = {x: 320, y: 660};
const agv = {x: 530};

function updateRobot(tx, ty, clawOpen) {
  const sx = 420, sy = 680;
  const dx = tx - sx, dy = ty - sy;
  const d = Math.min(Math.hypot(dx, dy), 120 + 100 - 0.1);
  const a = Math.atan2(dy, dx);
  const b = Math.acos(Math.max(-1, Math.min(1, (120*120 + d*d - 100*100) / (2 * 120 * d))));
  
  // Choose elbow solution with smaller Y (always bends upward like a crane arch)
  const y1 = sy + 120 * Math.sin(a + b);
  const y2 = sy + 120 * Math.sin(a - b);
  const angle = (y1 < y2) ? (a + b) : (a - b);
  const elbowX = sx + 120 * Math.cos(angle);
  const elbowY = sy + 120 * Math.sin(angle);

  document.getElementById('robot-upper-arm').setAttribute('d', `M${sx},${sy} L${elbowX},${elbowY}`);
  document.getElementById('robot-upper-accent').setAttribute('d', `M${sx * 0.7 + elbowX * 0.3},${sy * 0.7 + elbowY * 0.3} L${sx * 0.3 + elbowX * 0.7},${sy * 0.3 + elbowY * 0.7}`);
  document.getElementById('robot-forearm').setAttribute('d', `M${elbowX},${elbowY} L${tx},${ty}`);
  document.getElementById('robot-fore-accent').setAttribute('d', `M${elbowX * 0.7 + tx * 0.3},${elbowY * 0.7 + ty * 0.3} L${elbowX * 0.3 + tx * 0.7},${elbowY * 0.3 + ty * 0.7}`);
  
  const joint = document.getElementById('robot-elbow-joint');
  joint.setAttribute('cx', elbowX);
  joint.setAttribute('cy', elbowY);
  
  const wrist = document.getElementById('robot-wrist-joint');
  wrist.setAttribute('cx', tx);
  wrist.setAttribute('cy', ty);

  const faAngle = Math.atan2(ty - elbowY, tx - elbowX);
  const fx = Math.cos(faAngle), fy = Math.sin(faAngle);
  const px = -Math.sin(faAngle), py = Math.cos(faAngle);
  const span = clawOpen ? 26 : 14;

  const cl1X = tx + px * 6, cl1Y = ty + py * 6;
  const cl2X = tx + px * span + fx * 10, cl2Y = ty + py * span + fy * 10;
  const cl3X = tx + px * (span - 4) + fx * 24, cl3Y = ty + py * (span - 4) + fy * 24;
  document.getElementById('claw-l').setAttribute('d', `M${cl1X},${cl1Y} L${cl2X},${cl2Y} L${cl3X},${cl3Y}`);

  const cr1X = tx - px * 6, cr1Y = ty - py * 6;
  const cr2X = tx - px * span + fx * 10, cr2Y = ty - py * span + fy * 10;
  const cr3X = tx - px * (span - 4) + fx * 24, cr3Y = ty - py * (span - 4) + fy * 24;
  document.getElementById('claw-r').setAttribute('d', `M${cr1X},${cr1Y} L${cr2X},${cr2Y} L${cr3X},${cr3Y}`);
}

function syncScene() {
  updateRobot(robot.x, robot.y, robot.open);
  document.getElementById('cargo-cube-wrap').setAttribute('transform', `translate(${cube.x}, ${cube.y})`);
  document.getElementById('agv-rover').setAttribute('transform', `translate(${agv.x}, 840)`);
  document.getElementById('agv-shadow').setAttribute('transform', `translate(${agv.x}, 980)`);
}

// Initial draw
syncScene();
tl.eventCallback("onUpdate", syncScene);

gsap.set(['#label-title', '#label-sub', '#label-tag'], {opacity: 0, x: -20});

// Choreography over 3.582s
tl.to(['#label-title', '#label-sub'], {opacity: 1, x: 0, duration: 0.5, stagger: 0.15, ease: 'power2.out'}, 0.2)
  
  // 0.4 - 0.9s: Sensor cone pulses and scans cube
  .to('#sensor-cone', {opacity: 0.85, duration: 0.2, ease: 'power1.out'}, 0.4)
  .to('#sensor-led', {fill: '#FF6B2B', duration: 0.2}, 0.4)
  .to('#sensor-cone', {opacity: 0, duration: 0.3}, 0.7)

  // 0.8 - 1.4s: Robot arm rotates down to grip cube at (320, 642)
  .to(robot, {x: 320, y: 642, duration: 0.6, ease: 'power2.inOut'}, 0.8)

  // 1.4 - 1.6s: Claws close on cube
  .to(robot, {open: 0, duration: 0.2, ease: 'power1.inOut'}, 1.4)

  // 1.6 - 2.45s: Robot arm lifts cube up and deposits onto AGV rover at (530, 834)
  .to(cube, {x: 530, y: 834, duration: 0.85, ease: 'power2.inOut'}, 1.6)
  .to(robot, {x: 530, y: 814, duration: 0.85, ease: 'power2.inOut'}, 1.6)

  // 2.45s: Claws open to release
  .to(robot, {open: 1, duration: 0.1, ease: 'power1.inOut'}, 2.45)

  // 2.55s: Arm lifts away cleanly
  .to(robot, {x: 440, y: 580, duration: 0.45, ease: 'power2.out'}, 2.55)
  .to('#label-tag', {opacity: 1, x: 0, duration: 0.4, ease: 'back.out(1.5)'}, 2.6)

  // 2.7 - 3.582s: AGV rover departs smoothly with cargo to the right
  .to(agv, {x: 780, duration: 0.85, ease: 'power2.in'}, 2.7)
  .to(cube, {x: 780, duration: 0.85, ease: 'power2.in'}, 2.7)
  .to('#head', {rotation: 3, svgOrigin: '220 610', duration: 0.4, ease: 'power2.inOut'}, 2.8);

window.__timelines = window.__timelines || {};
window.__timelines['scene11'] = tl;
</script>
