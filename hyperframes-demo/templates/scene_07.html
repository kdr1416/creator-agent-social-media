<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280, initial-scale=1.0" />
    <title>Scene 07 - Bảng nấc thang lũy tiến: 2, 4, 7 người</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 720px;
        height: 1280px;
        background: #f8fafc;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #0f172a;
        overflow: hidden;
      }

      /* ── STUDIO BACKGROUND (HF_ONLY) ── */
      .canvas-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 30%, rgba(255, 107, 43, 0.05) 0%, transparent 60%),
          linear-gradient(to right, rgba(15, 23, 42, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15, 23, 42, 0.04) 1px, transparent 1px),
          #f8fafc;
        background-size: 100% 100%, 36px 36px, 36px 36px, 100% 100%;
        z-index: 1;
      }

      /* ── BRAND PILL ── */
      .brand-badge-wrapper {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 20;
      }
      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #0f172a;
        color: #ffffff;
        padding: 8px 20px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        opacity: 0;
        transform: translateY(-10px);
      }
      .brand-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5722;
      }

      /* ── HEADLINE ── */
      .headline-wrapper {
        position: absolute;
        top: 102px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 20;
        padding: 0 32px;
      }
      .headline {
        font-size: 38px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #0f172a;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(16px);
      }
      .headline-bar {
        width: 72px;
        height: 5px;
        background: #ff5722;
        border-radius: 999px;
        margin: 12px auto 0;
        opacity: 0;
        transform: scaleX(0);
      }

      /* ── LADDER MILESTONE STAGE ── */
      .ladder-stage {
        position: absolute;
        top: 236px;
        left: 48px;
        right: 48px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 25;
      }

      .ladder-card {
        background: #ffffff;
        border: 2px solid #0f172a;
        border-radius: 20px;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        opacity: 0;
        transform: translateX(-24px);
      }

      .ladder-card.accented {
        border-color: #0f172a;
        background: #ffffff;
        box-shadow: 0 12px 28px rgba(194, 65, 12, 0.12);
      }

      .ladder-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .step-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #ffffff;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .ladder-card.accented .step-pill {
        background: #0f172a;
        color: #ffffff;
      }

      .ladder-right {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }

      .ladder-amount {
        font-size: 32px;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .ladder-card.accented .ladder-amount {
        color: #c2410c;
      }

      .ladder-unit {
        font-size: 15px;
        font-weight: 800;
        color: #475569;
        text-transform: uppercase;
      }

      .ladder-card.accented .ladder-unit {
        color: #c2410c;
      }

      /* Vertical connector track behind cards */
      .ladder-track {
        position: absolute;
        top: 260px;
        left: 78px;
        width: 4px;
        height: 240px;
        background: rgba(15, 23, 42, 0.1);
        border-radius: 999px;
        z-index: 10;
        transform-origin: top;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="main" data-width="720" data-height="1280" data-duration="9.60">
      <!-- Background studio canvas -->
      <div class="canvas-bg" data-layout-allow-overlap data-layout-allow-occlusion></div>

      <!-- Connector line -->
      <div class="ladder-track" id="ladder-track" data-layout-allow-overlap data-layout-allow-occlusion></div>

      <!-- Voice Track (9.60s) -->
      <audio id="voice-track" class="clip" src="./assets/audio.wav" data-start="0" data-duration="9.60" preload="auto"></audio>

      <!-- Top Branding: ESORA • DU HỌC CANADA -->
      <div class="brand-badge-wrapper" id="brand-badge" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>ESORA • DU HỌC CANADA</span>
        </div>
      </div>

      <!-- Headline -->
      <div class="headline-wrapper" data-layout-allow-overlap data-layout-allow-occlusion>
        <h1 class="headline" id="main-headline">MỨC TÀI CHÍNH THEO QUY MÔ</h1>
        <div class="headline-bar" id="headline-bar"></div>
      </div>

      <!-- 3-Tier Milestone Ladder -->
      <div class="ladder-stage" data-layout-allow-overlap data-layout-allow-occlusion>
        <!-- Step 1: 2 người ~555 triệu -->
        <div class="ladder-card" id="card-1">
          <div class="ladder-left">
            <span class="step-pill">2 NGƯỜI</span>
          </div>
          <div class="ladder-right">
            <span class="ladder-amount">~555</span>
            <span class="ladder-unit">TRIỆU</span>
          </div>
        </div>

        <!-- Step 2: 4 người ~820 triệu -->
        <div class="ladder-card" id="card-2">
          <div class="ladder-left">
            <span class="step-pill">4 NGƯỜI</span>
          </div>
          <div class="ladder-right">
            <span class="ladder-amount">~820</span>
            <span class="ladder-unit">TRIỆU</span>
          </div>
        </div>

        <!-- Step 3: 7 người ~1,16 tỷ -->
        <div class="ladder-card accented" id="card-3">
          <div class="ladder-left">
            <span class="step-pill">7 NGƯỜI</span>
          </div>
          <div class="ladder-right">
            <span class="ladder-amount">~1,16</span>
            <span class="ladder-unit">TỶ ĐỒNG</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Entry branding & headline
      tl.to(
        "#brand-badge .brand-badge",
        {
          opacity: 1,
          y: 0,
          duration: 0.5,
          ease: "power3.out",
        },
        0.1
      );

      tl.to(
        "#main-headline",
        {
          opacity: 1,
          y: 0,
          duration: 0.6,
          ease: "power3.out",
        },
        0.3
      );

      tl.to(
        "#headline-bar",
        {
          opacity: 1,
          scaleX: 1,
          duration: 0.5,
          ease: "back.out(1.5)",
        },
        0.6
      );

      tl.to(
        "#ladder-track",
        {
          opacity: 1,
          duration: 0.5,
        },
        0.7
      );

      // Card 1: 2 người ~555 triệu (narrator speaks at ~1.0s)
      tl.to(
        "#card-1",
        {
          opacity: 1,
          x: 0,
          duration: 0.6,
          ease: "back.out(1.3)",
        },
        1.1
      );

      // Card 2: 4 người ~820 triệu (narrator speaks at ~3.5s)
      tl.to(
        "#card-2",
        {
          opacity: 1,
          x: 0,
          duration: 0.6,
          ease: "back.out(1.3)",
        },
        3.5
      );

      // Card 3: 7 người ~1,16 tỷ (narrator speaks at ~6.0s)
      tl.to(
        "#card-3",
        {
          opacity: 1,
          x: 0,
          scale: 1.03,
          duration: 0.7,
          ease: "back.out(1.4)",
        },
        6.0
      );

      // Settling breath
      tl.to(
        "#card-3",
        {
          scale: 1.0,
          duration: 0.8,
          ease: "power2.out",
        },
        7.2
      );

      // Subtle exit fade
      tl.to(
        [".ladder-card", "#main-headline", "#headline-bar"],
        {
          opacity: 0.9,
          duration: 0.5,
          ease: "power2.inOut",
        },
        9.0
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
