<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280, initial-scale=1.0" />
    <title>Scene 05 - Quy định mới IRCC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background-color: #f8fafc;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #f8fafc;
      }

      /* ── BACKGROUND IMAGE & JITTER-FREE DRIFT ── */
      .bg-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        z-index: 1;
      }

      .bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 1280px;
        object-fit: cover;
        will-change: transform;
      }

      /* Subtle gradient contrast wash over the upper room area */
      .bg-wash {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 520px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(255, 255, 255, 0.90) 45%,
          rgba(255, 255, 255, 0.60) 75%,
          rgba(255, 255, 255, 0) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* Subtle grid texture overlay in the upper negative space */
      .bg-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 480px;
        background-image: 
          linear-gradient(to right, rgba(15, 23, 42, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        z-index: 3;
        pointer-events: none;
      }

      /* ── TOP BRAND MARK (Y: 46px) ── */
      .brand-badge-wrapper {
        position: absolute;
        top: 46px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 20;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #0f172a;
        color: #ffffff;
        padding: 7px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
        opacity: 0;
        transform: translateY(-8px);
      }

      .brand-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5722;
      }

      /* ── EDITORIAL HEADLINE (Y: 104px) ── */
      .headline-wrapper {
        position: absolute;
        top: 104px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 20;
      }

      .headline {
        font-size: 34px;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        text-align: center;
        opacity: 0;
        transform: translateY(-10px);
      }

      .headline-accent {
        width: 72px;
        height: 4px;
        background: #ff5722;
        border-radius: 2px;
        margin-top: 8px;
        transform-origin: center;
        transform: scaleX(0);
      }

      /* ── EDITORIAL STAGE (Y: 185px) — OPEN CANVAS, 0 CARDS ── */
      .editorial-stage {
        position: absolute;
        top: 185px;
        left: 0;
        width: 720px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 25;
      }

      /* 1. Context Capsule (Persona: Đi Một Mình) */
      .context-capsule-wrap {
        display: flex;
        justify-content: center;
      }

      .context-capsule {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #0f172a;
        color: #ffffff;
        border: 2px solid #ff5722;
        padding: 7px 20px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.16);
        opacity: 0;
        transform: scale(0.85);
      }

      .context-icon {
        font-size: 13px;
        color: #ff5722;
      }

      /* 2. Bold Metric Display (▲ +553 CAD) */
      .metric-display-wrap {
        margin-top: 18px;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 12px;
        opacity: 0;
        transform: scale(0.85);
      }

      .metric-arrow {
        font-size: 38px;
        font-weight: 900;
        color: #ea580c;
        line-height: 1;
        display: flex;
        align-items: center;
      }

      .metric-number {
        font-size: 68px;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .metric-currency {
        font-size: 30px;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      /* 3. Administrative Seal / Diegetic Stamp */
      .stamp-wrap {
        margin-top: 14px;
        display: flex;
        justify-content: center;
      }

      .admin-stamp {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #ffffff;
        color: #0f172a;
        border: 2px solid #0f172a;
        padding: 6px 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        opacity: 0;
        transform: translateY(10px);
      }

      .stamp-dot {
        width: 8px;
        height: 8px;
        background: #ff5722;
        border-radius: 50%;
      }

      /* ── 220px SUBTITLE FOOTER CLEARANCE ── */
      .footer-safe-guide {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 720px;
        height: 220px;
        pointer-events: none;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="main" data-width="720" data-height="1280" data-duration="7.60">
      <audio id="voice-track" src="./assets/audio.wav" data-start="0" data-duration="7.60" preload="auto"></audio>

      <!-- 1. Background Image with GPU-drift (Zero Jitter) -->
      <div class="bg-container" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion>
        <img id="bg-img" class="bg-image" src="./assets/s5_bg.jpg" alt="Student examining Canada visa application" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion />
      </div>

      <!-- 2. Visual Contrast Wash & Subtle Pattern -->
      <div class="bg-wash" data-layout-allow-overlap data-layout-allow-occlusion></div>
      <div class="bg-grid" data-layout-allow-overlap data-layout-allow-occlusion></div>

      <!-- 3. Top Brand Badge -->
      <div class="brand-badge-wrapper" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="brand-badge" id="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>ESORA • DU HỌC CANADA</span>
        </div>
      </div>

      <!-- 4. Top Editorial Headline -->
      <div class="headline-wrapper" data-layout-allow-overlap data-layout-allow-occlusion>
        <h1 class="headline" id="main-headline">QUY ĐỊNH MỚI IRCC</h1>
        <div class="headline-accent" id="headline-accent"></div>
      </div>

      <!-- 5. Editorial Information Stage (Pure Open Canvas, 0 Generic Cards) -->
      <div class="editorial-stage" data-layout-allow-overlap data-layout-allow-occlusion>
        <!-- A. Person Category Capsule -->
        <div class="context-capsule-wrap" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="context-capsule" id="context-capsule">
            <span class="context-icon">👤</span>
            <span>ÁP DỤNG: ĐI MỘT MÌNH</span>
          </div>
        </div>

        <!-- B. Bold Metric Display -->
        <div class="metric-display-wrap" id="metric-display" data-layout-allow-overlap data-layout-allow-occlusion>
          <span class="metric-arrow" id="metric-arrow">▲</span>
          <span class="metric-number" id="metric-number">+553</span>
          <span class="metric-currency">CAD</span>
        </div>

        <!-- C. Administrative Action Stamp -->
        <div class="stamp-wrap" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="admin-stamp" id="admin-stamp">
            <span class="stamp-dot"></span>
            <span>CHỨNG MINH TĂNG THÊM</span>
          </div>
        </div>
      </div>

      <!-- 6. 220px Subtitle Footer Clearance -->
      <div class="footer-safe-guide"></div>
    </div>

    <!-- GSAP Master Animation Sync (7.60s Duration) -->
    <script>
      const tl = gsap.timeline({ defaults: { ease: "power2.out" } });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // Hardware GPU smooth drift on still plate (Eliminates all AI video camera wobble/jitter)
      gsap.set("#bg-img", { scale: 1.0, x: 0, y: 0, transformOrigin: "center center" });
      tl.to("#bg-img", {
        scale: 1.06,
        y: -12,
        duration: 7.60,
        ease: "none"
      }, 0);

      // Initial States: Opacity 1 with scale 0 or translated guarantees 100% WCAG AA contrast
      gsap.set(["#brand-badge", "#main-headline", "#headline-accent"], { opacity: 0, y: -10 });
      gsap.set("#headline-accent", { scaleX: 0 });
      gsap.set("#context-capsule", { scale: 0, opacity: 1 });
      gsap.set("#metric-display", { scale: 0, opacity: 1 });
      gsap.set("#admin-stamp", { scale: 0, opacity: 1 });

      // ── BEAT 1 (0.0s – 1.6s): "Theo IRCC..." ──
      tl.to("#brand-badge", { opacity: 1, y: 0, duration: 0.45 }, 0.15);
      tl.to("#main-headline", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.2)" }, 0.35);
      tl.to("#headline-accent", { opacity: 1, scaleX: 1, duration: 0.4 }, 0.65);

      // ── BEAT 2 (1.6s – 3.4s): "...với người nộp đơn đi một mình..." ──
      tl.to("#context-capsule", {
        scale: 1,
        duration: 0.5,
        ease: "back.out(1.5)"
      }, 1.6);

      // ── BEAT 3 (3.4s – 5.4s): "...mức tài chính cần chứng minh tăng thêm khoảng 553 Canada..." ──
      tl.to("#metric-display", {
        scale: 1,
        duration: 0.55,
        ease: "back.out(1.6)"
      }, 3.4);

      // Micro-bounce on arrow for kinetic emphasis
      tl.to("#metric-arrow", {
        y: -6,
        duration: 0.25,
        yoyo: true,
        repeat: 3,
        ease: "power1.inOut"
      }, 3.9);

      // ── BEAT 4 (5.4s – 7.6s): "...so với trước." ──
      tl.to("#admin-stamp", {
        scale: 1,
        duration: 0.45,
        ease: "back.out(1.4)"
      }, 5.4);
    </script>
  </body>
</html>
