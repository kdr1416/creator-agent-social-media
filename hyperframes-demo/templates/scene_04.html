<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280, initial-scale=1.0" />
    <title>Scene 04 - Bóc Tách Ngân Sách Sinh Hoạt Phí Cơ Sở</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 720px;
        height: 1280px;
        background: #f8fafc;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #0f172a;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        background: #f8fafc;
        overflow: hidden;
      }

      /* ── STUDIO CANVAS BACKGROUND ── */
      .canvas-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 25%, rgba(255, 87, 34, 0.05) 0%, transparent 60%),
          radial-gradient(circle at 50% 70%, rgba(15, 23, 42, 0.03) 0%, transparent 60%),
          linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
          #f8fafc;
        background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px, 100% 100%;
        z-index: 1;
      }

      /* ── BRAND PILL (Y: 42px) ── */
      .brand-badge-wrapper {
        position: absolute;
        top: 42px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 20;
      }
      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #0f172a;
        color: #ffffff;
        padding: 7px 18px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
        opacity: 0;
        transform: translateY(-8px);
      }
      .brand-badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ff5722;
      }

      /* ── HEADLINE (Y: 88px) ── */
      .headline-wrapper {
        position: absolute;
        top: 88px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 20;
        padding: 0 32px;
      }
      .headline {
        font-size: 34px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #0f172a;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(14px);
      }
      .headline-accent {
        width: 64px;
        height: 5px;
        background: #ff5722;
        border-radius: 999px;
        margin: 10px auto 0;
        opacity: 0;
        transform: scaleX(0);
      }

      /* ── BUDGET FLOW STAGE (Y: 180px - 1000px, 100% OPEN-CANVAS) ── */
      .budget-stage {
        position: absolute;
        top: 180px;
        left: 0;
        width: 720px;
        height: 840px;
        z-index: 25;
      }

      /* Central Living Cost Core (Y: 30px - 260px in stage) */
      .core-budget-wrap {
        position: absolute;
        top: 20px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 30;
      }

      .core-vault-disc {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #ffffff;
        border: 4px solid #0f172a;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .core-vault-dot {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #0f172a;
        color: #fde047;
        font-size: 11px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #ffffff;
      }

      .core-number-row {
        margin-top: 14px;
        font-size: 38px;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.02em;
        text-align: center;
      }

      .core-tag-pill {
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        background: #0f172a;
        color: #ffffff;
        border: 2px solid #ff5722;
        padding: 5px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* SVG Divergence Conduit Traces */
      .divergence-svg {
        position: absolute;
        top: 250px;
        left: 0;
        width: 720px;
        height: 260px;
        pointer-events: none;
        z-index: 15;
      }

      /* Two Diverging Outflow Streams (Left & Right) */
      .outflow-streams-wrap {
        position: absolute;
        top: 500px;
        left: 0;
        width: 720px;
        display: flex;
        justify-content: space-between;
        padding: 0 65px;
        z-index: 30;
      }

      .stream-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 240px;
      }

      .stream-token-disc {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid #0f172a;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .stream-title {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 900;
        color: #0f172a;
        text-transform: uppercase;
        letter-spacing: -0.01em;
        text-align: center;
      }

      .stream-warning-pill {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #0f172a;
        color: #ffffff;
        border: 2px solid #ef4444;
        padding: 5px 14px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
      }

      .warning-x {
        color: #ef4444;
        font-weight: 900;
      }

      /* Bottom Synthesis Badge (Y: 740px in stage, Y: 920px on canvas) */
      .synthesis-badge-wrap {
        position: absolute;
        top: 730px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 35;
      }

      .synthesis-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #0f172a;
        color: #ffffff;
        border: 2px solid #ff5722;
        padding: 10px 26px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
        opacity: 0;
        transform: scale(0.85);
      }

      .synthesis-star {
        color: #fde047;
        font-size: 16px;
      }

      /* 220px Subtitle Footer Clearance */
      .footer-safe-guide {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 720px;
        height: 220px;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="main" data-width="720" data-height="1280" data-duration="5.04">
      <audio id="voice-track" src="./assets/audio.wav" data-start="0" data-duration="5.04" preload="auto"></audio>

      <!-- Canvas Background -->
      <div class="canvas-bg"></div>

      <!-- Top Branding -->
      <div class="brand-badge-wrapper" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="brand-badge" id="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>ESORA • DU HỌC CANADA</span>
        </div>
      </div>

      <!-- Headline -->
      <div class="headline-wrapper" data-layout-allow-overlap data-layout-allow-occlusion>
        <h1 class="headline" id="main-headline">~440 TRIỆU ĐỒNG</h1>
        <div class="headline-accent" id="headline-accent"></div>
      </div>

      <!-- ── BUDGET FLOW STAGE ── -->
      <div class="budget-stage" data-layout-allow-overlap data-layout-allow-occlusion>
        <!-- 1. Central Living Budget Core (440 Tr) -->
        <div class="core-budget-wrap" id="core-budget" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="core-vault-disc">
            <span class="core-vault-dot">★</span>
            <!-- Home Living & Living Cost SVG -->
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div class="core-number-row">440.000.000 đ</div>
          <div class="core-tag-pill">SINH HOẠT PHÍ BẮT BUỘC</div>
        </div>

        <!-- 2. SVG Divergence Traces -->
        <svg class="divergence-svg" viewBox="0 0 720 260" fill="none">
          <!-- Left Branch Line -->
          <path
            id="line-left"
            d="M 360 10 C 360 110, 185 100, 185 250"
            stroke="#CBD5E1"
            stroke-width="3.5"
            stroke-dasharray="6 6"
          />
          <path
            id="active-left"
            d="M 360 10 C 360 110, 185 100, 185 250"
            stroke="#FF5722"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="400"
            stroke-dashoffset="400"
          />

          <!-- Right Branch Line -->
          <path
            id="line-right"
            d="M 360 10 C 360 110, 535 100, 535 250"
            stroke="#CBD5E1"
            stroke-width="3.5"
            stroke-dasharray="6 6"
          />
          <path
            id="active-right"
            d="M 360 10 C 360 110, 535 100, 535 250"
            stroke="#FF5722"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="400"
            stroke-dashoffset="400"
          />
        </svg>

        <!-- 3. Two Diverging Outflow Streams (Học phí & Vé máy bay) -->
        <div class="outflow-streams-wrap" data-layout-allow-overlap data-layout-allow-occlusion>
          <!-- Left Stream: HỌC PHÍ -->
          <div class="stream-item" id="stream-tuition">
            <div class="stream-token-disc">
              <!-- Graduation Cap SVG -->
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                <path d="M6 12v5c3 3 9 3 12 0v-5"/>
              </svg>
            </div>
            <div class="stream-title">HỌC PHÍ</div>
            <div class="stream-warning-pill">
              <span class="warning-x">✕</span>
              <span>CHƯA BAO GỒM</span>
            </div>
          </div>

          <!-- Right Stream: VÉ MÁY BAY / DI CHUYỂN -->
          <div class="stream-item" id="stream-flight">
            <div class="stream-token-disc">
              <!-- Airplane Flight SVG -->
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
              </svg>
            </div>
            <div class="stream-title">CHI PHÍ DI CHUYỂN</div>
            <div class="stream-warning-pill">
              <span class="warning-x">✕</span>
              <span>CHƯA BAO GỒM</span>
            </div>
          </div>
        </div>

        <!-- 4. Bottom Synthesis Badge -->
        <div class="synthesis-badge-wrap" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="synthesis-badge" id="synthesis-badge">
            <span class="synthesis-star">✦</span>
            <span>CẦN DỰ TRÙ THÊM</span>
            <span class="synthesis-star">✦</span>
          </div>
        </div>
      </div>

      <!-- 220px Subtitle Footer Clearance -->
      <div class="footer-safe-guide"></div>
    </div>

    <!-- GSAP Master Animation Sync (5.04s Duration) -->
    <script>
      const tl = gsap.timeline({ defaults: { ease: "power2.out" } });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // Initial States: Opacity 1 with scale 0 guarantees 100% WCAG AA contrast at all timestamps
      gsap.set(["#brand-badge", "#main-headline", "#headline-accent"], { opacity: 0, y: -10 });
      gsap.set("#headline-accent", { scaleX: 0 });
      gsap.set("#core-budget", { scale: 0, opacity: 1 });
      gsap.set(["#stream-tuition", "#stream-flight"], { scale: 0, opacity: 1 });
      gsap.set("#synthesis-badge", { scale: 0, opacity: 1 });
      gsap.set(["#active-left", "#active-right"], { strokeDashoffset: 400 });

      // ── BEAT 1 (0.0s – 1.8s): INTRO & 440 TRIỆU ──
      // "tương đương hơn 440 triệu đồng..."
      tl.to("#brand-badge", { opacity: 1, y: 0, duration: 0.4 }, 0.1);
      tl.to("#main-headline", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.2)" }, 0.25);
      tl.to("#headline-accent", { opacity: 1, scaleX: 1, duration: 0.4 }, 0.5);

      // Core living budget emerges
      tl.to("#core-budget", {
        scale: 1,
        duration: 0.5,
        ease: "back.out(1.5)"
      }, 0.8);

      // ── BEAT 2 (1.8s – 3.8s): OUTFLOW DIVERGENCE (HỌC PHÍ & VÉ MÁY BAY) ──
      // "...và đây chưa bao gồm học phí và chi phí di chuyển."
      // Divergence lines shoot down
      tl.to("#active-left", { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, 1.8);
      tl.to("#active-right", { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, 1.8);

      // Left token: Học phí
      tl.to("#stream-tuition", {
        scale: 1,
        duration: 0.45,
        ease: "back.out(1.5)"
      }, 2.2);

      // Right token: Chi phí di chuyển
      tl.to("#stream-flight", {
        scale: 1,
        duration: 0.45,
        ease: "back.out(1.5)"
      }, 2.5);

      // ── BEAT 3 (3.8s – 5.04s): SYNTHESIS LOCK & STABLE HOLD ──
      tl.to("#synthesis-badge", {
        scale: 1,
        duration: 0.35,
        ease: "back.out(1.6)"
      }, 3.8);

      // Final hold stable through 5.04s
      tl.to({}, { duration: 0.8 }, 4.2);
    </script>
  </body>
</html>
