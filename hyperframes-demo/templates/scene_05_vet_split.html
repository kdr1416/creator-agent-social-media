<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 05 - Du Học Nghề VET: Tỷ Lệ 50/50</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0b0f19;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        background-color: #ffffff;
        overflow: hidden;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #0f172a;
      }

      /* Subtle Academic Grid Canvas */
      .canvas-bg {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(#e2e8f0 1.2px, transparent 1.2px),
          linear-gradient(to right, rgba(241, 245, 249, 0.6) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(241, 245, 249, 0.6) 1px, transparent 1px);
        background-size: 36px 36px, 72px 72px, 72px 72px;
        background-position: 0 0, 0 0, 0 0;
        opacity: 0.85;
      }

      /* Ambient Atmospheric Glows */
      .bg-glow-left {
        position: absolute;
        top: 300px;
        left: -80px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
        pointer-events: none;
      }
      .bg-glow-right {
        position: absolute;
        top: 300px;
        right: -80px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
        pointer-events: none;
      }

      /* Top Brand Badge */
      .brand-badge-wrapper {
        position: absolute;
        top: 36px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 50;
      }
      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 18px;
        background: #0f172a;
        color: #ffffff;
        border-radius: 9999px;
        font-family: "Montserrat", sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
        opacity: 0;
        transform: translateY(-10px);
      }
      .brand-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5722;
      }

      /* Headline Header */
      .headline-wrapper {
        position: absolute;
        top: 86px;
        left: 36px;
        right: 36px;
        text-align: center;
        z-index: 50;
      }
      .kicker {
        font-size: 14px;
        font-weight: 800;
        color: #ff5722;
        letter-spacing: 2.2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .headline {
        font-family: "Montserrat", sans-serif;
        font-size: 34px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        color: #0f172a;
        opacity: 0;
        transform: translateY(12px);
      }
      .headline span {
        color: #ff5722;
      }
      .headline-accent {
        width: 90px;
        height: 4px;
        background: linear-gradient(90deg, #ff5722, #f59e0b);
        border-radius: 2px;
        margin: 8px auto 0;
        transform: scaleX(0);
        transform-origin: center;
      }

      /* Stage Wrap */
      .stage-wrap {
        position: absolute;
        top: 220px;
        left: 0;
        width: 720px;
        height: 720px;
        z-index: 20;
      }

      /* Large Fraction Hero Metric: 1 / 2 */
      .fraction-hero {
        position: absolute;
        top: 30px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 12px;
        font-family: "Montserrat", sans-serif;
        z-index: 30;
      }
      .fraction-num {
        font-size: 72px;
        font-weight: 900;
        color: #0f172a;
        line-height: 1;
        opacity: 0;
        transform: scale(0.7);
      }
      .fraction-slash {
        font-size: 60px;
        font-weight: 900;
        color: #ff5722;
        line-height: 1;
        opacity: 0;
      }
      .fraction-tag {
        font-family: "Montserrat", sans-serif;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #64748b;
        text-transform: uppercase;
        margin-left: 8px;
        background: #f1f5f9;
        padding: 4px 12px;
        border-radius: 6px;
        opacity: 0;
      }

      /* Main VET Split Stage */
      .vet-split-container {
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%);
        width: 480px;
        height: 440px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Laser Slice Beam */
      .laser-beam {
        position: absolute;
        top: -30px;
        bottom: -30px;
        left: 50%;
        width: 4px;
        transform: translateX(-50%) scaleY(0);
        background: #ef4444;
        box-shadow: 0 0 16px #ef4444, 0 0 30px #f87171;
        z-index: 40;
        border-radius: 2px;
      }

      /* Left Side: 50% PASS */
      .split-side-left {
        position: absolute;
        left: 0;
        width: 240px;
        height: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 25;
      }

      /* Right Side: 50% FAIL */
      .split-side-right {
        position: absolute;
        right: 0;
        width: 240px;
        height: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 25;
      }

      /* Half Gear & Helmet SVG Container */
      .gear-svg-wrap {
        position: relative;
        width: 210px;
        height: 260px;
      }

      /* Metric Percent Labels */
      .side-metric-badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 18px;
        opacity: 0;
        transform: translateY(12px);
      }
      .badge-val {
        font-family: "Montserrat", sans-serif;
        font-size: 38px;
        font-weight: 900;
        line-height: 1;
      }
      .badge-desc {
        font-family: "Montserrat", sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 9999px;
      }
      .metric-left .badge-val { color: #059669; }
      .metric-left .badge-desc { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
      .metric-right .badge-val { color: #dc2626; }
      .metric-right .badge-desc { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

      /* Bottom Synthesis Proof Pill */
      .bottom-seal {
        position: absolute;
        bottom: 230px;
        left: 40px;
        right: 40px;
        background: #0f172a;
        border-radius: 14px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
        opacity: 0;
        transform: translateY(20px);
        z-index: 50;
      }
      .seal-text {
        font-family: "Montserrat", sans-serif;
        font-size: 14.5px;
        font-weight: 900;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: #f8fafc;
        text-align: center;
      }
      .seal-accent {
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="scene-05" data-width="720" data-height="1280" data-duration="5.55">
      <audio id="voice-track" class="clip" src="./assets/audio.wav" data-start="0" data-duration="5.55" preload="auto"></audio>

      <!-- Canvas Background -->
      <div class="canvas-bg"></div>
      <div class="bg-glow-left"></div>
      <div class="bg-glow-right"></div>

      <!-- Top Branding -->
      <div class="brand-badge-wrapper">
        <div class="brand-badge" id="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>ESORA • DU HỌC AUSTRALIA</span>
        </div>
      </div>

      <!-- Headline -->
      <div class="headline-wrapper">
        <div class="kicker">DU HỌC NGHỀ (VET VOCATIONAL)</div>
        <h1 class="headline" id="main-headline">RỦI RO <span>CHIA ĐÔI 50/50</span></h1>
        <div class="headline-accent" id="headline-accent"></div>
      </div>

      <!-- Main Stage -->
      <div class="stage-wrap">
        <!-- Fraction Hero: 1 / 2 CHẤP THUẬN -->
        <div class="fraction-hero">
          <div class="fraction-num" id="frac1">1</div>
          <div class="fraction-slash" id="fracSlash">/</div>
          <div class="fraction-num" id="frac2">2</div>
          <div class="fraction-tag" id="fracTag">CHỈ KHOẢNG MỘT NỬA ĐỖ</div>
        </div>

        <!-- VET Gear & Helmet Split Stage -->
        <div class="vet-split-container">
          <!-- Laser Beam Slicing Down the Center -->
          <div class="laser-beam" id="laserBeam"></div>

          <!-- Left Half: 50% ACCEPTED (Green / Bright) -->
          <div class="split-side-left" id="splitLeft">
            <div class="gear-svg-wrap">
              <svg width="210" height="260" viewBox="0 0 210 260">
                <defs>
                  <linearGradient id="gearGradPass" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#34d399" />
                    <stop offset="100%" stop-color="#059669" />
                  </linearGradient>
                  <linearGradient id="helmetGradPass" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#6ee7b7" />
                    <stop offset="100%" stop-color="#10b981" />
                  </linearGradient>
                </defs>

                <!-- Left Half of Industrial Gear (Center at X: 210, Y: 150, Radius: 120) -->
                <path d="M 210 30 
                         A 120 120 0 0 0 90 150 
                         A 120 120 0 0 0 210 270 
                         L 210 220 
                         A 70 70 0 0 1 140 150 
                         A 70 70 0 0 1 210 80 Z"
                      fill="url(#gearGradPass)" stroke="#047857" stroke-width="3" />
                
                <!-- Gear Cogs (Left Half) -->
                <rect x="70" y="135" width="25" height="30" rx="3" fill="#059669" />
                <rect x="95" y="65" width="25" height="30" rx="3" transform="rotate(-45 95 65)" fill="#059669" />
                <rect x="95" y="215" width="25" height="30" rx="3" transform="rotate(45 95 215)" fill="#059669" />

                <!-- Left Half of Safety Helmet (Center at X: 210, Y: 130) -->
                <path d="M 210 60 
                         C 140 60, 110 95, 105 130 
                         L 210 130 Z" 
                      fill="url(#helmetGradPass)" stroke="#047857" stroke-width="3" />
                <!-- Helmet Brim -->
                <path d="M 210 130 L 95 130 Q 90 142 105 142 L 210 142 Z" fill="#047857" />

                <!-- Shield Badge with Checkmark -->
                <g transform="translate(130, 110)">
                  <circle cx="25" cy="25" r="22" fill="#ffffff" stroke="#059669" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(5,150,105,0.25))" />
                  <path d="M 16 25 L 22 31 L 34 19" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                </g>
              </svg>
            </div>

            <!-- Left Metric Badge -->
            <div class="side-metric-badge metric-left" id="badgeLeft">
              <div class="badge-val">50%</div>
              <div class="badge-desc">CHẤP THUẬN</div>
            </div>
          </div>

          <!-- Right Half: 50% REJECTED (Red / Danger / Dropped) -->
          <div class="split-side-right" id="splitRight">
            <div class="gear-svg-wrap">
              <svg width="210" height="260" viewBox="0 0 210 260">
                <defs>
                  <linearGradient id="gearGradFail" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#dc2626" />
                    <stop offset="100%" stop-color="#991b1b" />
                  </linearGradient>
                  <linearGradient id="helmetGradFail" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ef4444" />
                    <stop offset="100%" stop-color="#b91c1c" />
                  </linearGradient>
                </defs>

                <!-- Right Half of Industrial Gear (Center at X: 0, Y: 150, Radius: 120) -->
                <path d="M 0 30 
                         A 120 120 0 0 1 120 150 
                         A 120 120 0 0 1 0 270 
                         L 0 220 
                         A 70 70 0 0 0 70 150 
                         A 70 70 0 0 0 0 80 Z"
                      fill="url(#gearGradFail)" stroke="#7f1d1d" stroke-width="3" />
                
                <!-- Gear Cogs (Right Half) -->
                <rect x="115" y="135" width="25" height="30" rx="3" fill="#dc2626" />
                <rect x="90" y="80" width="25" height="30" rx="3" transform="rotate(45 90 80)" fill="#dc2626" />
                <rect x="90" y="200" width="25" height="30" rx="3" transform="rotate(-45 90 200)" fill="#dc2626" />

                <!-- Right Half of Safety Helmet (Center at X: 0, Y: 130) -->
                <path d="M 0 60 
                         C 70 60, 100 95, 105 130 
                         L 0 130 Z" 
                      fill="url(#helmetGradFail)" stroke="#7f1d1d" stroke-width="3" />
                <!-- Helmet Brim -->
                <path d="M 0 130 L 115 130 Q 120 142 105 142 L 0 142 Z" fill="#7f1d1d" />

                <!-- Warning Shield Badge with Cross -->
                <g transform="translate(30, 110)">
                  <circle cx="25" cy="25" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(220,38,38,0.25))" />
                  <path d="M 17 17 L 33 33 M 33 17 L 17 33" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" />
                </g>
              </svg>
            </div>

            <!-- Right Metric Badge -->
            <div class="side-metric-badge metric-right" id="badgeRight">
              <div class="badge-val">50%</div>
              <div class="badge-desc">TỪ CHỐI</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Synthesis Proof Pill -->
      <div class="bottom-seal" id="bottomSeal">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="seal-text">
          CỨ 2 HỒ SƠ DU HỌC NGHỀ • <span class="seal-accent">1 HỒ SƠ BỊ TỪ CHỐI VISA</span>
        </span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-05"] = tl;

      // Initial States
      gsap.set("#splitLeft", { x: 0, opacity: 0 });
      gsap.set("#splitRight", { x: 0, opacity: 0 });
      gsap.set("#laserBeam", { scaleY: 0, opacity: 0 });
      gsap.set("#badgeLeft", { opacity: 0, y: 15 });
      gsap.set("#badgeRight", { opacity: 0, y: 15 });
      gsap.set("#bottomSeal", { y: 20, opacity: 0 });

      // 0.1s: Header reveal
      tl.to("#brand-badge", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.1)
        .to("#main-headline", { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.25)
        .to("#headline-accent", { scaleX: 1, duration: 0.35 }, 0.45);

      // 0.6s: "Đặc biệt với nhóm du học nghề VET..."
      // Whole Gear appears joined together as a single unit
      tl.to("#splitLeft", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.6)
        .to("#splitRight", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.6);

      // 1.2s - 2.0s: Hero Fraction 1/2 pops in
      tl.to("#frac1", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.2)
        .to("#fracSlash", { opacity: 1, duration: 0.2 }, 1.4)
        .to("#frac2", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.5)
        .to("#fracTag", { opacity: 1, duration: 0.3 }, 1.7);

      // 2.2s: Laser beam slices down between the two halves!
      tl.to("#laserBeam", {
        scaleY: 1,
        opacity: 1,
        duration: 0.25,
        ease: "power3.in"
      }, 2.2)
      .to("#laserBeam", {
        opacity: 0,
        duration: 0.3,
        ease: "power2.out"
      }, 2.6);

      // 2.5s - 3.6s: "...tỷ lệ hồ sơ được chấp thuận chỉ khoảng một nửa."
      // The two halves cleanly split apart:
      // Left stays proud & glows (+ checkmark)
      // Right half shifts right and tilts downward slightly (-25px X, +15px Y, tilt 4deg)
      tl.to("#splitLeft", {
        x: -28,
        duration: 0.7,
        ease: "power2.out"
      }, 2.5)
      .to("#splitRight", {
        x: 28,
        y: 16,
        rotate: 3.5,
        duration: 0.7,
        ease: "power2.out"
      }, 2.5)
      .to("#badgeLeft", {
        opacity: 1,
        y: 0,
        duration: 0.4,
        ease: "back.out(1.5)"
      }, 2.9)
      .to("#badgeRight", {
        opacity: 1,
        y: 0,
        duration: 0.4,
        ease: "back.out(1.5)"
      }, 3.1);

      // 4.0s: Bottom synthesis pill slams in
      tl.to("#bottomSeal", {
        opacity: 1,
        y: 0,
        duration: 0.45,
        ease: "back.out(1.5)"
      }, 4.0);

      // Hold until end of narration (5.55s)
      tl.to({}, { duration: 0.8 }, 4.75);
    </script>
  </body>
</html>
