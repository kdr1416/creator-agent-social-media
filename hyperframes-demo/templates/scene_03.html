<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>Scene 3 - HYBRID: Living Cost Base for Single Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ── LIVING BACKGROUND VIDEO PLATE (VEO 720x1280) ── */
      .bg-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }
      .bg-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Subtle top contrast wash for perfect WCAG AA readability on cream wall */
      .top-gradient-wash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 480px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.92) 0%,
          rgba(255, 255, 255, 0.75) 45%,
          rgba(255, 255, 255, 0) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* Subtitle protection footer wash (bottom 200px) */
      .bottom-gradient-wash {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 200px;
        background: linear-gradient(
          0deg,
          rgba(15, 23, 42, 0.6) 0%,
          rgba(15, 23, 42, 0.2) 60%,
          rgba(15, 23, 42, 0) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* ── TOP BRAND MARK (Safe zone: top 55px, ESORA) ── */
      .brand-badge-wrapper {
        position: absolute;
        top: 55px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 20;
      }
      .brand-badge {
        background: #0f172a;
        color: #ffffff;
        padding: 8px 24px;
        border-radius: 999px;
        font-family: "Montserrat", sans-serif;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
        display: flex;
        align-items: center;
        gap: 8px;
        transform: translateY(-20px);
      }
      .brand-badge-dot {
        width: 7px;
        height: 7px;
        background: #ff6b2b;
        border-radius: 50%;
      }

      /* ── OPEN-CANVAS HEADLINE (Y: 130px) ── */
      .headline-container {
        position: absolute;
        top: 130px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 25;
        text-align: center;
        padding: 0 30px;
      }
      .main-title {
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 36px;
        line-height: 1.15;
        color: #0f172a;
        letter-spacing: -0.5px;
        margin: 0;
        opacity: 0;
        transform: translateY(18px);
      }
      .title-accent-bar {
        width: 140px;
        height: 4.5px;
        background: #ff6b2b;
        border-radius: 3px;
        margin-top: 12px;
        transform: scaleX(0);
        transform-origin: center;
      }

      /* ── METRIC STAGE (Y: 235px) ── */
      .metric-stage {
        position: absolute;
        top: 235px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 25;
      }

      .metric-badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: #ffffff;
        color: #0f172a;
        padding: 10px 24px;
        border-radius: 999px;
        border: 2px solid #0f172a;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        opacity: 0;
        transform: translateY(16px);
      }
      .metric-icon-wrap {
        width: 28px;
        height: 28px;
        background: #0f172a;
        color: #fde047;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 14px;
      }
      .metric-text {
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 20px;
        color: #0f172a;
        letter-spacing: 0.5px;
      }
      .metric-unit {
        color: #c2410c;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="main" data-width="720" data-height="1280" data-duration="5.68">
      <!-- Living Veo Background Video: Student calculating living costs -->
      <div class="bg-container">
        <video
          id="bg-video"
          class="bg-video clip"
          src="./assets/bg.mp4"
          data-start="0"
          data-duration="5.68"
          playsinline
          muted
          autoplay
          loop
        ></video>
      </div>

      <!-- Atmospheric Wash Layers for WCAG AA Contrast -->
      <div class="top-gradient-wash" data-layout-allow-overlap data-layout-allow-occlusion></div>
      <div class="bottom-gradient-wash" data-layout-allow-overlap data-layout-allow-occlusion></div>

      <!-- Voice Track (Duration 5.68s) -->
      <audio id="voice-track" class="clip" src="./assets/audio.wav" data-start="0" data-duration="5.68" preload="auto"></audio>

      <!-- Top Branding: ESORA • DU HỌC CANADA -->
      <div class="brand-badge-wrapper" id="brand-badge" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>ESORA • DU HỌC CANADA</span>
        </div>
      </div>

      <!-- Open-Canvas Headline -->
      <div class="headline-container" data-layout-allow-overlap data-layout-allow-occlusion>
        <h1 class="main-title" id="main-title">SINH HOẠT PHÍ TỐI THIỂU</h1>
        <div class="title-accent-bar" id="title-accent"></div>
      </div>

      <!-- Metric Indicator Stage -->
      <div class="metric-stage" id="metric-stage" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="metric-badge" id="metric-badge">
          <div class="metric-icon-wrap">$</div>
          <span class="metric-text">23.400 <span class="metric-unit">CAD / NĂM</span></span>
        </div>
      </div>
    </div>

    <!-- GSAP DETERMINISTIC ANIMATION SCRIPT -->
    <script>
      const tl = gsap.timeline({ defaults: { ease: "power2.out" } });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // ── BEAT 1 (0.0s – 1.8s): ENTRANCE & BRAND MARK ──
      tl.to("#brand-badge .brand-badge", {
        y: 0,
        duration: 0.4,
        ease: "power2.out"
      }, 0.1);

      // Main headline enters with authority
      tl.to("#main-title", {
        opacity: 1,
        y: 0,
        duration: 0.65,
        ease: "back.out(1.4)"
      }, 0.5);

      // Orange accent bar expands
      tl.to("#title-accent", {
        scaleX: 1,
        duration: 0.45,
        ease: "power2.inOut"
      }, 1.0);

      // ── BEAT 2 (1.8s – 3.8s): METRIC VALUE LOCK ──
      tl.to("#metric-badge", {
        opacity: 1,
        y: 0,
        duration: 0.55,
        ease: "back.out(1.6)"
      }, 2.0);

      // ── BEAT 3 (3.8s – 5.68s): STABLE HOLD ──
      tl.to({}, { duration: 1.88 }, 3.8);
    </script>
  </body>
</html>
