<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>Scene 17 - Finale: Strategic Guidance & Confident Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #ffffff;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ── LIVING BACKGROUND VIDEO PLATE (VEO 720x1280) ── */
      .bg-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }
      .bg-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ── ATMOSPHERIC CONTRAST WASHES ── */
      .top-gradient-wash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 480px;
        background: linear-gradient(
          180deg,
          rgba(15, 23, 42, 0.85) 0%,
          rgba(15, 23, 42, 0.55) 35%,
          rgba(15, 23, 42, 0.2) 65%,
          rgba(15, 23, 42, 0) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* Subtitle protection footer wash (bottom 200px) */
      .bottom-gradient-wash {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 200px;
        background: linear-gradient(
          0deg,
          rgba(15, 23, 42, 0.6) 0%,
          rgba(15, 23, 42, 0.25) 50%,
          rgba(15, 23, 42, 0) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* ── TOP BRAND MARK (Client: ESORA) ── */
      .brand-badge-wrapper {
        position: absolute;
        top: 55px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 20;
      }
      .brand-badge {
        background: #0f172a;
        color: #ffffff;
        padding: 8px 24px;
        border-radius: 999px;
        font-family: "Montserrat", sans-serif;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        border: 2px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.3);
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        transform: translateY(-12px);
      }
      .brand-badge-dot {
        width: 7px;
        height: 7px;
        background: #ff6b2b;
        border-radius: 50%;
      }

      /* ── OPEN-CANVAS HEADLINE (Y: 125px) ── */
      .headline-container {
        position: absolute;
        top: 125px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 25;
        text-align: center;
        padding: 0 30px;
      }
      .main-title {
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 38px;
        line-height: 1.15;
        color: #ffffff;
        letter-spacing: -0.5px;
        margin: 0;
        text-shadow: 0 4px 18px rgba(15, 23, 42, 0.5);
        opacity: 0;
        transform: translateY(18px);
      }
      .title-accent-bar {
        width: 140px;
        height: 4.5px;
        background: #fde047;
        border-radius: 3px;
        margin-top: 10px;
        box-shadow: 0 2px 10px rgba(253, 224, 71, 0.45);
        transform: scaleX(0);
        transform-origin: center;
      }

      /* ── STRATEGIC ANCHOR & GUIDANCE BADGE (Y: 220px) ── */
      .anchor-stage {
        position: absolute;
        top: 220px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 25;
      }

      .guiding-star-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        opacity: 0;
        transform: scale(0.6) rotate(-20deg);
      }

      .anchor-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #0f172a;
        color: #ffffff;
        padding: 10px 26px;
        border-radius: 999px;
        border: 2px solid #ff6b2b;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.35);
        opacity: 0;
        transform: translateY(15px);
      }
      .anchor-text {
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 18px;
        color: #ffffff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .anchor-star {
        color: #fde047;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="main" data-width="720" data-height="1280" data-duration="6">
      <!-- Living Veo Background Video -->
      <div class="bg-container">
        <video
          id="bg-video"
          class="bg-video clip"
          src="./assets/bg.mp4"
          data-start="0"
          data-duration="6"
          playsinline
          muted
          autoplay
          loop
        ></video>
      </div>

      <!-- Atmospheric Wash Layers for WCAG AA Contrast -->
      <div class="top-gradient-wash" data-layout-allow-overlap data-layout-allow-occlusion></div>
      <div class="bottom-gradient-wash" data-layout-allow-overlap data-layout-allow-occlusion></div>

      <!-- Voice Track (Duration 6.00s) -->
      <audio id="voice-track" class="clip" src="./assets/audio.wav" data-start="0" data-duration="6" preload="auto"></audio>

      <!-- Top Branding: ESORA • DU HỌC CANADA -->
      <div class="brand-badge-wrapper" id="brand-badge" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>ESORA • DU HỌC CANADA</span>
        </div>
      </div>

      <!-- Open-Canvas Headline -->
      <div class="headline-container" data-layout-allow-overlap data-layout-allow-occlusion>
        <h1 class="main-title" id="main-title">TÍNH ĐÚNG TỪ ĐẦU</h1>
        <div class="title-accent-bar" id="title-accent"></div>
      </div>

      <!-- Strategic Climax Anchor Badge -->
      <div class="anchor-stage" id="anchor-stage" data-layout-allow-overlap data-layout-allow-occlusion>
        <!-- 8-Point Guiding Compass Star -->
        <div class="guiding-star-container" id="guiding-star">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
            <circle cx="22" cy="22" r="20" fill="rgba(15, 23, 42, 0.75)" stroke="#FF6B2B" stroke-width="2"/>
            <polygon points="22,6 25,18 37,22 25,26 22,38 19,26 7,22 19,18" fill="#FDE047"/>
            <circle cx="22" cy="22" r="3.5" fill="#0F172A"/>
          </svg>
        </div>

        <!-- Synthesis Badge: AN TÂM DU HỌC -->
        <div class="anchor-badge" id="anchor-badge">
          <span class="anchor-star">✦</span>
          <span class="anchor-text">AN TÂM DU HỌC</span>
        </div>
      </div>
    </div>

    <!-- GSAP DETERMINISTIC ANIMATION SCRIPT -->
    <script>
      const tl = gsap.timeline({ defaults: { ease: "power2.out" } });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // ── BEAT 1 (0.0s – 1.8s): ENTRANCE & HEADLINE HOOK ──
      // Top brand badge settles
      tl.to("#brand-badge .brand-badge", {
        opacity: 1,
        y: 0,
        duration: 0.5,
        ease: "power2.out"
      }, 0.2);

      // Main headline enters with authority
      tl.to("#main-title", {
        opacity: 1,
        y: 0,
        duration: 0.65,
        ease: "back.out(1.4)"
      }, 0.5);

      // Warm Yellow accent bar expands
      tl.to("#title-accent", {
        scaleX: 1,
        duration: 0.45,
        ease: "power2.inOut"
      }, 0.95);

      // ── BEAT 2 (1.8s – 3.8s): GUIDING COMPASS & STRATEGIC ANCHOR LOCK ──
      // Guiding compass star appears
      tl.to("#guiding-star", {
        opacity: 1,
        scale: 1,
        rotation: 0,
        duration: 0.5,
        ease: "back.out(1.8)"
      }, 2.0);

      // Synthesis badge locks securely into place
      tl.to("#anchor-badge", {
        opacity: 1,
        y: 0,
        duration: 0.5,
        ease: "back.out(1.5)"
      }, 2.6);

      // ── BEAT 3 (3.8s – 6.0s): TRIUMPHANT HOLD ──
      // Stable hold to savor the confident campus walk and definitive message
      tl.to({}, { duration: 2.2 }, 3.8);
    </script>
  </body>
</html>
