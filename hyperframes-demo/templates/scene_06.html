<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280, initial-scale=1.0" />
    <title>Scene 06 - Đi Cùng Gia Đình: Thêm Người → Tăng Tài Chính</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 720px;
        height: 1280px;
        background: #0f172a;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #0f172a;
        overflow: hidden;
      }

      /* ── BACKGROUND LIVING PLATE (HYBRID) ── */
      .bg-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }
      .bg-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Subtle top contrast wash for WCAG AA readability on daylight background */
      .top-gradient-wash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 480px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.94) 0%,
          rgba(255, 255, 255, 0.78) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        z-index: 5;
        pointer-events: none;
      }

      /* ── BRAND PILL ── */
      .brand-badge-wrapper {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 20;
      }
      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #0f172a;
        color: #ffffff;
        padding: 8px 20px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.15);
        opacity: 0;
        transform: translateY(-10px);
      }
      .brand-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5722;
      }

      /* ── HEADLINE ── */
      .headline-wrapper {
        position: absolute;
        top: 102px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 20;
        padding: 0 32px;
      }
      .headline {
        font-size: 38px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #0f172a;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(16px);
      }
      .headline-bar {
        width: 72px;
        height: 5px;
        background: #ff5722;
        border-radius: 999px;
        margin: 12px auto 0;
        opacity: 0;
        transform: scaleX(0);
      }

      /* ── FORMULA CARD ── */
      .formula-stage {
        position: absolute;
        top: 228px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 25;
      }

      .formula-card {
        background: #ffffff;
        border: 2px solid #0f172a;
        border-radius: 24px;
        padding: 22px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
        opacity: 0;
        transform: scale(0.9) translateY(16px);
      }

      .formula-main-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .formula-part {
        font-size: 24px;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }

      .formula-arrow {
        font-size: 26px;
        font-weight: 900;
        color: #c2410c;
      }

      .formula-highlight {
        color: #c2410c;
      }

      .formula-subtext-pill {
        display: inline-flex;
        align-items: center;
        background: #0f172a;
        color: #ffffff;
        padding: 6px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="main" data-width="720" data-height="1280" data-duration="4.20">
      <!-- Living Veo Plate (Family arranging passports on wooden table) -->
      <div class="bg-container">
        <video
          id="bg-video"
          class="bg-video clip"
          src="./assets/bg.mp4"
          data-start="0"
          data-duration="4.20"
          playsinline
          muted
          autoplay
          loop
        ></video>
      </div>

      <!-- Contrast Wash Layer for WCAG AA -->
      <div class="top-gradient-wash" data-layout-allow-overlap data-layout-allow-occlusion></div>

      <!-- Voice Audio Track (4.20s) -->
      <audio id="voice-track" class="clip" src="./assets/audio.wav" data-start="0" data-duration="4.20" preload="auto"></audio>

      <!-- Brand Mark -->
      <div class="brand-badge-wrapper" id="brand-badge" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>ESORA • DU HỌC CANADA</span>
        </div>
      </div>

      <!-- Headline -->
      <div class="headline-wrapper" data-layout-allow-overlap data-layout-allow-occlusion>
        <h1 class="headline" id="main-headline">ĐI CÙNG GIA ĐÌNH</h1>
        <div class="headline-bar" id="headline-bar"></div>
      </div>

      <!-- Formula Stage -->
      <div class="formula-stage" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="formula-card" id="formula-card">
          <div class="formula-main-row">
            <span class="formula-part">THÊM NGƯỜI</span>
            <span class="formula-arrow">→</span>
            <span class="formula-part formula-highlight">TĂNG TÀI CHÍNH</span>
          </div>
          <div class="formula-subtext-pill">
            <span>QUY MÔ HỘ GIA ĐÌNH</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Entry sequence
      tl.to(
        "#brand-badge .brand-badge",
        {
          opacity: 1,
          y: 0,
          duration: 0.45,
          ease: "power3.out",
        },
        0.1
      );

      tl.to(
        "#main-headline",
        {
          opacity: 1,
          y: 0,
          duration: 0.5,
          ease: "power3.out",
        },
        0.25
      );

      tl.to(
        "#headline-bar",
        {
          opacity: 1,
          scaleX: 1,
          duration: 0.45,
          ease: "back.out(1.5)",
        },
        0.5
      );

      tl.to(
        "#formula-card",
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.6,
          ease: "back.out(1.2)",
        },
        0.8
      );

      // Subtle breathing motion
      tl.to(
        "#formula-card",
        {
          y: -4,
          duration: 1.4,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        1.8
      );

      // Subtle exit ease
      tl.to(
        ["#formula-card", "#main-headline", "#headline-bar"],
        {
          opacity: 0.9,
          duration: 0.4,
          ease: "power2.inOut",
        },
        3.8
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
