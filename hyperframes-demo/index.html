<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280, initial-scale=1.0" />
    <title>Scene 13 - Cổng Đại Học Chưa Là Đích</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 720px;
        height: 1280px;
        background: #ffffff;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #0f172a;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        background: #ffffff;
        overflow: hidden;
      }

      .canvas-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 25%, rgba(255, 107, 43, 0.05) 0%, transparent 60%),
          radial-gradient(circle at 50% 75%, rgba(15, 23, 42, 0.03) 0%, transparent 60%),
          linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
          #ffffff;
        background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px, 100% 100%;
        z-index: 1;
      }

      .brand-header {
        position: absolute;
        top: 54px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10;
      }

      .brand-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff6b2b;
      }

      .brand-title {
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.15em;
        color: #0f172a;
      }

      .header-wrap {
        position: absolute;
        top: 130px;
        left: 64px;
        right: 64px;
        z-index: 10;
      }

      .header-tag {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #64748b;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .header-title {
        font-family: "Montserrat", sans-serif;
        font-size: 44px;
        font-weight: 900;
        line-height: 1.15;
        color: #0f172a;
      }

      .header-title span.accent {
        color: #ff6b2b;
      }

      .stage-area {
        position: absolute;
        top: 250px;
        left: 64px;
        width: 592px;
        height: 810px;
        z-index: 5;
      }

      .gate-through-svg {
        width: 100%;
        height: 100%;
      }

      .safe-footer-guard {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 720px;
        height: 200px;
        background: #ffffff;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="scene_13" data-width="720" data-height="1280" data-duration="3.945" data-no-timeline>
      <div class="canvas-bg"></div>

      <div class="brand-header">
        <div class="brand-dot"></div>
        <div class="brand-title">ESORA</div>
      </div>

      <div class="header-wrap">
        <div class="header-tag">Tầm Nhìn Lộ Trình</div>
        <div class="header-title">ĐẬU ĐẠI HỌC <span class="accent">CHƯA LÀ ĐÍCH</span></div>
      </div>

      <div class="stage-area">
        <svg class="gate-through-svg" viewBox="0 0 592 810" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- ═══════ 1. EXTENDED ROAD BEYOND ═══════ -->
          <path
            id="pathBeyond"
            d="M 296 460 C 296 340 220 280 220 120"
            stroke="#FF6B2B"
            stroke-width="7"
            stroke-linecap="round"
            stroke-dasharray="600"
            stroke-dashoffset="600"
          />

          <!-- CARD 2: ĐÍCH NGHỀ NGHIỆP (Ở đỉnh chân trời Y=80, sạch sẽ, không vướng chữ) -->
          <g transform="translate(220, 80)">
            <g id="careerGoal" opacity="0">
              <circle cx="0" cy="0" r="30" fill="#0F172A" stroke="#FF6B2B" stroke-width="3" />
              <polygon points="0,-16 5,-4 16,0 5,4 0,16 -5,4 -16,0 -5,-4" fill="#FF6B2B" />
              <!-- Card badge below star -->
              <rect x="-95" y="42" width="190" height="36" rx="18" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5" />
              <text x="0" y="65" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="1">ĐÍCH NGHỀ NGHIỆP</text>
            </g>
          </g>

          <!-- ═══════ 2. UNIVERSITY CAMPUS ARCHITECTURAL GATE (Y: 280 to 560) ═══════ -->
          <g id="campusGate">
            <!-- Left Pillar -->
            <rect x="140" y="300" width="28" height="260" rx="3" fill="#0F172A" />
            <rect x="130" y="280" width="48" height="20" rx="3" fill="#0F172A" />
            <circle cx="168" cy="330" r="4" fill="#64748B" />
            <circle cx="168" cy="530" r="4" fill="#64748B" />

            <!-- Right Pillar -->
            <rect x="424" y="300" width="28" height="260" rx="3" fill="#0F172A" />
            <rect x="414" y="280" width="48" height="20" rx="3" fill="#0F172A" />
            <circle cx="424" cy="330" r="4" fill="#64748B" />
            <circle cx="424" cy="530" r="4" fill="#64748B" />

            <!-- Top Arch Beam (No overlapping text) -->
            <path d="M 154 300 C 154 220 438 220 438 300" stroke="#0F172A" stroke-width="12" fill="none" />

            <!-- GATE DOOR LEFT -->
            <g id="gateDoorL">
              <rect x="168" y="316" width="128" height="240" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
              <line x1="184" y1="340" x2="280" y2="340" stroke="#E2E8F0" stroke-width="3" />
              <line x1="184" y1="420" x2="280" y2="420" stroke="#E2E8F0" stroke-width="3" />
              <line x1="184" y1="500" x2="280" y2="500" stroke="#E2E8F0" stroke-width="3" />
              <rect x="278" y="420" width="8" height="30" rx="2" fill="#FF6B2B" />
            </g>

            <!-- GATE DOOR RIGHT -->
            <g id="gateDoorR">
              <rect x="296" y="316" width="128" height="240" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
              <line x1="312" y1="340" x2="408" y2="340" stroke="#E2E8F0" stroke-width="3" />
              <line x1="312" y1="420" x2="408" y2="420" stroke="#E2E8F0" stroke-width="3" />
              <line x1="312" y1="500" x2="408" y2="500" stroke="#E2E8F0" stroke-width="3" />
              <rect x="306" y="420" width="8" height="30" rx="2" fill="#FF6B2B" />
            </g>
          </g>

          <!-- Approach Path from Bottom to Gate Entrance -->
          <line x1="296" y1="740" x2="296" y2="560" stroke="#0F172A" stroke-width="4" stroke-dasharray="8 8" />

          <!-- CARD 1: ĐẠI HỌC: ĐIỂM BẮT ĐẦU (Đặt tại Y=660 phía trước cổng, KHÔNG BỊ TRỤ HOẶC CHÂN NGƯỜI CHE) -->
          <g transform="translate(296, 660)">
            <g id="startPointLabel" opacity="0">
              <rect x="-165" y="-25" width="330" height="50" rx="25" fill="#0F172A" stroke="#FF6B2B" stroke-width="2.5" />
              <circle cx="-132" cy="0" r="6" fill="#FF6B2B" />
              <text x="8" y="6" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="15" fill="#FFFFFF" letter-spacing="1">ĐẠI HỌC: ĐIỂM BẮT ĐẦU</text>
            </g>
          </g>

          <!-- ═══════ 3. STUDENT RIG WALKING THROUGH GATE ═══════ -->
          <g id="studentRig" transform="translate(256, 540)">
            <ellipse cx="40" cy="170" rx="36" ry="10" fill="rgba(15, 23, 42, 0.14)" />
            <line x1="30" y1="126" x2="28" y2="168" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
            <line x1="50" y1="126" x2="52" y2="168" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
            <path d="M 22 64 L 58 64 L 64 126 L 16 126 Z" fill="#0F172A" rx="4" />
            <rect x="10" y="68" width="14" height="42" rx="4" fill="#FF6B2B" />
            <circle cx="40" cy="38" r="18" fill="#FDBA74" />
            <path d="M 16 30 L 40 18 L 64 30 L 40 38 Z" fill="#0F172A" />
            <g id="pushHand">
              <line x1="56" y1="74" x2="82" y2="80" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
              <circle cx="82" cy="80" r="5" fill="#FDBA74" />
            </g>
          </g>
        </svg>
      </div>

      <div class="safe-footer-guard"></div>

      <audio id="sceneAudio" class="clip" src="audio/scene_13.wav" data-start="0" data-duration="3.945"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = [tl];

      // 0.0s - 0.7s: Nhân vật bước đến trước cửa cổng trường
      tl.to("#studentRig", {
        y: 480,
        duration: 0.7,
        ease: "power1.out"
      }, 0);

      // 0.7s - 1.8s: Cánh cửa mở toang chuẩn xác tại bản lề X=168 và X=424
      tl.to("#gateDoorL", {
        scaleX: 0.08,
        svgOrigin: "168 436",
        duration: 0.8,
        ease: "power2.out"
      }, 0.7);

      tl.to("#gateDoorR", {
        scaleX: 0.08,
        svgOrigin: "424 436",
        duration: 0.8,
        ease: "power2.out"
      }, 0.7);

      // Sinh viên bước xuyên qua cổng mở, đi vào không gian chiều sâu
      tl.to("#studentRig", {
        y: 390,
        scale: 0.78,
        duration: 1.2,
        ease: "power1.out"
      }, 0.9);

      // Con đường tương lai vạch dài vượt qua cổng dẫn tới Đích Nghề Nghiệp
      tl.to("#pathBeyond", {
        strokeDashoffset: 0,
        duration: 1.3,
        ease: "power2.inOut"
      }, 1.1);

      // 1.3s - 2.2s: CẢ 2 CARD BAY LÊN RÕ RÀNG VÀ NỔI BẬT KHÔNG HỀ BỊ CHE KHUẤT:
      // Card 2: ĐÍCH NGHỀ NGHIỆP bay lên ở đỉnh đường chân trời
      tl.fromTo("#careerGoal",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "back.out(2)" },
        1.3
      );

      // Card 1: ĐẠI HỌC: ĐIỂM BẮT ĐẦU bay lên từ phía trước cổng
      tl.fromTo("#startPointLabel",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "back.out(1.8)" },
        1.7
      );

      tl.to({}, { duration: 1.0 }, 2.9);
    </script>
  </body>
</html>
